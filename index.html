```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastro</title>

<style>
:root{
    --bg:#0b0d10;
    --card:#14181d;
    --border:#242b33;
    --text:#e8edf2;
    --muted:#8e99a5;
    --accent:#2d6cdf;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
}

header{
    position:sticky;
    top:0;
    background:#0f1318;
    border-bottom:1px solid var(--border);
    padding:14px;
    z-index:10;
}

h1{
    font-size:22px;
}

.nav{
    margin-top:10px;
    display:flex;
    gap:8px;
}

button{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    border-color:var(--accent);
}

.container{
    max-width:900px;
    margin:auto;
    padding:16px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
}

.activity{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    cursor:grab;
}

.activity-name{
    font-weight:600;
}

.actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

input,
select,
textarea{
    width:100%;
    margin-top:6px;
    margin-bottom:10px;
    background:#0f1318;
    color:white;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
}

textarea{
    resize:vertical;
    min-height:80px;
}

.hidden{
    display:none;
}

.day{
    margin-bottom:24px;
}

.day-title{
    font-size:20px;
    margin-bottom:12px;
}

.state-box{
    background:var(--card);
    border:1px solid var(--border);
    padding:10px;
    border-radius:12px;
    margin-bottom:10px;
}

.timeline{
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
}

.slot{
    min-height:36px;
    border-bottom:1px solid #1c2229;
    padding:6px 10px;
    display:flex;
    gap:10px;
}

.time{
    width:60px;
    color:var(--muted);
}

.record{
    color:white;
}

.small{
    font-size:12px;
    color:var(--muted);
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    width:100%;
    max-width:500px;
    background:#11161b;
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
}

.quick-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:10px;
}

.quick-buttons button{
    padding:8px;
}
</style>
</head>
<body>

<header>
    <h1>Rastro</h1>

    <div class="nav">
        <button onclick="showHome()">Registro</button>
        <button onclick="showHistory()">Histórico</button>
        <button onclick="addActivity()">Nova Atividade</button>
    </div>
</header>

<div class="container">

    <div id="homeScreen"></div>

    <div id="historyScreen" class="hidden"></div>

</div>

<div id="modalContainer"></div>
