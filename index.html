```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastro</title>


<style>
:root{
    --bg:#0b0d10;
    --card:#14181d;
    --border:#242b33;
    --text:#e8edf2;
    --muted:#8e99a5;
    --accent:#2d6cdf;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
}

header{
    position:sticky;
    top:0;
    background:rgba(11,13,16,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
    padding:18px 22px;
    z-index:10;
}

h1{
    font-size:26px;
    font-weight:700;
    letter-spacing:.5px;
}

.nav{
    margin-top:14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    transition:.18s ease;
}

button:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
}

.container{
    max-width:980px;
    margin:auto;
    padding:28px 20px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.18);
}

.activity{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    cursor:grab;
}

.activity-name{
    font-weight:600;
    font-size:15px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

input,select,textarea{
    width:100%;
    margin-top:8px;
    margin-bottom:14px;
    background:#101419;
    color:var(--text);
    border:1px solid #2b3440;
    border-radius:12px;
    padding:12px;
}

textarea{
    resize:vertical;
    min-height:100px;
}

.hidden{display:none;}

.day{
    margin-bottom:34px;
    padding:20px;
    background:rgba(20,24,29,.55);
    border:1px solid var(--border);
    border-radius:20px;
}

.day-title{
    font-size:22px;
    margin-bottom:16px;
    font-weight:700;
}

.state-box{
    background:#101419;
    border:1px solid var(--border);
    padding:16px;
    border-radius:16px;
    margin-bottom:16px;
}

.timeline{
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    background:#11161b;
}

.slot{
    min-height:42px;
    border-bottom:1px solid rgba(255,255,255,.04);
    padding:8px 12px;
    display:flex;
    gap:14px;
}

.time{
    width:64px;
    color:var(--muted);
    font-size:13px;
}

.record{
    color:var(--text);
}

.small{
    font-size:12px;
    color:var(--muted);
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    width:100%;
    max-width:560px;
    background:#11161b;
    border:1px solid var(--border);
    border-radius:22px;
    padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.quick-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:12px;
}

.quick-buttons button{
    padding:10px;
}

@media(max-width:720px){
    .activity{
        flex-direction:column;
        align-items:flex-start;
    }

    .actions{
        width:100%;
    }

    .actions button{
        flex:1;
    }
}

.hero{background:linear-gradient(180deg,#171c23,#11161b);padding:24px;border:1px solid var(--border);border-radius:24px;margin-bottom:24px}
.metrics{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px}
.metric b{font-size:28px;display:block}
.section-label{margin:20px 0 10px;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.1em}
.activity-card{display:flex;justify-content:space-between;align-items:center;gap:20px}
.activity-meta{color:var(--muted);font-size:12px;margin-top:4px}
.archived-wrap{margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.restore-btn{border-color:var(--accent)}
.day-title{display:flex;justify-content:space-between}
.record{padding:8px 10px;background:#171c23;border-radius:10px;margin:4px 0}
.slot:has(.record){background:rgba(45,108,223,.05)}
</style>

</head>
<body>

<header>
    <h1>Rastro</h1>
    <div class="small">Arquivo pessoal da vida</div>
    <div class="nav">
        <button onclick="showHome()">Registro</button>
        <button onclick="showHistory()">Histórico</button>
        <button onclick="addActivity()">Nova Atividade</button>
    </div>
</header>

<div class="container">

    <div id="homeScreen"></div>

    <div id="historyScreen" class="hidden"></div>

</div>

<div id="modalContainer"></div>

<script>

const STATE_ACTIVITIES = [
"mente ao acordar",
"corpo ao acordar",
"disposição mental",
"disposição física"
];

const DEFAULT_ACTIVITIES = [
"Mente ao Acordar",
"Corpo ao Acordar",
"Disposição Mental",
"Disposição Física",
"Trabalho",
"Sono",
"Descanso",
"Treino",
"Leitura",
"Xadrez",
"Bíblia",
"Oração",
"Culto",
"Estudo Musical",
"Ensaio",
"Esposa",
"Filhos",
"Família",
"Redes Sociais",
"YouTube",
"Netflix",
"Casa",
"Meditação"
];

let activities =
JSON.parse(localStorage.getItem("rastro_activities"))
||
DEFAULT_ACTIVITIES.map(a=>({
name:a,
archived:false
}));

let records =
JSON.parse(localStorage.getItem("rastro_records"))
||
[];

function save(){
localStorage.setItem(
"rastro_activities",
JSON.stringify(activities)
);

localStorage.setItem(
"rastro_records",
JSON.stringify(records)
);
}

function showHome(){
document.getElementById("homeScreen").classList.remove("hidden");
document.getElementById("historyScreen").classList.add("hidden");
renderActivities();
}

function showHistory(){
document.getElementById("homeScreen").classList.add("hidden");
document.getElementById("historyScreen").classList.remove("hidden");
renderHistory();
}


function renderActivities(){

const home=document.getElementById("homeScreen");

const active=activities.filter(a=>!a.archived);
const archived=activities.filter(a=>a.archived);

home.innerHTML=`
<div class="hero">
<h2>Arquivo da Vida</h2>
<div class="small">Registro histórico contínuo</div>
<div class="metrics">
<div class="metric"><b>${records.length}</b>Registros</div>
<div class="metric"><b>${active.length}</b>Ativas</div>
<div class="metric"><b>${archived.length}</b>Arquivadas</div>
</div>
</div>
<div class="section-label">Atividades Ativas</div>
`;

active.forEach(activity=>{

const total=records.filter(r=>r.activity===activity.name).length;
const idx=activities.indexOf(activity);

const card=document.createElement("div");
card.className="card activity-card";

card.innerHTML=`
<div>
<div class="activity-name">${activity.name}</div>
<div class="activity-meta">${total} registro(s)</div>
</div>

<div class="actions">
<button onclick="openRegister('${activity.name}')">Registrar</button>
<button onclick="archiveActivity(${idx})">Arquivar</button>
<button onclick="deleteActivity(${idx})">Excluir</button>
</div>
`;

home.appendChild(card);
});

if(archived.length){
const div=document.createElement('div');
div.className='archived-wrap';
div.innerHTML=`<div class="section-label">Arquivadas</div>` +
archived.map(a=>{
const idx=activities.indexOf(a);
return `<div class="card activity-card">
<div><div class="activity-name">${a.name}</div></div>
<div class="actions"><button class="restore-btn" onclick="unarchiveActivity(${idx})">Restaurar</button></div>
</div>`;
}).join('');
home.appendChild(div);
}
}

function archiveActivity(index){
activities[index].archived=true;
save();
renderActivities();
}

function deleteActivity(index){

if(!confirm("Excluir atividade?")) return;

activities.splice(index,1);

save();
renderActivities();
}

function addActivity(){

const name=prompt("Nome da atividade");

if(!name) return;

activities.push({
name,
archived:false
});

save();
renderActivities();
}

function openRegister(activity){

const isState =
STATE_ACTIVITIES.includes(
activity.toLowerCase()
);

const today=
new Date().toISOString().split("T")[0];

let content="";

if(isState){

content=`
<label>Data</label>
<input id="date" type="date" value="${today}">

<label>Valor (-10 a +10)</label>
<input id="value" type="number" min="-10" max="10" value="0">

<label>Notas</label>
<textarea id="notes"></textarea>

<button onclick="saveStateRecord('${activity}')">
Salvar
</button>
`;

}else{

content=`
<label>Data</label>
<input id="date" type="date" value="${today}">

<label>Hora Inicial</label>
<input id="startTime" type="time">

<label>Duração</label>

<div class="quick-buttons">
${[
15,30,45,60,90,120,180,240
].map(v=>
`<button type="button"
onclick="setDuration(${v})">${formatDuration(v)}</button>`
).join("")}
</div>

<input id="duration" type="number" value="30">

<label>Notas</label>
<textarea id="notes"></textarea>

<button onclick="saveActivityRecord('${activity}')">
Salvar
</button>
`;
}

showModal(activity,content);

}

function formatDuration(min){

if(min===60) return "1h";
if(min===90) return "1h30";
if(min===120) return "2h";
if(min===180) return "3h";
if(min===240) return "4h";

return min+" min";
}

function setDuration(v){
document.getElementById("duration").value=v;
}

function saveStateRecord(activity){

records.push({
id:Date.now(),
activity,
date:date.value,
value:Number(value.value),
notes:notes.value
});

save();
closeModal();
}

function saveActivityRecord(activity){

records.push({
id:Date.now(),
activity,
date:date.value,
startTime:startTime.value,
duration:Number(duration.value),
notes:notes.value
});

save();
closeModal();
}

function showModal(title,content){

document.getElementById(
"modalContainer"
).innerHTML=
`
<div class="modal">
<div class="modal-content">
<h3>${title}</h3>
<br>
${content}
<br>
<button onclick="closeModal()">Fechar</button>
</div>
</div>
`;
}

function closeModal(){
document.getElementById(
"modalContainer"
).innerHTML="";
}

function renderHistory(){

const history=
document.getElementById(
"historyScreen"
);

history.innerHTML="";

const grouped={};

records.forEach(r=>{
if(!grouped[r.date])
grouped[r.date]=[];

grouped[r.date].push(r);
});

Object.keys(grouped)
.sort()
.reverse()
.forEach(date=>{

const day=document.createElement("div");
day.className="day";

const dayRecords=
grouped[date];

const stateRecords=
dayRecords.filter(r=>
STATE_ACTIVITIES.includes(
r.activity.toLowerCase()
));

const normalRecords=
dayRecords.filter(r=>
!STATE_ACTIVITIES.includes(
r.activity.toLowerCase()
));

let stateHTML="";

stateRecords.forEach(r=>{
stateHTML+=`
<div>
<strong>${r.activity}</strong>:
${r.value}
</div>
`;
});

let timelineHTML='';

for(let h=0;h<24;h++){

for(let m=0;m<60;m+=30){

const time=
String(h).padStart(2,'0')
+
':'
+
String(m).padStart(2,'0');

const slotRecords=
normalRecords
.filter(r=>r.startTime===time)
.sort((a,b)=>
a.startTime.localeCompare(
b.startTime
)
);

timelineHTML+=`
<div class="slot">

<div class="time">
${time}
</div>

<div>
${slotRecords.map(r=>`
<div class="record">
${r.activity}
(${formatDuration(r.duration)})
<br>
<span class="small">
<button onclick="editRecord(${r.id})">
Editar
</button>

<button onclick="deleteRecord(${r.id})">
Excluir
</button>
</span>
</div>
`).join("")}
</div>

</div>
`;
}
}

day.innerHTML=
`
<div class="day-title">${date}</div>

<div class="state-box">
${stateHTML || 'Sem registros de estado'}
</div>

<div class="timeline">
${timelineHTML}
</div>
`;

history.appendChild(day);

});

}

function deleteRecord(id){

records=
records.filter(
r=>r.id!==id
);

save();
renderHistory();
}

function editRecord(id){

const record=
records.find(
r=>r.id===id
);

if(!record) return;

const notes=
prompt(
"Editar notas",
record.notes || ""
);

if(notes===null) return;

record.notes=notes;

save();
renderHistory();
}

renderActivities();

</script>

</body>
</html>
```
