const COUNTER_DEFAULT_ICONS = {
    without:'shield-check',
    doing:'flame'
};

function counterIcon(counter){
    return counter?.icon || COUNTER_DEFAULT_ICONS[counter?.mode] || 'tally-5';
}

function counterDays(startDate){
    if(!startDate) return 0;
    const parts=String(startDate).split('-').map(Number);
    if(parts.length!==3 || parts.some(Number.isNaN)) return 0;
    const start=Date.UTC(parts[0],parts[1]-1,parts[2]);
    const todayRaw=localDateISO().split('-').map(Number);
    const today=Date.UTC(todayRaw[0],todayRaw[1]-1,todayRaw[2]);
    if(start>today) return 0;
    return Math.floor((today-start)/86400000)+1;
}

function formatCounterDate(date){
    if(!date) return '';
    const [y,m,d]=date.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    const raw=new Intl.DateTimeFormat('pt-BR',{day:'numeric',month:'short',year:'numeric'}).format(dt);
    return raw.replace(/\./g,'');
}

function counterDisplayTitle(counter){
    const title=String(counter?.title || '').trim();
    if(counter?.mode==='without') return `Sem ${title}`;
    return title;
}

function counterHistoryDays(item){
    if(!item?.startDate || !item?.endDate) return 0;

    const s=String(item.startDate).split('-').map(Number);
    const e=String(item.endDate).split('-').map(Number);

    if(s.length!==3 || e.length!==3 || s.some(Number.isNaN) || e.some(Number.isNaN)) return 0;

    const start=Date.UTC(s[0],s[1]-1,s[2]);
    const resetDay=Date.UTC(e[0],e[1]-1,e[2]);

    // endDate é o dia em que a contagem foi reiniciada.
    // A sequência anterior vale até o dia imediatamente anterior.
    return Math.max(0,Math.floor((resetDay-start)/86400000));
}

function counterHistoryEndDate(item){
    if(!item?.endDate) return '';
    const [y,m,d]=String(item.endDate).split('-').map(Number);
    if([y,m,d].some(Number.isNaN)) return '';
    const dt=new Date(y,m-1,d);
    dt.setDate(dt.getDate()-1);
    return localDateISO(dt);
}

function renderCounterHistoryHTML(counter){
    const history=Array.isArray(counter?.history) ? [...counter.history] : [];

    if(!history.length){
        return `
            <div class="counter-history">
                <div class="counter-history-head">
                    <strong>Histórico</strong>
                    <span>0 sequências encerradas</span>
                </div>
                <div class="counter-history-empty">
                    Quando você reiniciar este contador, a sequência encerrada ficará registrada aqui.
                </div>
            </div>`;
    }

    history.sort((a,b)=>String(b.resetAt||b.endDate||'').localeCompare(String(a.resetAt||a.endDate||'')));

    const items=history.map(item=>{
        const days=counterHistoryDays(item);
        const endDate=counterHistoryEndDate(item);
        const period=days>0
            ? `${formatCounterDate(item.startDate)} — ${formatCounterDate(endDate)}`
            : `Iniciada e reiniciada em ${formatCounterDate(item.endDate)}`;
        const resetDate=item.endDate || (item.resetAt ? localDateISO(new Date(item.resetAt)) : '');

        return `
            <div class="counter-history-item">
                <div class="counter-history-days">
                    ${days}
                    <small>${days===1?'dia':'dias'}</small>
                </div>
                <div>
                    <div class="counter-history-period">${escapeHTML(period)}</div>
                    ${resetDate?`<div class="counter-history-reset">Reiniciado em ${escapeHTML(formatCounterDate(resetDate))}</div>`:''}
                </div>
            </div>`;
    }).join('');

    return `
        <div class="counter-history">
            <div class="counter-history-head">
                <strong>Histórico</strong>
                <span>${history.length} ${history.length===1?'sequência encerrada':'sequências encerradas'}</span>
            </div>
            <div class="counter-history-list">${items}</div>
        </div>`;
}

function renderCounters(){
    const host=document.getElementById('countersScreen');
    if(!host) return;

    const sorted=[...counters].sort((a,b)=>{
        const da=counterDays(a.startDate), db=counterDays(b.startDate);
        return db-da || String(a.title||'').localeCompare(String(b.title||''),'pt-BR');
    });

    const cards=sorted.map(counter=>{
        const days=counterDays(counter.startDate);
        const unit=days===1?'dia':'dias';
        const cls=counter.mode==='without'?'without':'doing';
        const kind=counter.mode==='without'?'Sem fazer':'Fazendo';
        return `
            <article class="counter-card ${cls}" data-days="${days}" onclick="openCounterEditor(${inlineArg(counter.id)})" tabindex="0" role="button" aria-label="${escapeHTML(counterDisplayTitle(counter))}, ${days} ${unit}">
                <div class="counter-card-top">
                    <div class="counter-icon"><i data-lucide="${counterIcon(counter)}"></i></div>
                    <div class="counter-kind">${kind}</div>
                </div>
                <div class="counter-number">${days}</div>
                <div class="counter-unit">${unit}</div>
                <div class="counter-title">${escapeHTML(counterDisplayTitle(counter))}</div>
                <div class="counter-since">desde ${escapeHTML(formatCounterDate(counter.startDate))}</div>
            </article>`;
    }).join('');

    host.innerHTML=`
        <div class="counter-page">
            <div class="counter-toolbar">
                <div class="counter-toolbar-copy">
                    <h2>Seus dias</h2>
                    <p>Sequências que seguem em andamento.</p>
                </div>
                <button class="counter-add-btn" onclick="openNewCounter()"><i data-lucide="plus"></i> Novo</button>
            </div>
            ${cards
                ? `<div class="counter-grid">${cards}</div>`
                : `<div class="counter-empty">
                    <div class="counter-empty-icon"><i data-lucide="tally-5"></i></div>
                    <h3>Nenhum contador ainda</h3>
                    <p>Crie um contador para acompanhar há quantos dias algo continua acontecendo — ou deixou de acontecer.</p>
                    <button onclick="openNewCounter()"><i data-lucide="plus"></i> Criar contador</button>
                  </div>`}
        </div>`;
    lucide.createIcons();
}

    showModal('Editar contador',counterFormHTML(counter),'Contadores');
    syncCounterForm(false);
}

function syncCounterForm(changeDefaultIcon=true){
    const mode=document.getElementById('counterMode')?.value || 'without';
    const iconSelect=document.getElementById('counterIcon');
    if(changeDefaultIcon && iconSelect){
        const oldDefault=mode==='without'?COUNTER_DEFAULT_ICONS.doing:COUNTER_DEFAULT_ICONS.without;
        if(!iconSelect.value || iconSelect.value===oldDefault){
            iconSelect.value=COUNTER_DEFAULT_ICONS[mode];
        }
    }
    syncCounterPreview();
}

function syncCounterPreview(){
    const date=document.getElementById('counterStartDate')?.value || localDateISO();
    const days=counterDays(date);
    const out=document.getElementById('counterPreviewDays');
    const unit=document.getElementById('counterPreviewUnit');
    if(out) out.textContent=days;
    if(unit) unit.textContent=days===1?'dia':'dias';
}

function counterFormData(){
    return {
        mode:document.getElementById('counterMode')?.value || 'without',
        title:(document.getElementById('counterTitle')?.value || '').trim(),
        startDate:document.getElementById('counterStartDate')?.value || localDateISO(),
        icon:document.getElementById('counterIcon')?.value || 'tally-5'
    };
}

function createCounter(){
    const data=counterFormData();
    if(!data.title){
        document.getElementById('counterTitle')?.focus();
        showToast('Informe o que você quer contar.','error');
        return;
    }
    counters.push({id:newCounterId(),...data,createdAt:new Date().toISOString()});
    save();
    closeModal();
    renderCounters();
    showToast('Contador criado.');
}

function saveCounterEdit(id){
    const counter=counters.find(c=>String(c.id)===String(id));
    if(!counter) return;
    const data=counterFormData();
    if(!data.title){
        document.getElementById('counterTitle')?.focus();
        showToast('Informe o que você quer contar.','error');
        return;
    }
    Object.assign(counter,data, {updatedAt:new Date().toISOString()});
    save();
    closeModal();
    renderCounters();
    showToast('Contador atualizado.');
}

function resetCounterToday(id){
    const counter=counters.find(c=>String(c.id)===String(id));
    if(!counter) return;
    if(!confirm('Reiniciar este contador a partir de hoje?')) return;
    counter.history=Array.isArray(counter.history)?counter.history:[];
    counter.history.push({startDate:counter.startDate,endDate:localDateISO(),resetAt:new Date().toISOString()});
    counter.startDate=localDateISO();
    counter.updatedAt=new Date().toISOString();
    save();
    closeModal();
    renderCounters();
    showToast('Contador reiniciado.');
}

function deleteCounter(id){
    if(!confirm('Excluir este contador?')) return;
    counters=counters.filter(c=>String(c.id)!==String(id));
    save();
    closeModal();
    renderCounters();
    showToast('Contador excluído.');
}

function formatDateBR(date){
    const [y,m,d]=date.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    const raw=new Intl.DateTimeFormat('pt-BR',{day:'numeric',month:'long',year:'numeric'}).format(dt);
    return raw.charAt(0).toUpperCase()+raw.slice(1);
}

function formatWeekday(date){
    const [y,m,d]=date.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    const raw=new Intl.DateTimeFormat('pt-BR',{weekday:'long'}).format(dt);
    return raw.charAt(0).toUpperCase()+raw.slice(1);
}

function monthKey(year,month){
    return `${year}-${String(month+1).padStart(2,'0')}`;
}

function renderHistory(){
    if(selectedDate){
        setScreenHeader('Rastro do dia',formatDateBR(selectedDate));
        renderDay(selectedDate);
    }else{
        setScreenHeader('Histórico','Seu rastro ao longo do tempo');
        renderCalendar();
    }
    lucide.createIcons();
}

function renderCalendar(){
    const history=document.getElementById("historyScreen");
    const months=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    const firstDay=new Date(currentYear,currentMonth,1);
    const totalDays=new Date(currentYear,currentMonth+1,0).getDate();
    const startWeekDay=firstDay.getDay();
    const key=monthKey(currentYear,currentMonth);
    const monthRecords=records.filter(r=>(r.date||'').startsWith(key));
    const rewardsByDate=new Set(monthRecords.filter(r=>r.activity==='Recompensa').map(r=>r.date));
    const actualMonthRecords=monthRecords.filter(r=>r.activity!=='Recompensa');
    const counts={};
    actualMonthRecords.forEach(r=>{counts[r.date]=(counts[r.date]||0)+1;});
    const recordedDays=Object.keys(counts).length;
    const durationMin=actualMonthRecords
        .filter(r=>!STATE_ACTIVITIES.includes((r.activity||'').toLowerCase()))
        .reduce((sum,r)=>sum+(Number(r.duration)||0),0);
    const durationHours=Math.round((durationMin/60)*10)/10;
    const today=todayISO();

    let html=`
    <div class="history-shell">
        <div class="card calendar-card">
            <div class="calendar-top">
                <button class="icon-button" onclick="prevMonth()" aria-label="Mês anterior"><i data-lucide="chevron-left"></i></button>
                <h2>${months[currentMonth]} ${currentYear}</h2>
                <button class="icon-button" onclick="nextMonth()" aria-label="Próximo mês"><i data-lucide="chevron-right"></i></button>
            </div>

            <div class="calendar-grid">
                <div class="calendar-header">D</div>
                <div class="calendar-header">S</div>
                <div class="calendar-header">T</div>
                <div class="calendar-header">Q</div>
                <div class="calendar-header">Q</div>
                <div class="calendar-header">S</div>
                <div class="calendar-header">S</div>
    `;

    for(let i=0;i<startWeekDay;i++) html+=`<div></div>`;

    for(let day=1;day<=totalDays;day++){
        const date=`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const count=counts[date]||0;
        const hasReward=rewardsByDate.has(date);
        const classes=[
            'calendar-day',
            count ? 'has-record' : '',
            count>=5 ? 'many-records' : '',
            hasReward ? 'has-reward' : '',
            hasReward && !count ? 'reward-only' : '',
            date===today ? 'today' : ''
        ].filter(Boolean).join(' ');
        html+=`
        <button class="${classes}" onclick="openDay('${date}')" aria-label="${day} de ${months[currentMonth]}, ${count} registros${hasReward?', com recompensa':''}">
            ${day}
        </button>`;
    }

    html+=`
            </div>
            <div class="calendar-legend">
                <span class="legend-item"><span class="legend-dot"></span>com registros</span>
                <span class="legend-item"><span class="legend-dot reward"></span>recompensa</span>
                <span class="legend-item"><span class="legend-today"></span>hoje</span>
            </div>
        </div>

        <div>
            <div class="section-heading"><h2>Resumo do mês</h2><span class="eyebrow">visão rápida</span></div>
            <div class="history-stats">
                <div class="history-stat"><b>${recordedDays}</b><span>dias registrados</span></div>
                <div class="history-stat"><b>${actualMonthRecords.length}</b><span>registros totais</span></div>
                <div class="history-stat"><b>${String(durationHours).replace('.',',')}h</b><span>atividades</span></div>
            </div>
        </div>
    </div>`;

    history.innerHTML=html;
    lucide.createIcons();
}

function openDay(date){
    selectedDate=date;
    renderHistory();
}

function backToCalendar(){
    selectedDate=null;
    renderHistory();
}

function previousDay(){
    const [year, month, day] = selectedDate.split('-').map(Number);
    const d = new Date(year, month - 1, day);
    d.setDate(d.getDate() - 1);
    selectedDate =
        d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    renderHistory();
}

function nextDay(){
    const [year, month, day] = selectedDate.split('-').map(Number);
    const d = new Date(year, month - 1, day);
    d.setDate(d.getDate() + 1);
    selectedDate =
        d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    renderHistory();
}

function prevMonth(){
    currentMonth--;
    if(currentMonth<0){currentMonth=11;currentYear--;}
    renderCalendar();
}

function nextMonth(){
    currentMonth++;
    if(currentMonth>11){currentMonth=0;currentYear++;}
    renderCalendar();
}

function getEndTime(startTime, duration){
    if(!startTime) return '--:--';
    const [h,m] = startTime.split(':').map(Number);
    const totalMinutes = h * 60 + m + (Number(duration)||0);
    const endH = Math.floor(totalMinutes / 60) % 24;
    const endM = totalMinutes % 60;
    return `${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}`;
}

function latestStateForDate(name,date){
    const matches=stateRecordsForDate(name,date);
    return matches.length ? matches[matches.length-1] : null;
}

function openRecordMenu(id){
    const r=records.find(x=>String(x.id)===String(id));

        </div>

}

function renderDay(date){
    const history=document.getElementById("historyScreen");
    const dayRecords=records.filter(r=>r.date===date);
    const chronologicalRecords=dayRecords
        .filter(r=>isRepeatedState(r.activity) || !STATE_ACTIVITIES.includes((r.activity||'').toLowerCase()))
        // Sem horário (inclusive avaliações antigas) aparecem após os registros cronometrados.
        .sort((a,b)=>(a.startTime||'99:99').localeCompare(b.startTime||'99:99'));

    const stateCards=STATE_UI.map(cfg=>{
        const matches=stateRecordsForDate(cfg.name,date);
        const r=matches.length ? matches[matches.length-1] : null;
        const value=r ? formatStateValue(r.value) : '—';
        const repeatable=isRepeatedState(cfg.name);
        const detail=repeatable && r
            ? `${r.startTime ? escapeHTML(r.startTime) : 'Sem hora'}${matches.length>1 ? ` · ${matches.length} notas` : ''}` : '';
        const click=repeatable
            ? `onclick="openRegister(${inlineArg(cfg.name)},${inlineArg(date)})"`
            : (r ? `onclick="openRecordMenu(${inlineArg(r.id)})"` : '');
        return `
            <div class="day-state-card ${cfg.cls} ${r?'':'empty-state'}" ${click}>
                <div class="state-icon"><i data-lucide="${cfg.icon}"></i></div>
                <div class="state-name">${cfg.short}</div>
                <div class="state-value ${r?'':'empty'}">${value}</div>
                ${detail ? `<div class="state-extra">${detail}</div>` : ''}
            </div>`;
    }).join('');

    // Notas ao acordar continuam independentes. As avaliações de disposição
    // são apresentadas integralmente na linha do tempo, sem duplicar observações.
    const wakingNotes=STATE_UI.filter(cfg=>!isRepeatedState(cfg.name)).map(cfg=>{
        const r=latestStateForDate(cfg.name,date);
        if(!r || !r.notes) return '';
        return `<div class="timeline-card" onclick="openRecordMenu(${inlineArg(r.id)})">
            <div class="timeline-title">${escapeHTML(cfg.name)}</div>
            <div class="timeline-notes">${escapeHTML(r.notes)}</div>
        </div>`;
    }).join('');

    const timeline=chronologicalRecords.length
        ? chronologicalRecords.map(r=>{
            const isDisposition=isRepeatedState(r.activity);
            const isMood=isMoodRecord(r);
            const config=isDisposition ? STATE_UI.find(cfg=>cfg.name===r.activity) : null;
            const icon=isMood?(MOOD_UI.find(m=>m.name===r.mood)?.icon||'smile'):(config?.icon || activityIcon(r.activity));
            const visualStyle=isDisposition ? '' : `style="${activityVisualStyle(r.activity)}"`;
            const reward=r.activity==='Recompensa';
            const time=reward ? '✦' : escapeHTML(r.startTime||'--:--');
            const detail=isMood ? `${time} · ${escapeHTML(r.mood||'Estado')}` : reward
                ? (r.date>todayISO() ? 'Recompensa prevista' : 'Recompensa · consulte as notas')
                : (isDisposition
                    ? `${r.startTime ? time : 'Sem horário (registro antigo)'} · Nota ${formatStateValue(r.value)}`
                    : `${time}–${getEndTime(r.startTime,r.duration)} · ${formatDuration(Number(r.duration)||0)}`);
            return `
            <div class="timeline-item">
                <div class="timeline-time">${time}</div>
                <div class="timeline-rail"><span class="timeline-dot"></span></div>
                <div class="timeline-card" onclick="openRecordMenu(${inlineArg(r.id)})">
                    <div class="timeline-title-row">
                        <div class="timeline-activity-icon ${config?.cls||''}" ${visualStyle}><i data-lucide="${icon}"></i></div>
                        <div style="min-width:0">
                            <div class="timeline-title">${escapeHTML(isMood?'Estado de hoje · '+(r.mood||''):r.activity)}${isDisposition ? ` <span class="timeline-state-score">${formatStateValue(r.value)}</span>` : ''}</div>
                            <div class="timeline-meta">${detail}</div>
                        </div>
                    </div>
                    ${r.notes ? `<div class="timeline-notes">${escapeHTML(r.notes)}</div>` : ''}
                    <div class="timeline-edit-hint">Toque para editar ou excluir</div>
                </div>
            </div>`;
        }).join('')
        : `<div class="timeline-empty">Nenhum registro com horário ou atividade neste dia.</div>`;

    history.innerHTML=`
    <div class="day-view">
        <div class="day-toolbar">
            <button class="day-nav-button" onclick="previousDay()" aria-label="Dia anterior"><i data-lucide="chevron-left"></i></button>
            <button class="day-back" onclick="backToCalendar()"><i data-lucide="calendar-days"></i><span>Voltar ao calendário</span></button>
            <button class="day-nav-button" onclick="nextDay()" aria-label="Próximo dia"><i data-lucide="chevron-right"></i></button>
        </div>

        <div class="day-date">
            <h2>${formatDateBR(date)}</h2>
            <p>${formatWeekday(date)} · ${dayRecords.length} ${dayRecords.length===1?'registro':'registros'}</p>
        </div>

        <section class="day-state-section">
            <div class="section-heading"><h2>Estado do dia</h2><span class="eyebrow">-10 a +10</span></div>
            <div class="day-state-grid">${stateCards}</div>
            ${wakingNotes ? `<div class="section-label">Observações ao acordar</div>${wakingNotes}` : ''}
        </section>

        <section>
            <div class="section-heading"><h2>Linha do tempo</h2><span class="eyebrow">${chronologicalRecords.length} ${chronologicalRecords.length===1?'registro':'registros'}</span></div>
            <div class="timeline-wrap">${timeline}</div>
        </section>
    </div>`;

    lucide.createIcons();
}

function saveEditedRecord(id){

    const record = records.find(r => String(r.id) === String(id));

    if(!record) return;

    const isState = STATE_ACTIVITIES.includes(record.activity.toLowerCase());
    const newDate=document.getElementById('editDate')?.value;
    if(!newDate){
        showToast('Informe a data do registro.','error');
        return;
    }
    if(isMoodRecord(record)){
        const time=document.getElementById('editMoodTime')?.value || '';
        if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){
            showToast('Informe um horário válido.','error');return;
        }
        record.date=newDate;
        record.startTime=time;
        record.mood=document.getElementById('editMood')?.value||record.mood;
        record.notes=document.getElementById('editNotes')?.value||'';
        save();closeModal();refreshAfterRecordSave();showToast('Mood atualizado.');return;
    }
    if(isState){
        const time=document.getElementById('editStateTime')?.value || '';
        if(time && !/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){
            showToast('Horário inválido.','error');
            return;
        }
        // Não criar horários fictícios para entradas anteriores à atualização.
        record.startTime=time;
    }
    record.date=newDate;
    record.notes=document.getElementById('editNotes').value;

    if(isState){
        record.value=Number(document.getElementById('editValue').value);
    }else if(record.activity==='Recompensa'){
        record.startTime=document.getElementById('editStartTime')?.value||'';
        record.duration=0;
    }else{

        record.startTime =
        document.getElementById("editStartTime").value;

        record.duration = Number(
            document.getElementById("editDuration").value
        );

    }

    save();
    closeModal();
    refreshAfterRecordSave();
    showToast('Alterações salvas.');
}

/* ===========================
   PLANEJAMENTO SEMANAL
=========================== */

function parseLocalISO(iso){
    const [y,m,d]=String(iso||'').split('-').map(Number);
    return new Date(y,m-1,d);
}

function addDaysLocal(date,days){
    const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
    d.setDate(d.getDate()+days);
    return d;
}

function startOfWeekDate(date){
    const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
    const shift=(d.getDay()+6)%7;
    d.setDate(d.getDate()-shift);
    return d;
}

function endOfWeekDate(date){
    return addDaysLocal(startOfWeekDate(date),6);
}

function weekEndExclusive(startISO){
    return addDaysLocal(parseLocalISO(startISO),7);
}

function isoInRange(iso,startISO,endExclusiveISO){
    return iso>=startISO && iso<endExclusiveISO;
}

function weeksForMonth(year,month){
    const first=new Date(year,month,1);
    const last=new Date(year,month+1,0);
    let cursor=startOfWeekDate(first);
    const lastWeek=startOfWeekDate(last);
    const weeks=[];
    while(cursor<=lastWeek){
        weeks.push(localDateISO(cursor));
        cursor=addDaysLocal(cursor,7);
    }
    return weeks;
}

function monthName(year,month){
    const raw=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(year,month,1));
    return raw.charAt(0).toUpperCase()+raw.slice(1);
}

function shortMonth(date){
    return new Intl.DateTimeFormat('pt-BR',{month:'short'}).format(date).replace('.','');
}

function weekChipRange(startISO){
    const s=parseLocalISO(startISO);
    const e=addDaysLocal(s,6);
    if(s.getMonth()===e.getMonth()) return `${s.getDate()}–${e.getDate()}`;
    return `${s.getDate()} ${shortMonth(s)}–${e.getDate()} ${shortMonth(e)}`;
}

function weekLongRange(startISO){
    const s=parseLocalISO(startISO);
    const e=addDaysLocal(s,6);
    if(s.getMonth()===e.getMonth() && s.getFullYear()===e.getFullYear()){
        return `${s.getDate()}–${e.getDate()} de ${new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(s)}`;
    }
    return `${s.getDate()} ${shortMonth(s)} – ${e.getDate()} ${shortMonth(e)} ${e.getFullYear()}`;
}

function planWeekStatus(startISO){
    const start=parseLocalISO(startISO);
    const end=addDaysLocal(start,7);
    const now=new Date();
    if(now<start) return 'planejamento';
    if(now>=end) return 'semana encerrada';
    return 'em andamento';
}

function ensureSelectedPlanDay(){
    const start=selectedPlanWeekStart;
    const end=localDateISO(weekEndExclusive(start));
    const today=localDateISO();
    if(!selectedPlanDay || !isoInRange(selectedPlanDay,start,end)){
        selectedPlanDay=isoInRange(today,start,end) ? today : start;
    }
}

function changePlanMonth(delta){
    planViewMonth+=delta;
    if(planViewMonth<0){planViewMonth=11;planViewYear--;}
    if(planViewMonth>11){planViewMonth=0;planViewYear++;}
    const weeks=weeksForMonth(planViewYear,planViewMonth);
    if(weeks.length){
        const today=localDateISO();
        const containingToday=weeks.find(w=>isoInRange(today,w,localDateISO(weekEndExclusive(w))));
        selectedPlanWeekStart=containingToday || weeks[0];
        selectedPlanDay=selectedPlanWeekStart;
    }
    renderPlanning();
}

function selectPlanWeek(startISO){
    selectedPlanWeekStart=startISO;
    ensureSelectedPlanDay();
    renderPlanning();
}

function selectPlanDay(dateISO){
    selectedPlanDay=dateISO;
    renderPlanning();
}

function setPlanViewMode(mode){
    if(mode!=='summary' && mode!=='day') return;
    planViewMode=mode;
    ensureSelectedPlanDay();
    renderPlanning();
}

function changePlanWeek(delta){
    const oldStart=parseLocalISO(selectedPlanWeekStart);
    let dayOffset=0;
    if(selectedPlanDay){
        const selected=parseLocalISO(selectedPlanDay);
        dayOffset=Math.round((selected-oldStart)/86400000);
        dayOffset=Math.max(0,Math.min(6,dayOffset));
    }

    const nextStart=addDaysLocal(oldStart,delta*7);
    selectedPlanWeekStart=localDateISO(nextStart);
    selectedPlanDay=localDateISO(addDaysLocal(nextStart,dayOffset));
    planViewMonth=nextStart.getMonth();
    planViewYear=nextStart.getFullYear();
    renderPlanning();
}

function newPlanId(){
    return `plan_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
}

function planActivityKey(name){
    return String(name||'').trim().toLowerCase();
}

function intervalForItem(item,weekStartISO,{clipNow=false}={}){
    const duration=Math.max(0,Number(item?.duration)||0);
    if(!item?.date || !item?.startTime || duration<=0) return null;

    const [y,m,d]=item.date.split('-').map(Number);
    const [hh,mm]=item.startTime.split(':').map(Number);
    const start=new Date(y,m-1,d,hh||0,mm||0,0,0);
    let end=new Date(start.getTime()+duration*60000);

    const weekStart=parseLocalISO(weekStartISO);
    const weekEnd=addDaysLocal(weekStart,7);

    let a=Math.max(start.getTime(),weekStart.getTime());
    let b=Math.min(end.getTime(),weekEnd.getTime());

    if(clipNow){
        const now=Date.now();
        if(a>=now) return null;
        b=Math.min(b,now);
    }

    if(b<=a) return null;
    return [a,b];
}

function mergedMinutes(items,activityName,weekStartISO,{clipNow=false}={}){
    const key=planActivityKey(activityName);
    const intervals=items
        .filter(item=>planActivityKey(item.activity)===key)
        .map(item=>intervalForItem(item,weekStartISO,{clipNow}))
        .filter(Boolean)
        .sort((a,b)=>a[0]-b[0]);

    if(!intervals.length) return 0;

    let total=0;
    let [curStart,curEnd]=intervals[0];

    for(let i=1;i<intervals.length;i++){
        const [start,end]=intervals[i];
        if(start<=curEnd){
            curEnd=Math.max(curEnd,end);
        }else{
            total+=curEnd-curStart;
            curStart=start;
            curEnd=end;
        }
    }
    total+=curEnd-curStart;
    return Math.round(total/60000);
}

function plannedMinutesForActivity(items,activityName,weekStartISO){
    const key=planActivityKey(activityName);
    const sameActivity=items.filter(item=>planActivityKey(item.activity)===key);

    const timed=sameActivity.filter(item=>item.startTime);
    const untimed=sameActivity.filter(item=>!item.startTime);

    const timedMinutes=mergedMinutes(timed,activityName,weekStartISO);
    const untimedMinutes=untimed.reduce(
        (sum,item)=>sum+Math.max(0,Number(item.duration)||0),
        0
    );

    return timedMinutes+untimedMinutes;
}

function plannedElapsedMinutesForActivity(items,activityName,weekStartISO){
    const today=localDateISO();
    const weekEndDate=addDaysLocal(parseLocalISO(weekStartISO),6);
    const weekEndISO=localDateISO(weekEndDate);

    // Semana ainda não começou: nada do planejamento entrou no denominador.
    if(today < weekStartISO) return 0;

    // Semana já terminou: usa todo o planejamento da semana.
    if(today > weekEndISO){
        return plannedMinutesForActivity(items,activityName,weekStartISO);
    }

    const key=planActivityKey(activityName);
    const sameActivity=items.filter(item=>planActivityKey(item.activity)===key);

    // Itens com horário entram proporcionalmente conforme o relógio avança.
    // Isso também trata corretamente atividades que atravessam a meia-noite,
    // como Sono: 22:30–06:10.
    const timed=sameActivity.filter(item=>item.startTime);
    const timedElapsed=mergedMinutes(timed,activityName,weekStartISO,{clipNow:true});

    // Itens sem horário não podem ser fracionados pelo relógio.
    // No dia em que estão planejados, entram integralmente.
    const untimedElapsed=sameActivity
        .filter(item=>!item.startTime && String(item.date||'')<=today)
        .reduce((sum,item)=>sum+Math.max(0,Number(item.duration)||0),0);

    return timedElapsed+untimedElapsed;
}

function planProgressPercent(actualMinutes,elapsedPlannedMinutes){
    const planned=Math.max(0,Number(elapsedPlannedMinutes)||0);
    const actual=Math.max(0,Number(actualMinutes)||0);
    if(planned<=0) return null;
    return Math.round((actual/planned)*100);
}

function formatPlanMinutes(min){
    const n=Math.max(0,Math.round(Number(min)||0));
    const h=Math.floor(n/60), m=n%60;
    if(h && m) return `${h}h${String(m).padStart(2,'0')}`;
    if(h) return `${h}h`;
    return `${m}min`;
}

function weekItems(startISO){
    const endISO=localDateISO(weekEndExclusive(startISO));
    return {
        planned:weeklyPlans.filter(p=>isoInRange(String(p.date||''),startISO,endISO)),
        actual:records.filter(r=>
            !STATE_ACTIVITIES.includes(String(r.activity||'').toLowerCase()) &&
            isoInRange(String(r.date||''),startISO,endISO)
        )
    };
}

function summaryRowsForWeek(startISO){
    const {planned,actual}=weekItems(startISO);
    const names=[];
    const seen=new Set();

    planned.forEach(item=>{
        const key=planActivityKey(item.activity);
        if(key && !seen.has(key)){seen.add(key);names.push(item.activity);}
    });
    actual.forEach(item=>{
        const key=planActivityKey(item.activity);
        if(key && !seen.has(key)){seen.add(key);names.push(item.activity);}
    });

    return names.map(name=>{
        const plannedTotal=plannedMinutesForActivity(planned,name,startISO);
        const plannedElapsed=plannedElapsedMinutesForActivity(planned,name,startISO);
        const actualMinutes=mergedMinutes(actual,name,startISO,{clipNow:true});

        // Normalmente o percentual compara o realizado com o planejado já
        // decorrido. Se ainda não houver minutos planejados decorridos, mas
        // já existir execução da atividade, usa o total semanal como base
        // para não deixar uma atividade executada sem percentual.
        const progressUsesWeeklyTotal=
            plannedElapsed<=0 && actualMinutes>0 && plannedTotal>0;
        const progressBase=progressUsesWeeklyTotal ? plannedTotal : plannedElapsed;

        return {
            name,
            planned:plannedTotal,
            plannedElapsed,
            progressBase,
            progressUsesWeeklyTotal,
            actual:actualMinutes,
            progress:planProgressPercent(actualMinutes,progressBase)
        };
    }).sort((a,b)=>{
        if((b.planned>0)!==(a.planned>0)) return b.planned-a.planned;
        return (b.planned+b.actual)-(a.planned+a.actual);
    });
}

function weekProgressLabel(startISO){
    const today=localDateISO();
    const endISO=localDateISO(addDaysLocal(parseLocalISO(startISO),6));
    if(today < startISO) return 'a iniciar';
    if(today > endISO) return 'semana';
    return 'até hoje';
}

function progressCellClass(percent){
    if(percent===null) return 'none';
    if(percent>=100) return 'over';
    return 'under';
}

function progressPlannedLabel(row,startISO){
    if(row.progress===null) return '';
    return '';
}

function startedRealRecord(record){
    if(!record?.date) return false;
    if(!record.startTime) return record.date<=localDateISO();
    const [y,m,d]=record.date.split('-').map(Number);
    const [hh,mm]=record.startTime.split(':').map(Number);
    return new Date(y,m-1,d,hh||0,mm||0,0,0).getTime()<=Date.now();
}

function planningItemTime(item){
    const duration=Math.max(0,Number(item.duration)||0);
    if(!item.startTime) return duration ? `Sem horário · ${formatPlanMinutes(duration)}` : 'Sem horário';
    if(!duration) return item.startTime;
    return `${item.startTime}–${getEndTime(item.startTime,duration)}`;
}

function planningItemMeta(item){
    const parts=[];
    const duration=Math.max(0,Number(item.duration)||0);
    if(duration) parts.push(formatPlanMinutes(duration));
    if(item.notes) parts.push(item.notes);
    return parts.join(' · ');
}

    return `

            <option value="${escapeHTML(a.name)}" ${a.name===selectedName?'selected':''}>

            </option>`).join('')}

    `;
}

    syncPlanDurationChips();
}

function syncPlanDurationChips(){
    const input=document.getElementById('planDuration');
    if(!input) return;
    document.querySelectorAll('.modal-content .duration-chip').forEach(btn=>{
        btn.classList.toggle('active',Number(btn.dataset.duration)===Number(input.value));
    });
}

function readPlanForm(){
    const choice=document.getElementById('planActivitySelect')?.value || '';
    const activity=(
        choice==='__custom__'
            ? (document.getElementById('planActivityCustom')?.value || '')
            : choice
    ).trim();

    const date=document.getElementById('planDate')?.value || '';
    const startTime=document.getElementById('planStartTime')?.value || '';
    const duration=Math.max(0,Number(document.getElementById('planDuration')?.value)||0);
    const notes=document.getElementById('planNotes')?.value || '';
    return {activity,date,startTime,duration,notes};
}

function createPlanItems(){
    const base=readPlanForm();
    if(!base.activity){showToast('Informe a atividade ou evento.','error');return;}
    if(!base.date){showToast('Informe a data.','error');return;}

    const targetDates=new Set([base.date]);
    const baseWeek=startOfWeekDate(parseLocalISO(base.date));
    document.querySelectorAll('.planRepeatDay:checked').forEach(box=>{
        targetDates.add(localDateISO(addDaysLocal(baseWeek,Number(box.value)||0)));
    });

    const now=new Date().toISOString();
    [...targetDates].sort().forEach(date=>{
        weeklyPlans.push({
            id:newPlanId(),
            ...base,
            date,
            createdAt:now,
            updatedAt:now
        });
    });

    selectedPlanWeekStart=localDateISO(startOfWeekDate(parseLocalISO(base.date)));
    selectedPlanDay=base.date;
    planViewMonth=parseLocalISO(base.date).getMonth();
    planViewYear=parseLocalISO(base.date).getFullYear();
    save();
    closeModal();
    renderPlanning();
    showToast(targetDates.size===1?'Planejamento adicionado.':`${targetDates.size} itens adicionados ao planejamento.`);
}

function savePlanEdit(id){
    const plan=weeklyPlans.find(p=>String(p.id)===String(id));
    if(!plan) return;
    const data=readPlanForm();
    if(!data.activity){showToast('Informe a atividade ou evento.','error');return;}
    if(!data.date){showToast('Informe a data.','error');return;}

    Object.assign(plan,data,{updatedAt:new Date().toISOString()});
    selectedPlanWeekStart=localDateISO(startOfWeekDate(parseLocalISO(data.date)));
    selectedPlanDay=data.date;
    planViewMonth=parseLocalISO(data.date).getMonth();
    planViewYear=parseLocalISO(data.date).getFullYear();
    save();
    closeModal();
    renderPlanning();
    showToast('Planejamento atualizado.');
}

function duplicatePlan(id){
    const plan=weeklyPlans.find(p=>String(p.id)===String(id));
    if(!plan) return;
    const now=new Date().toISOString();
    weeklyPlans.push({...plan,id:newPlanId(),createdAt:now,updatedAt:now});
    save();
    closeModal();
    renderPlanning();
    showToast('Item duplicado. Toque nele para editar.');
}

function copyPreviousWeekPlan(){
    const currentStart=parseLocalISO(selectedPlanWeekStart);
    const previousStart=addDaysLocal(currentStart,-7);
    const previousStartISO=localDateISO(previousStart);
    const previousEndISO=selectedPlanWeekStart;

    const previousPlans=weeklyPlans
        .filter(p=>isoInRange(String(p.date||''),previousStartISO,previousEndISO))
        .sort((a,b)=>{
            const dateCompare=String(a.date||'').localeCompare(String(b.date||''));
            if(dateCompare!==0) return dateCompare;
            return String(a.startTime||'99:99').localeCompare(String(b.startTime||'99:99'));
        });

    if(!previousPlans.length){
        showToast('A semana anterior não tem planejamento para copiar.','error');
        return;
    }

    const targetEndISO=localDateISO(weekEndExclusive(selectedPlanWeekStart));

    const planKey=p=>JSON.stringify([
        planActivityKey(p.activity),
        String(p.date||''),
        String(p.startTime||''),
        Number(p.duration)||0,
        String(p.notes||'')
    ]);

    const existingKeys=new Set(
        weeklyPlans
            .filter(p=>isoInRange(String(p.date||''),selectedPlanWeekStart,targetEndISO))
            .map(planKey)
    );

    const now=new Date().toISOString();
    let copied=0;
    let ignored=0;

    previousPlans.forEach(source=>{
        const targetDate=localDateISO(addDaysLocal(parseLocalISO(source.date),7));

        const copy={
            activity:source.activity,
            date:targetDate,
            startTime:source.startTime || '',
            duration:Math.max(0,Number(source.duration)||0),
            notes:source.notes || ''
        };

        const key=planKey(copy);

        if(existingKeys.has(key)){
            ignored++;
            return;
        }

        weeklyPlans.push({
            id:newPlanId(),
            ...copy,
            createdAt:now,
            updatedAt:now
        });

        existingKeys.add(key);
        copied++;
    });

    save();
    renderPlanning();

    if(!copied){
        showToast('O planejamento da semana anterior já está nesta semana.');
        return;
    }

    const ignoredText=ignored ? ` · ${ignored} ${ignored===1?'repetido ignorado':'repetidos ignorados'}` : '';
    showToast(`${copied} ${copied===1?'item copiado':'itens copiados'} da semana anterior${ignoredText}.`);
}

function deletePlan(id){
    if(!confirm('Excluir este item do planejamento?')) return;
    weeklyPlans=weeklyPlans.filter(p=>String(p.id)!==String(id));
    save();
    closeModal();
    renderPlanning();
    showToast('Item removido do planejamento.');
}

function renderPlanning(){
    const host=document.getElementById('planningScreen');
    if(!host) return;

    ensureSelectedPlanDay();

    const rows=summaryRowsForWeek(selectedPlanWeekStart);
    const {planned,actual}=weekItems(selectedPlanWeekStart);

    const summaryHTML=rows.length ? `
        <div class="week-summary-head"><span>Planejado</span><span>Rastro</span><span>Percentual</span></div>
        <div class="week-summary">
            ${rows.map(row=>`
                <div class="week-summary-row">
                    <div class="week-summary-activity">
                        <div class="week-summary-icon" style="${activityVisualStyle(row.name)}"><i data-lucide="${activityIcon(row.name)}"></i></div>
                        <div class="week-summary-name">${escapeHTML(row.name)}</div>
                    </div>

                    <div class="week-summary-metrics">
                        <div class="week-summary-value planned">
                            <b>${formatPlanMinutes(row.planned)}</b>
                        </div>

                        <div class="week-summary-value actual">
                            <b>${formatPlanMinutes(row.actual)}</b>
                        </div>

                        <div class="week-summary-value progress ${progressCellClass(row.progress)}"
                             title="${row.progress===null
                                ? 'Sem planejamento para comparar'
                                : row.progressUsesWeeklyTotal
                                    ? `${formatPlanMinutes(row.actual)} de ${formatPlanMinutes(row.progressBase)} planejadas na semana`
                                    : `${formatPlanMinutes(row.actual)} de ${formatPlanMinutes(row.progressBase)} planejadas até este ponto da semana`}">
                            <b>${row.progress===null?'—':`${row.progress}%`}</b>
                        </div>
                    </div>
                </div>`).join('')}
        </div>` : `<div class="week-summary-empty">Ainda não há planejamento nem atividades registradas nesta semana.</div>`;

    const weekdays=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];
    const weekStartDate=parseLocalISO(selectedPlanWeekStart);
    const dayTabs=weekdays.map((label,i)=>{
        const d=addDaysLocal(weekStartDate,i);
        const iso=localDateISO(d);
        const cls=[iso===selectedPlanDay?'active':'',iso===localDateISO()?'today':''].filter(Boolean).join(' ');
        return `<button class="day-tab ${cls}" onclick="selectPlanDay('${iso}')"><strong>${label}</strong><span>${d.getDate()}</span></button>`;
    }).join('');

    const dayPlans=planned.filter(p=>p.date===selectedPlanDay).sort((a,b)=>(a.startTime||'99:99').localeCompare(b.startTime||'99:99'));
    const dayActual=actual.filter(r=>r.date===selectedPlanDay && startedRealRecord(r)).sort((a,b)=>(a.startTime||'99:99').localeCompare(b.startTime||'99:99'));

    const planList=dayPlans.length ? dayPlans.map(p=>`
        <div class="compare-item planned-item" onclick="openPlanEditor(${inlineArg(p.id)})">
            <div class="compare-time">${escapeHTML(planningItemTime(p))}</div>
            <div class="compare-title">${escapeHTML(p.activity)}</div>

    const dayDateRaw=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'}).format(dayDate);

    const summaryView=`

    const dayView=`
        <section class="plan-view-section">

                    <strong>${weekLongRange(selectedPlanWeekStart)}</strong>

                </div>

function normalActiveActivities(){
    const stateSet=new Set(STATE_ACTIVITIES.map(x=>x.toLowerCase()));
    return activities.filter(a=>!a.archived && !stateSet.has(a.name.toLowerCase()));
}

function openReorderActivities(){
    const list=normalActiveActivities();
    const items=list.map((a,i)=>`
        <div class="reorder-item">
            <div class="reorder-name">${escapeHTML(a.name)}</div>
            <button class="reorder-btn" ${i===0?'disabled':''} onclick="moveActivity(${inlineArg(a.name)},-1)" aria-label="Mover ${escapeHTML(a.name)} para cima"><i data-lucide="chevron-up"></i></button>
            <button class="reorder-btn" ${i===list.length-1?'disabled':''} onclick="moveActivity(${inlineArg(a.name)},1)" aria-label="Mover ${escapeHTML(a.name)} para baixo"><i data-lucide="chevron-down"></i></button>
        </div>`).join('');
    showModal('Organizar atividades',`
        <p class="menu-note">Defina a ordem em que as atividades aparecem na tela Registrar.</p>
        <div class="reorder-list">${items || '<div class="small">Nenhuma atividade disponível.</div>'}</div>
    `,'Organização');
}

function moveActivity(name,direction){
    const list=normalActiveActivities();
    const pos=list.findIndex(a=>a.name===name);
    const target=pos+direction;
    if(pos<0 || target<0 || target>=list.length) return;
    const a=list[pos], b=list[target];
    const ia=activities.indexOf(a), ib=activities.indexOf(b);
    [activities[ia],activities[ib]]=[activities[ib],activities[ia]];
    save();
    renderActivities();
    openReorderActivities();
}


function openArchivedActivities(){
    const archived=activities.filter(a=>a.archived);
    showModal('Atividades arquivadas',`
        <p class="menu-note">Arquivar retira o botão da página inicial. Nenhum registro histórico é apagado.</p>
        <div class="archived-grid">${archived.length?archived.map(a=>`

                    <button onclick="openRenameActivity(${inlineArg(a.name)})" aria-label="Editar ${escapeHTML(a.name)}"><i data-lucide="pencil"></i></button>
                    <button class="restore-btn" onclick="restoreArchivedActivity(${inlineArg(a.name)})">Restaurar</button>
                </div>
            </div>`).join(''):'<p class="small">Nenhuma atividade arquivada.</p>'}</div>
    `,'Organização');
}
function restoreArchivedActivity(name){
    const a=activities.find(x=>x.name===name);
    if(!a)return;
    a.archived=false;save();refreshAfterRecordSave();openArchivedActivities();
    showToast('Atividade restaurada.');
}

function downloadJSON(data,filename){
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');link.href=url;link.download=filename;link.click();

}
function exportPeriodJSON(){
    const period=document.getElementById('exportPeriod')?.value||'all';
    if(period==='all'){exportJSON();closeModal();return;}
    let start=period==='phase1'?'2026-09-21':period==='phase2'?'2026-10-29':document.getElementById('exportStart')?.value;
    let end=period==='phase1'?'2026-10-28':period==='phase2'?'9999-12-31':document.getElementById('exportEnd')?.value;
    if(!start||!end||start>end){showToast('Confira as datas do intervalo.','error');return;}
    const inRange=d=>!!d && d>=start && d<=end;
    const data={exportadoEm:new Date().toISOString(),filtro:{tipo:period,inicio:start,fim:end==='9999-12-31'?null:end},
        atividades:activities,registros:records.filter(r=>inRange(r.date)),
        contadores:[],planejamentoSemanal:weeklyPlans.filter(p=>inRange(p.date)),
        modelosBriefing:briefingMoodTemplates,planoBriefing:briefingPlanText,aparencia:{theme:currentTheme,effect:currentEffect}};
    const suffix=period==='phase1'?'fase1':period==='phase2'?'fase2':`${start}_a_${end}`;
    downloadJSON(data,`rastro_${suffix}.json`);
    closeModal();showToast('Exportação do período concluída.');
}

/* ===========================
   IMPORTAÇÃO JSON
=========================== */

function importJSON(){
    document.getElementById("importFile").click();
}

function recordImportKey(record){

    const activity = String(record.activity || '').trim().toLowerCase();
    const date = String(record.date || '');
    const notes = String(record.notes || '');

    if(isMoodRecord(record)){
        return JSON.stringify(['mood',date,record.mood||'',record.startTime||'',notes,record.createdAt||'']);
    }
    const isState = STATE_ACTIVITIES.includes(activity);

    if(isState){
        return JSON.stringify([
            'state',
            activity,
            date,
            // Diferentes momentos do mesmo dia não são registros duplicados.
            isRepeatedState(activity) ? String(record.startTime || '') : '',
            Number(record.value),
            notes,
            // Permite também múltiplos registros idênticos no mesmo minuto.
            isRepeatedState(activity) ? String(record.createdAt || '') : ''
        ]);
    }

    return JSON.stringify([
        'activity',
        activity,
        date,
        String(record.startTime || ''),
        Number(record.duration) || 0,
        notes
    ]);
}

function handleImport(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        try{

            const data = JSON.parse(e.target.result);

            let importedRecords = 0;
            let ignoredRecords = 0;
            let importedActivities = 0;
            let importedCounters = 0;
            let ignoredCounters = 0;
            let importedPlans = 0;
            let ignoredPlans = 0;
            let updatedPlans = 0;

            if(data.aparencia && THEME_META[data.aparencia.theme]){
                applyTheme(data.aparencia.theme,true);
            }
            if(data.aparencia && EFFECT_META[data.aparencia.effect]){
                applyEffect(data.aparencia.effect,true);
            }

            if(typeof data.planoBriefing==='string' && briefingPlanText===DEFAULT_BRIEFING_PLAN){
                briefingPlanText=data.planoBriefing;
            }
            if(data.modelosBriefing && typeof data.modelosBriefing==='object'){
                for(const mood of MOOD_UI){
                    const incoming=data.modelosBriefing[mood.name];
                    if(typeof incoming==='string' &&
                        (!briefingMoodTemplates[mood.name] || briefingMoodTemplates[mood.name]===DEFAULT_BRIEFING_MOODS[mood.name])){
                        briefingMoodTemplates[mood.name]=incoming;
                    }
                }
            }

            if(data.atividades){

                data.atividades.forEach(novaAtividade => {

                    const existe = activities.some(
                        a => String(a.name || '').trim().toLowerCase() ===
                             String(novaAtividade.name || '').trim().toLowerCase()
                    );

                    if(!existe){
                        activities.push(novaAtividade);
                        importedActivities++;
                    }else{
                        // Preserva nomes, ícones e edições locais; complementa apenas
                        // o modelo que estiver ausente na atividade já cadastrada.
                        const local=activities.find(a=>String(a.name||'').trim().toLocaleLowerCase('pt-BR')===String(novaAtividade.name||'').trim().toLocaleLowerCase('pt-BR'));
                        if(local && !Object.prototype.hasOwnProperty.call(local,'notesTemplate') && typeof novaAtividade.notesTemplate==='string'){
                            local.notesTemplate=novaAtividade.notesTemplate;
                        }
                        // Uma cor de backup é recuperada somente se ainda não houver
                        // uma escolha de cor local, preservando personalizações existentes.
                        if(local && !Object.prototype.hasOwnProperty.call(local,'buttonColor') && allowedButtonColor(novaAtividade.buttonColor)){
                            local.buttonColor=novaAtividade.buttonColor;
                        }
                    }
                });
            }

            if(data.registros){

                const existingIds = new Set(
                    records
                        .filter(r => r.id !== undefined && r.id !== null)
                        .map(r => String(r.id))
                );

                const existingKeys = new Set(
                    records.map(recordImportKey)
                );

                data.registros.forEach(registro => {

                    const sameId =
                        registro.id !== undefined &&
                        registro.id !== null &&
                        existingIds.has(String(registro.id));

                    const key = recordImportKey(registro);
                    const sameContent = existingKeys.has(key);

                    if(sameId || sameContent){
                        ignoredRecords++;
                        return;
                    }

                    // IDs importados podem ser texto ou número. A interface agora aceita ambos.
                    // Se o backup não trouxer ID, geramos um novo ID local.
                    let id = registro.id;

                    if(id === undefined || id === null || existingIds.has(String(id))){
                        id = Date.now() + Math.random();
                    }

                    records.push({
                        ...registro,
                        id
                    });

                    existingIds.add(String(id));
                    existingKeys.add(key);
                    importedRecords++;
                });
            }


            if(data.contadores){
                const counterIds=new Set(counters.map(c=>String(c.id||'')));
                const counterKeys=new Set(counters.map(c=>JSON.stringify([
                    String(c.mode||''),
                    String(c.title||'').trim().toLowerCase(),
                    String(c.startDate||'')
                ])));

                data.contadores.forEach(contador=>{
                    const id=String(contador.id||'');
                    const key=JSON.stringify([
                        String(contador.mode||''),
                        String(contador.title||'').trim().toLowerCase(),
                        String(contador.startDate||'')
                    ]);
                    if((id && counterIds.has(id)) || counterKeys.has(key)){
                        ignoredCounters++;
                        return;
                    }
                    const novo={...contador,id:id || newCounterId()};
                    counters.push(novo);
                    counterIds.add(String(novo.id));
                    counterKeys.add(key);
                    importedCounters++;
                });
            }

            if(data.planejamentoSemanal){
                const planById=new Map(weeklyPlans.map((p,i)=>[String(p.id||''),i]));
                const planKeys=new Set(weeklyPlans.map(p=>JSON.stringify([
                    planActivityKey(p.activity),
                    String(p.date||''),
                    String(p.startTime||''),
                    Number(p.duration)||0,
                    String(p.notes||'')
                ])));

                data.planejamentoSemanal.forEach(incoming=>{
                    const incomingId=String(incoming.id||'');
                    const key=JSON.stringify([
                        planActivityKey(incoming.activity),
                        String(incoming.date||''),
                        String(incoming.startTime||''),
                        Number(incoming.duration)||0,
                        String(incoming.notes||'')
                    ]);

                    if(incomingId && planById.has(incomingId)){
                        const index=planById.get(incomingId);
                        const local=weeklyPlans[index];
                        const incomingTime=Date.parse(incoming.updatedAt||incoming.createdAt||0)||0;
                        const localTime=Date.parse(local.updatedAt||local.createdAt||0)||0;
                        if(incomingTime>localTime){
                            weeklyPlans[index]={...local,...incoming,id:incomingId};
                            updatedPlans++;
                        }else{
                            ignoredPlans++;
                        }
                        return;
                    }

                    if(planKeys.has(key)){
                        ignoredPlans++;
                        return;
                    }

                    const id=incomingId || newPlanId();
                    const now=new Date().toISOString();
                    weeklyPlans.push({
                        ...incoming,
                        id,
                        createdAt:incoming.createdAt||now,
                        updatedAt:incoming.updatedAt||incoming.createdAt||now
                    });
                    planById.set(id,weeklyPlans.length-1);
                    planKeys.add(key);
                    importedPlans++;
                });
            }

            save();
            refreshAfterRecordSave();

            const parts = [];

            if(importedRecords){
                parts.push(`${importedRecords} ${importedRecords === 1 ? 'registro novo' : 'registros novos'}`);
            }

            if(ignoredRecords){
                parts.push(`${ignoredRecords} ${ignoredRecords === 1 ? 'duplicado ignorado' : 'duplicados ignorados'}`);
            }

            if(importedActivities){
                parts.push(`${importedActivities} ${importedActivities === 1 ? 'atividade nova' : 'atividades novas'}`);
            }

            if(importedCounters){
                parts.push(`${importedCounters} ${importedCounters === 1 ? 'contador novo' : 'contadores novos'}`);
            }

            if(ignoredCounters){
                parts.push(`${ignoredCounters} ${ignoredCounters === 1 ? 'contador repetido ignorado' : 'contadores repetidos ignorados'}`);
            }

            if(importedPlans){
                parts.push(`${importedPlans} ${importedPlans === 1 ? 'planejamento novo' : 'planejamentos novos'}`);
            }

            if(updatedPlans){
                parts.push(`${updatedPlans} ${updatedPlans === 1 ? 'planejamento atualizado' : 'planejamentos atualizados'}`);
            }

            if(ignoredPlans){
                parts.push(`${ignoredPlans} ${ignoredPlans === 1 ? 'planejamento repetido ignorado' : 'planejamentos repetidos ignorados'}`);
            }

            showToast(
                parts.length
                    ? `Importação concluída: ${parts.join(' · ')}.`
                    : "Importação concluída: nenhum dado novo."
            );

            event.target.value="";

        }catch(error){

            showToast("Arquivo JSON inválido.","error");
            event.target.value="";

            console.error(error);
        }
    };

    reader.readAsText(file);
}
document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && document.querySelector('.modal')) closeModal();
    if(e.key==='Enter' && e.target?.id==='newActivityName') createActivity();
    if((e.key==='Enter' || e.key===' ') && e.target?.classList?.contains('counter-card')){e.preventDefault();e.target.click();}
});

document.addEventListener('focusin',e=>{
    if(!e.target.closest?.('.modal-content')) return;
    if(!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),260);
});

if(window.visualViewport){
    const syncKeyboard=()=>{
        const delta=Math.max(0,window.innerHeight-window.visualViewport.height);
        document.body.classList.toggle('keyboard-open',delta>140 && !!document.querySelector('.modal'));
    };
    window.visualViewport.addEventListener('resize',syncKeyboard);
    window.visualViewport.addEventListener('scroll',syncKeyboard);
}

applyTheme(currentTheme,false);
applyEffect(currentEffect,false);
showHome();
</script>

</body>
