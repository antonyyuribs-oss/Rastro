<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rastro">
<title>Rastro</title>


<style>
:root{
    --bg:#0a0c0f;
    --surface:#11151a;
    --surface-2:#161b22;
    --surface-3:#0f1318;
    --border:#252d37;
    --border-soft:rgba(255,255,255,.07);
    --text:#f2f5f8;
    --text-2:#c4cbd4;
    --muted:#7f8a98;
    --accent:#6f7c4a;
    --accent-soft:rgba(111,124,74,.18);
    --green:#48c78e;
    --blue:#d6c39d;
    --sand:#d6c39d;
    --sand-muted:#aa9874;
    --amber:#f3b54a;
    --red:#f26b6b;
    --radius-sm:12px;
    --radius-md:16px;
    --radius-lg:22px;
    --shadow:0 18px 45px rgba(0,0,0,.28);
    --content:760px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
    background:
        radial-gradient(circle at 50% -12%,rgba(111,124,74,.10),transparent 27rem),
        var(--bg);
    color:var(--text);
    line-height:1.45;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

.app-header{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(10,12,15,.82);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border-bottom:1px solid var(--border-soft);
}
.header-inner{
    width:min(100%,var(--content));
    margin:auto;
    padding:calc(12px + env(safe-area-inset-top)) 18px 14px;
}
.brand-row{display:flex;align-items:center;gap:13px}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;flex:none;color:var(--sand);background:rgba(214,195,157,.065);border:1px solid rgba(214,195,157,.16);border-radius:11px}
.brand-mark svg{width:20px;height:20px;stroke-width:1.8}
#screenTitle{color:var(--sand)}
.header-copy{min-width:0}
#screenTitle{font-size:24px;line-height:1.1;font-weight:760;letter-spacing:-.025em}
#screenSubtitle{margin-top:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.container{width:min(100%,var(--content));margin:auto;padding:20px 18px 28px}

.section-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:2px 0 11px}
.section-heading h2{font-size:16px;line-height:1.2;font-weight:720;letter-spacing:-.01em}
.section-heading .eyebrow{color:var(--muted);font-size:11px}
.section-label{margin:22px 0 10px;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.14em}

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px;
}

/* HOME — estados */
.state-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:23px}
.state-card{
    min-width:0;
    border:1px solid var(--border-soft);
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border-radius:14px;
    padding:12px 7px 11px;
    text-align:center;
    cursor:pointer;
    transition:border-color .16s ease,transform .16s ease,background .16s ease;
}
.state-card:active{transform:scale(.98)}
.state-icon{
    width:30px;height:30px;margin:0 auto 8px;border-radius:9px;
    display:grid;place-items:center;background:rgba(255,255,255,.035)
}
.state-icon svg{width:17px;height:17px}
.state-card.mental .state-icon,.state-card.mental .state-value{color:var(--green)}
.state-card.body .state-icon,.state-card.body .state-value{color:var(--blue)}
.state-card.disp-mental .state-icon,.state-card.disp-mental .state-value{color:var(--amber)}
.state-card.disp-body .state-icon,.state-card.disp-body .state-value{color:var(--red)}
.state-name{font-size:10px;line-height:1.16;color:var(--text-2);min-height:24px;display:flex;align-items:center;justify-content:center}
.state-value{font-size:22px;line-height:1.1;font-weight:760;margin-top:5px;letter-spacing:-.03em}
.state-value.empty{color:var(--muted)!important;font-weight:500}

/* HOME — atividades */
.activities-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.activity-card{
    min-height:86px;
    padding:11px 7px 9px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:border-color .16s ease,background .16s ease,transform .16s ease;
}
.activity-card:active{transform:scale(.98);background:#192029}
.activity-card{-webkit-touch-callout:none}
.activity-card.reorder-source{
    transform:scale(.95);
    border-color:var(--accent);
    background:linear-gradient(180deg,rgba(111,124,74,.22),var(--surface));
    box-shadow:0 12px 28px rgba(0,0,0,.34),0 0 0 2px rgba(111,124,74,.14);
    position:relative;z-index:4
}
.activity-card.reorder-target{border-color:rgba(214,195,157,.52)}
body.reordering{user-select:none;-webkit-user-select:none}
body.reordering .activity-card:not(.reorder-source){transition:transform .12s ease,border-color .12s ease}
.activity-icon{
    width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    color:#a6b47a;background:rgba(111,124,74,.12)
}
.activity-icon svg{width:18px;height:18px;stroke-width:1.9}
.activity-title-btn{width:100%;font-size:11px;line-height:1.15;font-weight:590;color:var(--text-2);overflow-wrap:anywhere}
.archived-wrap{margin-top:26px;padding-top:20px;border-top:1px solid var(--border-soft)}
.archived-grid{display:grid;gap:8px}
.archived-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.activity-name{font-weight:600;font-size:13px}

/* botões e formulários */
button{
    background:var(--surface-2);color:var(--text);border:1px solid var(--border);
    padding:10px 14px;border-radius:12px;cursor:pointer;transition:.16s ease;
}
button:hover{border-color:#56613c}
button:active{transform:scale(.985)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.restore-btn{border-color:rgba(111,124,74,.55);color:#b7c28e}
input,select,textarea{
    width:100%;margin-top:8px;margin-bottom:14px;background:var(--surface-3);color:var(--text);
    border:1px solid var(--border);border-radius:12px;padding:12px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:100px}
.quick-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.quick-buttons button{padding:10px}
.modal-footer-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.modal-footer-actions button{width:100%}

/* HISTÓRICO — calendário e Rastro do dia */
.history-shell{display:grid;gap:18px}
.calendar-card{padding:16px 14px 18px}
.calendar-top{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:10px;margin-bottom:17px}
.calendar-top h2{text-align:center;font-size:20px;line-height:1.2;letter-spacing:-.025em}
.icon-button{width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--surface-3)}
.icon-button svg{width:18px;height:18px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calendar-header{text-align:center;color:var(--muted);padding:4px 0 7px;font-size:10px;font-weight:650;text-transform:uppercase}
.calendar-day{
    position:relative;aspect-ratio:1/1;min-height:0;border:1px solid transparent;border-radius:12px;
    display:grid;place-items:center;cursor:pointer;background:transparent;color:var(--text-2);
    font-size:13px;transition:.16s ease
}
.calendar-day:hover{background:var(--surface-2)}
.calendar-day.today{border-color:rgba(255,255,255,.17);font-weight:760;color:var(--text)}
.calendar-day.has-record{background:var(--surface-2);color:var(--text);font-weight:650}
.calendar-day.has-record::after{
    content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;
    border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px rgba(111,124,74,.16)
}
.calendar-day.many-records::after{width:16px;border-radius:99px}
.calendar-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:15px;color:var(--muted);font-size:10px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.legend-today{width:12px;height:12px;border:1px solid rgba(255,255,255,.22);border-radius:4px}
.history-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.history-stat{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:12px 10px}
.history-stat b{display:block;font-size:18px;line-height:1.1;margin-bottom:5px;letter-spacing:-.02em}
.history-stat span{display:block;color:var(--muted);font-size:10px;line-height:1.2}

.day-view{display:grid;gap:18px}
.day-toolbar{display:grid;grid-template-columns:42px 1fr 42px;gap:10px;align-items:center}
.day-toolbar-main{display:flex;justify-content:center;align-items:center;gap:7px;min-width:0}
.day-back{display:inline-flex;align-items:center;gap:7px;background:transparent;border-color:transparent;color:var(--text-2);padding:8px 4px}
.day-back svg{width:17px;height:17px}
.day-date{text-align:center}
.day-date h2{font-size:20px;letter-spacing:-.025em}
.day-date p{font-size:11px;color:var(--muted);margin-top:3px}
.day-nav-button{width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--surface-3)}
.day-nav-button svg{width:18px;height:18px}
.day-state-section .section-heading{margin-bottom:10px}
.day-state-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.day-state-card{
    min-width:0;background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--border-soft);
    border-radius:14px;padding:10px 5px;text-align:center;cursor:pointer
}
.day-state-card .state-icon{margin-bottom:6px;width:27px;height:27px}
.day-state-card .state-icon svg{width:15px;height:15px}
.day-state-card .state-name{font-size:9px;min-height:20px}
.day-state-card .state-value{font-size:19px;margin-top:4px}
.day-state-card.mental .state-icon,.day-state-card.mental .state-value{color:var(--green)}
.day-state-card.body .state-icon,.day-state-card.body .state-value{color:var(--blue)}
.day-state-card.disp-mental .state-icon,.day-state-card.disp-mental .state-value{color:var(--amber)}
.day-state-card.disp-body .state-icon,.day-state-card.disp-body .state-value{color:var(--red)}
.day-state-card.empty-state{opacity:.72}

.timeline-wrap{position:relative;display:grid;gap:0;margin-top:2px}
.timeline-empty{padding:28px 14px;text-align:center;border:1px dashed var(--border);border-radius:16px;color:var(--muted);font-size:12px}
.timeline-item{display:grid;grid-template-columns:54px 18px minmax(0,1fr);gap:8px;position:relative;min-height:96px}
.timeline-time{padding-top:14px;color:var(--text-2);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.timeline-rail{position:relative;display:flex;justify-content:center}
.timeline-rail::before{content:'';position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(var(--accent),rgba(111,124,74,.18))}
.timeline-item:first-child .timeline-rail::before{top:20px}
.timeline-item:last-child .timeline-rail::before{bottom:calc(100% - 21px)}
.timeline-dot{position:relative;z-index:1;width:10px;height:10px;margin-top:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(111,124,74,.16)}
.timeline-card{
    margin:5px 0 12px;background:var(--surface);border:1px solid var(--border-soft);border-radius:15px;
    padding:12px 13px;cursor:pointer;transition:.16s ease
}
.timeline-card:active{transform:scale(.992);background:var(--surface-2)}
.timeline-title-row{display:flex;align-items:center;gap:9px;min-width:0}
.timeline-activity-icon{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;color:#a6b47a;background:rgba(111,124,74,.12)}
.timeline-activity-icon svg{width:16px;height:16px}
.timeline-title{font-size:13px;font-weight:690;color:var(--text);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline-meta{font-size:10px;color:var(--muted);margin-top:2px}
.timeline-notes{margin-top:10px;padding-top:9px;border-top:1px solid var(--border-soft);color:var(--text-2);font-size:11px;line-height:1.45}
.timeline-edit-hint{margin-top:8px;color:var(--muted);font-size:9px}
.small{font-size:12px;color:var(--muted)}

/* ETAPA 5 — bottom sheets e formulários móveis */
.modal{
    position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.68);
    display:flex;align-items:flex-end;justify-content:center;padding:0;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    animation:fadeIn .16s ease both
}
.modal-content{
    width:min(100%,560px);max-height:min(92dvh,820px);overflow:auto;
    background:linear-gradient(180deg,#151a21,#0f1318 34%);
    border:1px solid var(--border);border-bottom:0;border-radius:26px 26px 0 0;
    padding:9px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -18px 60px rgba(0,0,0,.46);
    animation:sheetUp .22s cubic-bezier(.2,.75,.25,1) both;
    overscroll-behavior:contain
}
.sheet-handle{width:36px;height:4px;border-radius:999px;background:#3a424d;margin:2px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.sheet-title-wrap{min-width:0}
.sheet-eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.modal-content h3{font-size:21px;line-height:1.15;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-close{width:36px;height:36px;flex:none;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.sheet-close svg{width:17px;height:17px}
.sheet-form{display:grid;gap:0}
.form-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:650;color:var(--text-2);margin:0 0 6px}
.form-label span{font-size:10px;font-weight:500;color:var(--muted)}
.modal-content input:not([type="range"]),.modal-content select,.modal-content textarea{
    margin:0 0 16px;background:#0b0f14;border-color:#29323d;border-radius:13px;padding:13px 14px
}
.modal-content input[type="date"],.modal-content input[type="time"]{min-height:47px}
.modal-content textarea{min-height:94px;max-height:180px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-buttons,.duration-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.duration-chip{
    min-height:43px;padding:8px 6px;border-radius:12px;background:var(--surface-2);color:var(--text-2);
    border-color:var(--border);font-size:12px;font-weight:650
}
.duration-chip.active{background:var(--accent-soft);border-color:rgba(111,124,74,.8);color:#c4d09a;box-shadow:inset 0 0 0 1px rgba(111,124,74,.16)}
.duration-custom{display:grid;grid-template-columns:1fr 86px auto;align-items:center;gap:8px;margin-bottom:16px;color:var(--muted);font-size:11px}
.duration-custom input{margin:0!important;text-align:center;padding:10px!important;min-height:40px!important}
.primary-action{
    width:100%;min-height:50px;margin-top:2px;border-color:#397ad9;background:linear-gradient(180deg,#438bf4,#2f6fd0);
    color:#fff;font-weight:730;box-shadow:0 8px 22px rgba(35,92,179,.22);display:flex;align-items:center;justify-content:center;gap:8px
}
.primary-action svg{width:18px;height:18px}
.secondary-action{width:100%;min-height:46px}
.danger-action{color:#ff9b9b;border-color:rgba(242,107,107,.3);background:rgba(242,107,107,.065)}
.management-zone{margin-top:22px;padding-top:16px;border-top:1px solid var(--border-soft)}
.management-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.management-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.management-actions button{min-height:42px;font-size:11px}
.state-control{padding:4px 0 18px}
.state-readout{font-size:48px;line-height:1;font-weight:780;letter-spacing:-.055em;text-align:center;color:var(--text);font-variant-numeric:tabular-nums;margin:2px 0 18px}
.state-readout.positive{color:#7dd9ac}.state-readout.negative{color:#ff8585}.state-readout.neutral{color:var(--text-2)}
.state-range{appearance:none;-webkit-appearance:none;width:100%;height:8px;border-radius:99px;outline:none;margin:0!important;background:linear-gradient(90deg,#df6868 0%,#69727d 50%,#58c895 100%)}
.state-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#f5f7fa;border:5px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.state-range::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:#f5f7fa;border:5px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.state-scale{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:10px}
.state-scale span:nth-child(2){color:var(--text-2)}
.menu-stack{display:grid;gap:9px}
.menu-stack button{width:100%;text-align:left;padding:14px}
.menu-note{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(22px);opacity:.4}to{transform:translateY(0);opacity:1}}
@media(min-width:700px){.modal{padding:24px;align-items:flex-end}.modal-content{border-bottom:1px solid var(--border);border-radius:26px}}

/* navegação inferior */
.bottom-nav{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;
    width:min(100%,var(--content));
    display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:rgba(12,15,19,.94);border-top:1px solid var(--border-soft);
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
}
.nav-item{
    border:0;background:transparent;padding:5px 2px 2px;border-radius:10px;
    min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--muted);font-size:9px
}
.nav-item svg{width:19px;height:19px;stroke-width:1.9}
.nav-item.active{color:var(--accent)}
.nav-item:hover{border-color:transparent}
.nav-item.add{position:relative;color:#f1eadc}
.nav-item.add .add-orb{
    width:42px;height:42px;margin-top:-22px;margin-bottom:2px;border-radius:50%;
    display:grid;place-items:center;background:linear-gradient(180deg,#778653,#556238);
    border:1px solid #879362;box-shadow:0 8px 20px rgba(0,0,0,.34)
}
.nav-item.add .add-orb svg{width:24px;height:24px}

@media(min-width:620px){
    .activities-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
    .activity-card{min-height:94px}
    .state-grid{gap:10px}
}
@media(max-width:360px){
    .container{padding-left:12px;padding-right:12px}
    .header-inner{padding-left:12px;padding-right:12px}
    .activities-grid,.state-grid{gap:6px}
    .activity-card{min-height:82px;padding-left:5px;padding-right:5px}
    .activity-title-btn{font-size:10px}
    .state-name{font-size:9px}
}

/* ETAPA 6 — polimento final para iPhone e uso diário */
html,body{overscroll-behavior-y:none}
body{-webkit-text-size-adjust:100%;touch-action:manipulation}
button,.state-card,.activity-card,.calendar-day,.day-state-card,.timeline-card{touch-action:manipulation}
button{min-height:44px}
button:focus-visible,.state-card:focus-visible,.activity-card:focus-visible,.calendar-day:focus-visible,.day-state-card:focus-visible,.timeline-card:focus-visible,
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid rgba(143,157,94,.95);outline-offset:2px}
.state-card,.activity-card,.day-state-card,.timeline-card{-webkit-tap-highlight-color:transparent}
.timeline-notes{white-space:pre-wrap;overflow-wrap:anywhere}
.modal-content{-webkit-overflow-scrolling:touch}
.state-range{touch-action:none}
body.modal-open{overflow:hidden}
body.keyboard-open .bottom-nav{opacity:0;pointer-events:none;transform:translate(-50%,110%)}
.bottom-nav{transition:opacity .18s ease,transform .18s ease}

.add-activity-note{margin:-4px 0 14px;color:var(--muted);font-size:11px;line-height:1.45}
.reorder-list{display:grid;gap:8px}
.reorder-item{display:grid;grid-template-columns:1fr 44px 44px;gap:7px;align-items:center;background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:7px 7px 7px 12px}
.reorder-name{min-width:0;font-size:13px;font-weight:620;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reorder-btn{width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--surface-3)}
.reorder-btn:disabled{opacity:.3;cursor:default}
.reorder-btn svg{width:17px;height:17px}

.toast-wrap{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;width:min(calc(100% - 32px),520px);pointer-events:none;display:grid;justify-items:center}
.toast{max-width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--border);background:rgba(22,27,34,.97);box-shadow:0 12px 34px rgba(0,0,0,.34);color:var(--text-2);font-size:12px;font-weight:600;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:toastIn .18s ease both}
.toast.success{border-color:rgba(72,199,142,.3)}
.toast.error{border-color:rgba(242,107,107,.35);color:#ffb0b0}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:699px){
    input,select,textarea{font-size:16px}
    .container{padding-top:18px}
    .header-inner{padding-bottom:12px}
    .state-card{min-height:82px}
    .calendar-day{min-width:38px;min-height:38px;aspect-ratio:auto}
}
@media(hover:none){button:hover,.calendar-day:hover{border-color:var(--border);transform:none}.nav-item:hover{border-color:transparent}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<header class="app-header">
    <div class="header-inner">
        <div class="brand-row">
            <div class="brand-mark" aria-hidden="true"><i data-lucide="footprints"></i></div>
            <div class="header-copy">
                <h1 id="screenTitle">Rastro</h1>
                <div id="screenSubtitle"></div>
            </div>
        </div>
    </div>
</header>

<input
    type="file"
    id="importFile"
    accept=".json"
    style="display:none"
    onchange="handleImport(event)"
>

<div class="container">

    <div id="homeScreen"></div>

    <div id="historyScreen" class="hidden"></div>

</div>

<div id="modalContainer"></div>
<div id="toastContainer" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>

        <i data-lucide="house"></i><span>Registrar</span>
    </button>
    <button class="nav-item" id="navHistory" onclick="showHistory()" aria-label="Histórico">
        <i data-lucide="calendar-days"></i><span>Histórico</span>
    </button>
    <button class="nav-item add" onclick="addActivity()" aria-label="Nova atividade">
        <span class="add-orb"><i data-lucide="plus"></i></span><span>Adicionar</span>
    </button>
    <button class="nav-item" onclick="openDataMenu()" aria-label="Dados">
        <i data-lucide="chart-no-axes-column-increasing"></i><span>Dados</span>
    </button>
    <button class="nav-item" onclick="openMoreMenu()" aria-label="Mais opções">
        <i data-lucide="ellipsis"></i><span>Mais</span>
    </button>
</nav>

<script>

const STATE_ACTIVITIES = [
"mente ao acordar",
"corpo ao acordar",
"disposição mental",
"disposição física"
];

const DEFAULT_ACTIVITIES = [
"Mente ao Acordar",
"Corpo ao Acordar",
"Disposição Mental",
"Disposição Física",
"Trabalho",
"Sono",
"Descanso",
"Treino",
"Leitura",
"Xadrez",
"Bíblia",
"Oração",
"Culto",
"Estudo Musical",
"Ensaio",
"Esposa",
"Filhos",
"Família",
"Redes Sociais",
"YouTube",
"Netflix",
"Casa",
"Meditação"
];

let activities =
JSON.parse(localStorage.getItem("rastro_activities"))
||
DEFAULT_ACTIVITIES.map(a=>({
    name:a,
    archived:false
}));

let records =
JSON.parse(localStorage.getItem("rastro_records"))
||
[];

let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let selectedDate = null;

let draggedIndex = null;
let draggedActivity = null;
let lastModalTrigger = null;
let activityTouchState = null;
let activityLongPressTimer = null;
let suppressActivityClickUntil = 0;

function escapeHTML(value){
    return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

function inlineArg(value){
    return JSON.stringify(String(value ?? ''))
        .replace(/&/g,'\\u0026')
        .replace(/</g,'\\u003c')
        .replace(/>/g,'\\u003e')
        .replace(/"/g,'&quot;');
}

function localDateISO(date=new Date()){
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

let toastTimer=null;
function showToast(message,type='success'){
    const host=document.getElementById('toastContainer');
    if(!host) return;
    clearTimeout(toastTimer);
    host.innerHTML=`<div class="toast ${type==='error'?'error':'success'}">${escapeHTML(message)}</div>`;
    toastTimer=setTimeout(()=>{host.innerHTML='';},2200);
}

function save(){
localStorage.setItem(
"rastro_activities",
JSON.stringify(activities)
);

localStorage.setItem(
"rastro_records",
JSON.stringify(records)
);
}

function formatHeaderDate(){
    const raw = new Intl.DateTimeFormat('pt-BR',{
        weekday:'long',day:'numeric',month:'long',year:'numeric'
    }).format(new Date());
    return raw.charAt(0).toUpperCase()+raw.slice(1);
}

function setActiveNav(screen){
    document.getElementById('navHome')?.classList.toggle('active',screen==='home');
    document.getElementById('navHistory')?.classList.toggle('active',screen==='history');
}

function setScreenHeader(title,subtitle=''){
    const titleEl=document.getElementById('screenTitle');
    const subtitleEl=document.getElementById('screenSubtitle');
    if(titleEl) titleEl.textContent=title;
    if(subtitleEl) subtitleEl.textContent=subtitle;
}

function showHome(){
    document.getElementById("homeScreen").classList.remove("hidden");
    document.getElementById("historyScreen").classList.add("hidden");
    setScreenHeader('Rastro',formatHeaderDate());
    setActiveNav('home');
    renderActivities();
    lucide.createIcons();
}

function showHistory(){
    document.getElementById("homeScreen").classList.add("hidden");
    document.getElementById("historyScreen").classList.remove("hidden");
    setScreenHeader('Histórico','Seu rastro ao longo do tempo');
    setActiveNav('history');
    renderHistory();
    lucide.createIcons();
}


const STATE_UI = [
    {name:'Mente ao Acordar', short:'Mente', icon:'brain', cls:'mental'},
    {name:'Corpo ao Acordar', short:'Corpo', icon:'person-standing', cls:'body'},
    {name:'Disposição Mental', short:'Disp. Mental', icon:'lightbulb', cls:'disp-mental'},
    {name:'Disposição Física', short:'Disp. Física', icon:'flame', cls:'disp-body'}
];

const ACTIVITY_ICONS = {
    'Trabalho':'briefcase-business','Sono':'moon','Descanso':'armchair','Treino':'dumbbell',
    'Leitura':'book-open','Xadrez':'chess-knight','Bíblia':'book-marked','Oração':'cross',
    'Culto':'church','Estudo Musical':'music','Ensaio':'guitar','Esposa':'heart',
    'Filhos':'baby','Família':'users','Redes Sociais':'smartphone','YouTube':'play',
    'Netflix':'tv','Casa':'house','Meditação':'brain'
};

function activityIcon(name){
    return ACTIVITY_ICONS[name] || 'circle-dot';
}

function todayISO(){
    return localDateISO();
}

function latestStateToday(name){
    const matches=records.filter(r=>r.activity===name && r.date===todayISO());
    return matches.length ? matches[matches.length-1] : null;
}

function formatStateValue(value){
    if(value===undefined || value===null || Number.isNaN(Number(value))) return '—';
    const n=Number(value);
    return n>0 ? `+${n}` : String(n);
}

function moveActivityObject(sourceActivity,targetActivity){
    const from=activities.indexOf(sourceActivity);
    const to=activities.indexOf(targetActivity);
    if(from<0 || to<0 || from===to) return false;
    const item=activities.splice(from,1)[0];
    activities.splice(to,0,item);
    return true;
}

function installLongPressReorder(card,activity){
    const HOLD_MS=430;
    const MOVE_TOLERANCE=11;

    card.addEventListener('contextmenu',e=>e.preventDefault());

    card.addEventListener('touchstart',e=>{
        if(e.touches.length!==1) return;
        clearTimeout(activityLongPressTimer);
        const t=e.touches[0];
        activityTouchState={
            card,
            activity,
            startX:t.clientX,
            startY:t.clientY,
            active:false,
            moved:false,
            lastTarget:null
        };

        activityLongPressTimer=setTimeout(()=>{
            if(!activityTouchState || activityTouchState.card!==card) return;
            activityTouchState.active=true;
            card.classList.add('reorder-source');
            document.body.classList.add('reordering');
            suppressActivityClickUntil=Date.now()+700;
            if(navigator.vibrate) navigator.vibrate(12);
        },HOLD_MS);
    },{passive:true});

    card.addEventListener('touchmove',e=>{
        const state=activityTouchState;
        if(!state || state.card!==card || e.touches.length!==1) return;
        const t=e.touches[0];

        if(!state.active){
            const dx=t.clientX-state.startX;
            const dy=t.clientY-state.startY;
            if(Math.hypot(dx,dy)>MOVE_TOLERANCE){
                clearTimeout(activityLongPressTimer);
                activityLongPressTimer=null;
                activityTouchState=null;
            }
            return;
        }

        e.preventDefault();
        const hit=document.elementFromPoint(t.clientX,t.clientY);
        const target=hit && hit.closest ? hit.closest('.activity-card') : null;
        document.querySelectorAll('.activity-card.reorder-target').forEach(el=>el.classList.remove('reorder-target'));
        if(!target || target===card || target.parentElement!==card.parentElement) return;
        target.classList.add('reorder-target');
        if(state.lastTarget===target) return;

        const targetName=target.dataset.activityName;
        const targetActivity=activities.find(a=>!a.archived && a.name===targetName && !STATE_ACTIVITIES.includes(a.name.toLowerCase()));
        if(!targetActivity || !moveActivityObject(activity,targetActivity)) return;

        const siblings=Array.from(card.parentElement.children);
        const sourcePos=siblings.indexOf(card);
        const targetPos=siblings.indexOf(target);
        if(sourcePos<targetPos) target.after(card);
        else target.before(card);

        state.lastTarget=target;
        state.moved=true;
        if(navigator.vibrate) navigator.vibrate(5);
    },{passive:false});

    const finishTouchReorder=e=>{
        const state=activityTouchState;
        clearTimeout(activityLongPressTimer);
        activityLongPressTimer=null;
        if(!state || state.card!==card) return;

        if(state.active){
            if(e && e.cancelable) e.preventDefault();
            suppressActivityClickUntil=Date.now()+650;
            card.classList.remove('reorder-source');
            document.querySelectorAll('.activity-card.reorder-target').forEach(el=>el.classList.remove('reorder-target'));
            document.body.classList.remove('reordering');
            if(state.moved){
                save();
                showToast('Ordem das atividades atualizada.');
            }
        }
        activityTouchState=null;
    };

    card.addEventListener('touchend',finishTouchReorder,{passive:false});
    card.addEventListener('touchcancel',finishTouchReorder,{passive:false});
}

function renderActivities(){
    const home=document.getElementById("homeScreen");
    const active=activities.filter(a=>!a.archived);
    const archived=activities.filter(a=>a.archived);
    const stateNames=new Set(STATE_ACTIVITIES.map(x=>x.toLowerCase()));
    const normalActivities=active.filter(a=>!stateNames.has(a.name.toLowerCase()));

    const stateCards=STATE_UI.map(cfg=>{
        const exists=active.some(a=>a.name.toLowerCase()===cfg.name.toLowerCase());
        if(!exists) return '';
        const r=latestStateToday(cfg.name);
        const value=r ? formatStateValue(r.value) : '—';
        return `
            <div class="state-card ${cfg.cls}" onclick="openRegister('${cfg.name}')">
                <div class="state-icon"><i data-lucide="${cfg.icon}"></i></div>
                <div class="state-name">${cfg.short}</div>
                <div class="state-value ${r?'':'empty'}">${value}</div>
            </div>`;
    }).join('');

    home.innerHTML=`
        <section aria-labelledby="todayStateTitle">
            <div class="section-heading">
                <h2 id="todayStateTitle">Estado de hoje</h2>
                <span class="eyebrow">toque para registrar</span>
            </div>
            <div class="state-grid">${stateCards}</div>
        </section>

        <section aria-labelledby="activityTitle">
            <div class="section-heading">
                <h2 id="activityTitle">Registrar atividade</h2>
                <span class="eyebrow">segure para reordenar</span>
            </div>
            <div class="activities-grid" id="activitiesGrid"></div>
        </section>
    `;

    normalActivities.forEach(activity=>{
        const card=document.createElement("div");
        card.className="card activity-card";
        card.draggable=!window.matchMedia('(pointer:coarse)').matches;
        card.dataset.activityName=activity.name;

        card.addEventListener("dragstart",()=>{
            draggedActivity=activity;
            card.classList.add('reorder-source');
        });
        card.addEventListener("dragend",()=>card.classList.remove('reorder-source'));
        card.addEventListener("dragover",e=>e.preventDefault());
        card.addEventListener("drop",()=>{
            if(!draggedActivity || !moveActivityObject(draggedActivity,activity)) return;
            save();
            renderActivities();
        });

        installLongPressReorder(card,activity);
        card.onclick=e=>{
            if(Date.now()<suppressActivityClickUntil){
                e.preventDefault();
                return;
            }
            openRegister(activity.name);
        };
        card.innerHTML=`
            <div class="activity-icon"><i data-lucide="${activityIcon(activity.name)}"></i></div>
            <div class="activity-title-btn">${escapeHTML(activity.name)}</div>
        `;
        document.getElementById("activitiesGrid").appendChild(card);
    });

    if(archived.length){
        const div=document.createElement('div');
        div.className='archived-wrap';
        div.innerHTML=`<div class="section-label">Arquivadas</div><div class="archived-grid">`+
            archived.map(a=>{
                const idx=activities.indexOf(a);
                return `<div class="archived-item">
                    <div class="activity-name">${escapeHTML(a.name)}</div>
                    <button class="restore-btn" onclick="event.stopPropagation();unarchiveActivity(${idx})">Restaurar</button>
                </div>`;
            }).join('')+`</div>`;
        home.appendChild(div);
    }

    lucide.createIcons();
}

function archiveActivity(index){
    activities[index].archived = true;
    save();
    renderActivities();
}

function unarchiveActivity(index){
    activities[index].archived = false;
    save();
    renderActivities();
}

function deleteActivity(index){

if(!confirm("Excluir atividade?")) return;

activities.splice(index,1);

save();
renderActivities();
}
function archiveByName(activityName){

    const idx = activities.findIndex(
        a => a.name === activityName
    );

    if(idx === -1) return;

    archiveActivity(idx);
    closeModal();
}

function deleteByName(activityName){

    const idx = activities.findIndex(
        a => a.name === activityName
    );

    if(idx === -1) return;

    deleteActivity(idx);
    closeModal();
}
function addActivity(){
    showModal('Nova atividade', `
        <div class="sheet-form">
            <p class="add-activity-note">Crie uma atividade para aparecer na grade de registro.</p>
            <label class="form-label" for="newActivityName">Nome da atividade</label>
            <input id="newActivityName" type="text" maxlength="40" autocomplete="off" placeholder="Ex.: Estudo, Caminhada, Projeto">
            <button class="primary-action" onclick="createActivity()"><i data-lucide="plus"></i> Adicionar atividade</button>
        </div>
    `,'Adicionar');
    setTimeout(()=>document.getElementById('newActivityName')?.focus(),220);
}

function createActivity(){
    const input=document.getElementById('newActivityName');
    const name=(input?.value || '').trim();
    if(!name){
        input?.focus();
        showToast('Informe o nome da atividade.','error');
        return;
    }
    if(activities.some(a=>a.name.trim().toLowerCase()===name.toLowerCase())){
        input?.focus();
        showToast('Essa atividade já existe.','error');
        return;
    }
    activities.push({name,archived:false});
    save();
    closeModal();
    renderActivities();
    showToast('Atividade adicionada.');
}

function openRegister(activity){

    const isState = STATE_ACTIVITIES.includes(activity.toLowerCase());
    const today = localDateISO();
    let content="";

    if(isState){
        content=`
        <div class="sheet-form">
            <label class="form-label" for="date">Data</label>
            <input id="date" type="date" value="${today}">

            <label class="form-label" for="value">Como está agora? <span>-10 a +10</span></label>
            <div class="state-control">
                <div id="stateReadout" class="state-readout neutral">0</div>
                <input id="value" class="state-range" type="range" min="-10" max="10" step="1" value="0"
                       oninput="updateStateRange('value','stateReadout')">
                <div class="state-scale"><span>-10</span><span>0</span><span>+10</span></div>
            </div>

            <label class="form-label" for="notes">Notas <span>opcional</span></label>
            <textarea id="notes" placeholder="Algum contexto que ajude a entender este registro?"></textarea>

            <button class="primary-action" onclick="saveStateRecord(${inlineArg(activity)})">
                <i data-lucide="check"></i> Registrar
            </button>

            <div class="management-zone">
                <div class="management-title">Gerenciar atividade</div>
                <div class="management-actions">
                    <button onclick="archiveByName(${inlineArg(activity)})"><i data-lucide="archive"></i> Arquivar</button>
                    <button class="danger-action" onclick="deleteByName(${inlineArg(activity)})"><i data-lucide="trash-2"></i> Excluir</button>
                </div>
            </div>
        </div>`;
    }else{
        content=`
        <div class="sheet-form">
            <div class="form-row">
                <div>
                    <label class="form-label" for="date">Data</label>
                    <input id="date" type="date" value="${today}">
                </div>
                <div>
                    <label class="form-label" for="startTime">Hora inicial</label>
                    <input id="startTime" type="time">
                </div>
            </div>

            <label class="form-label">Duração <span>toque para selecionar</span></label>
            <div class="duration-chips">
                ${[30,60,90,120,180,240].map(v=>
                    `<button type="button" class="duration-chip ${v===30?'active':''}" data-duration="${v}" onclick="setDuration(${v})">${formatDuration(v)}</button>`
                ).join("")}
            </div>
            <div class="duration-custom">
                <span>Outra duração</span>
                <input id="duration" type="number" min="1" step="5" value="30" oninput="syncDurationChips()">
                <span>min</span>
            </div>

            <label class="form-label" for="notes">Notas <span>opcional</span></label>
            <textarea id="notes" placeholder="O que vale a pena deixar registrado?"></textarea>

            <button class="primary-action" onclick="saveActivityRecord(${inlineArg(activity)})">
                <i data-lucide="check"></i> Registrar
            </button>

            <div class="management-zone">
                <div class="management-title">Gerenciar atividade</div>
                <div class="management-actions">
                    <button onclick="archiveByName(${inlineArg(activity)})"><i data-lucide="archive"></i> Arquivar</button>
                    <button class="danger-action" onclick="deleteByName(${inlineArg(activity)})"><i data-lucide="trash-2"></i> Excluir</button>
                </div>
            </div>
        </div>`;
    }

    showModal(activity,content,'Novo registro');
    if(isState) updateStateRange('value','stateReadout');
}

function formatDuration(min){
    if(min===60) return "1h";
    if(min===90) return "1h30";
    if(min===120) return "2h";
    if(min===180) return "3h";
    if(min===240) return "4h";
    return min+" min";
}

function setDuration(v, inputId='duration'){
    const input=document.getElementById(inputId);
    if(input) input.value=v;
    const scope=input?.closest('.sheet-form') || document;
    scope.querySelectorAll('.duration-chip').forEach(btn=>{
        btn.classList.toggle('active',Number(btn.dataset.duration)===Number(v));
    });
}

function syncDurationChips(inputId='duration'){
    const input=document.getElementById(inputId);
    if(!input) return;
    const scope=input.closest('.sheet-form') || document;
    scope.querySelectorAll('.duration-chip').forEach(btn=>{
        btn.classList.toggle('active',Number(btn.dataset.duration)===Number(input.value));
    });
}

function updateStateRange(inputId='value',outputId='stateReadout'){
    const input=document.getElementById(inputId);
    const output=document.getElementById(outputId);
    if(!input || !output) return;
    const v=Number(input.value);
    output.textContent=v>0?`+${v}`:String(v);
    output.classList.toggle('positive',v>0);
    output.classList.toggle('negative',v<0);
    output.classList.toggle('neutral',v===0);
}

function refreshAfterRecordSave(){
    const home=document.getElementById('homeScreen');
    const history=document.getElementById('historyScreen');
    if(home && !home.classList.contains('hidden')) renderActivities();
    if(history && !history.classList.contains('hidden')) renderHistory();
}

function saveStateRecord(activity){
    const dateEl=document.getElementById('date');
    const valueEl=document.getElementById('value');
    const notesEl=document.getElementById('notes');
    if(!dateEl || !valueEl) return;

    records.push({
        id:Date.now(),
        activity,
        date:dateEl.value,
        value:Number(valueEl.value),
        notes:notesEl?.value || ''
    });

    save();
    closeModal();
    refreshAfterRecordSave();
    showToast('Estado registrado.');
}

function saveActivityRecord(activity){
    const dateEl=document.getElementById('date');
    const startEl=document.getElementById('startTime');
    const durationEl=document.getElementById('duration');
    const notesEl=document.getElementById('notes');
    if(!dateEl || !durationEl) return;

    records.push({
        id:Date.now(),
        activity,
        date:dateEl.value,
        startTime:startEl?.value || '',
        duration:Math.max(1,Number(durationEl.value)||30),
        notes:notesEl?.value || ''
    });

    save();
    closeModal();
    refreshAfterRecordSave();
    showToast('Atividade registrada.');
}

function showModal(title,content,eyebrow='Rastro'){
    lastModalTrigger=document.activeElement instanceof HTMLElement ? document.activeElement : null;
    document.body.classList.add('modal-open');
    document.getElementById('modalContainer').innerHTML=`
    <div class="modal" onclick="closeModal()">
        <div class="modal-content" role="dialog" aria-modal="true" aria-label="${escapeHTML(title)}" onclick="event.stopPropagation()">
            <div class="sheet-handle" aria-hidden="true"></div>
            <div class="sheet-head">
                <div class="sheet-title-wrap">
                    <div class="sheet-eyebrow">${escapeHTML(eyebrow)}</div>
                    <h3>${escapeHTML(title)}</h3>
                </div>
                <button class="sheet-close" onclick="closeModal()" aria-label="Fechar"><i data-lucide="x"></i></button>
            </div>
            ${content}
        </div>
    </div>`;
    lucide.createIcons();
    setTimeout(()=>document.querySelector('.modal-content')?.scrollTo({top:0}),0);
}

function closeModal(){
    document.body.classList.remove('modal-open','keyboard-open');
    document.getElementById('modalContainer').innerHTML="";
    if(lastModalTrigger && document.contains(lastModalTrigger)){
        setTimeout(()=>lastModalTrigger.focus({preventScroll:true}),0);
    }
    lastModalTrigger=null;
}


function formatDateBR(date){
    const [y,m,d]=date.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    const raw=new Intl.DateTimeFormat('pt-BR',{day:'numeric',month:'long',year:'numeric'}).format(dt);
    return raw.charAt(0).toUpperCase()+raw.slice(1);
}

function formatWeekday(date){
    const [y,m,d]=date.split('-').map(Number);
    const dt=new Date(y,m-1,d);
    const raw=new Intl.DateTimeFormat('pt-BR',{weekday:'long'}).format(dt);
    return raw.charAt(0).toUpperCase()+raw.slice(1);
}

function monthKey(year,month){
    return `${year}-${String(month+1).padStart(2,'0')}`;
}

function renderHistory(){
    if(selectedDate){
        setScreenHeader('Rastro do dia',formatDateBR(selectedDate));
        renderDay(selectedDate);
    }else{
        setScreenHeader('Histórico','Seu rastro ao longo do tempo');
        renderCalendar();
    }
    lucide.createIcons();
}

function renderCalendar(){
    const history=document.getElementById("historyScreen");
    const months=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    const firstDay=new Date(currentYear,currentMonth,1);
    const totalDays=new Date(currentYear,currentMonth+1,0).getDate();
    const startWeekDay=firstDay.getDay();
    const key=monthKey(currentYear,currentMonth);
    const monthRecords=records.filter(r=>(r.date||'').startsWith(key));
    const counts={};
    monthRecords.forEach(r=>{counts[r.date]=(counts[r.date]||0)+1;});
    const recordedDays=Object.keys(counts).length;
    const durationMin=monthRecords
        .filter(r=>!STATE_ACTIVITIES.includes((r.activity||'').toLowerCase()))
        .reduce((sum,r)=>sum+(Number(r.duration)||0),0);
    const durationHours=Math.round((durationMin/60)*10)/10;
    const today=todayISO();

    let html=`
    <div class="history-shell">
        <div class="card calendar-card">
            <div class="calendar-top">
                <button class="icon-button" onclick="prevMonth()" aria-label="Mês anterior"><i data-lucide="chevron-left"></i></button>
                <h2>${months[currentMonth]} ${currentYear}</h2>
                <button class="icon-button" onclick="nextMonth()" aria-label="Próximo mês"><i data-lucide="chevron-right"></i></button>
            </div>

            <div class="calendar-grid">
                <div class="calendar-header">D</div>
                <div class="calendar-header">S</div>
                <div class="calendar-header">T</div>
                <div class="calendar-header">Q</div>
                <div class="calendar-header">Q</div>
                <div class="calendar-header">S</div>
                <div class="calendar-header">S</div>
    `;

    for(let i=0;i<startWeekDay;i++) html+=`<div></div>`;

    for(let day=1;day<=totalDays;day++){
        const date=`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const count=counts[date]||0;
        const classes=[
            'calendar-day',
            count ? 'has-record' : '',
            count>=5 ? 'many-records' : '',
            date===today ? 'today' : ''
        ].filter(Boolean).join(' ');
        html+=`
        <button class="${classes}" onclick="openDay('${date}')" aria-label="${day} de ${months[currentMonth]}, ${count} registros">
            ${day}
        </button>`;
    }

    html+=`
            </div>
            <div class="calendar-legend">
                <span class="legend-item"><span class="legend-dot"></span>com registros</span>
                <span class="legend-item"><span class="legend-today"></span>hoje</span>
            </div>
        </div>

        <div>
            <div class="section-heading"><h2>Resumo do mês</h2><span class="eyebrow">visão rápida</span></div>
            <div class="history-stats">
                <div class="history-stat"><b>${recordedDays}</b><span>dias registrados</span></div>
                <div class="history-stat"><b>${monthRecords.length}</b><span>registros totais</span></div>
                <div class="history-stat"><b>${String(durationHours).replace('.',',')}h</b><span>atividades</span></div>
            </div>
        </div>
    </div>`;

    history.innerHTML=html;
    lucide.createIcons();
}

function openDay(date){
    selectedDate=date;
    renderHistory();
}

function backToCalendar(){
    selectedDate=null;
    renderHistory();
}

function previousDay(){
    const [year, month, day] = selectedDate.split('-').map(Number);
    const d = new Date(year, month - 1, day);
    d.setDate(d.getDate() - 1);
    selectedDate =
        d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    renderHistory();
}

function nextDay(){
    const [year, month, day] = selectedDate.split('-').map(Number);
    const d = new Date(year, month - 1, day);
    d.setDate(d.getDate() + 1);
    selectedDate =
        d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    renderHistory();
}

function prevMonth(){
    currentMonth--;
    if(currentMonth<0){currentMonth=11;currentYear--;}
    renderCalendar();
}

function nextMonth(){
    currentMonth++;
    if(currentMonth>11){currentMonth=0;currentYear++;}
    renderCalendar();
}

function getEndTime(startTime, duration){
    if(!startTime) return '--:--';
    const [h,m] = startTime.split(':').map(Number);
    const totalMinutes = h * 60 + m + (Number(duration)||0);
    const endH = Math.floor(totalMinutes / 60) % 24;
    const endM = totalMinutes % 60;
    return `${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}`;
}

function latestStateForDate(name,date){
    const matches=records.filter(r=>r.activity===name && r.date===date);
    return matches.length ? matches[matches.length-1] : null;
}

function openRecordMenu(id){
    const r=records.find(x=>x.id===id);
    if(!r) return;
    showModal(r.activity,`
        <p class="menu-note">Escolha uma ação para este registro.</p>
        <div class="menu-stack">
            <button class="secondary-action" onclick="closeModal();editRecord(${id})"><i data-lucide="pencil"></i> Editar registro</button>
            <button class="secondary-action danger-action" onclick="closeModal();deleteRecord(${id})"><i data-lucide="trash-2"></i> Excluir registro</button>
        </div>
    `,'Registro');
}

function renderDay(date){
    const history=document.getElementById("historyScreen");
    const dayRecords=records.filter(r=>r.date===date);
    const activitiesOfDay=dayRecords
        .filter(r=>!STATE_ACTIVITIES.includes((r.activity||'').toLowerCase()))
        .sort((a,b)=>(a.startTime||"").localeCompare(b.startTime||""));

    const stateCards=STATE_UI.map(cfg=>{
        const r=latestStateForDate(cfg.name,date);
        const value=r ? formatStateValue(r.value) : '—';
        return `
            <div class="day-state-card ${cfg.cls} ${r?'':'empty-state'}" ${r?`onclick="openRecordMenu(${r.id})"`:''}>
                <div class="state-icon"><i data-lucide="${cfg.icon}"></i></div>
                <div class="state-name">${cfg.short}</div>
                <div class="state-value ${r?'':'empty'}">${value}</div>
            </div>`;
    }).join('');

    const stateNotes=STATE_UI.map(cfg=>{
        const r=latestStateForDate(cfg.name,date);
        if(!r || !r.notes) return '';
        return `<div class="timeline-card" onclick="openRecordMenu(${r.id})">
            <div class="timeline-title">${escapeHTML(cfg.name)}</div>
            <div class="timeline-notes">${escapeHTML(r.notes)}</div>
        </div>`;
    }).join('');

    const timeline=activitiesOfDay.length
        ? activitiesOfDay.map(r=>`
            <div class="timeline-item">
                <div class="timeline-time">${r.startTime||'--:--'}</div>
                <div class="timeline-rail"><span class="timeline-dot"></span></div>
                <div class="timeline-card" onclick="openRecordMenu(${r.id})">
                    <div class="timeline-title-row">
                        <div class="timeline-activity-icon"><i data-lucide="${activityIcon(r.activity)}"></i></div>
                        <div style="min-width:0">
                            <div class="timeline-title">${escapeHTML(r.activity)}</div>
                            <div class="timeline-meta">${r.startTime||'--:--'}–${getEndTime(r.startTime,r.duration)} · ${formatDuration(Number(r.duration)||0)}</div>
                        </div>
                    </div>
                    ${r.notes ? `<div class="timeline-notes">${escapeHTML(r.notes)}</div>` : ''}
                    <div class="timeline-edit-hint">Toque para editar ou excluir</div>
                </div>
            </div>`).join('')
        : `<div class="timeline-empty">Nenhuma atividade registrada neste dia.</div>`;

    history.innerHTML=`
    <div class="day-view">
        <div class="day-toolbar">
            <button class="day-nav-button" onclick="previousDay()" aria-label="Dia anterior"><i data-lucide="chevron-left"></i></button>
            <button class="day-back" onclick="backToCalendar()"><i data-lucide="calendar-days"></i><span>Voltar ao calendário</span></button>
            <button class="day-nav-button" onclick="nextDay()" aria-label="Próximo dia"><i data-lucide="chevron-right"></i></button>
        </div>

        <div class="day-date">
            <h2>${formatDateBR(date)}</h2>
            <p>${formatWeekday(date)} · ${dayRecords.length} ${dayRecords.length===1?'registro':'registros'}</p>
        </div>

        <section class="day-state-section">
            <div class="section-heading"><h2>Estado do dia</h2><span class="eyebrow">-10 a +10</span></div>
            <div class="day-state-grid">${stateCards}</div>
            ${stateNotes ? `<div class="section-label">Observações do estado</div>${stateNotes}` : ''}
        </section>

        <section>
            <div class="section-heading"><h2>Linha do tempo</h2><span class="eyebrow">${activitiesOfDay.length} ${activitiesOfDay.length===1?'atividade':'atividades'}</span></div>
            <div class="timeline-wrap">${timeline}</div>
        </section>
    </div>`;

    lucide.createIcons();
}

function deleteRecord(id){

if(!confirm("Excluir este registro?")) return;

records = records.filter(
r => r.id !== id
);

save();
if(document.querySelector('.modal')) closeModal();
renderHistory();
}

function editRecord(id){
    const record = records.find(r => r.id === id);
    if(!record) return;

    const isState = STATE_ACTIVITIES.includes(record.activity.toLowerCase());

    if(isState){
        showModal(record.activity, `
            <div class="sheet-form">
                <label class="form-label" for="editDate">Data</label>
                <input id="editDate" type="date" value="${record.date || ''}">

                <label class="form-label" for="editValue">Como estava? <span>-10 a +10</span></label>
                <div class="state-control">
                    <div id="editStateReadout" class="state-readout neutral">${Number(record.value)||0}</div>
                    <input id="editValue" class="state-range" type="range" min="-10" max="10" step="1" value="${Number(record.value)||0}"
                           oninput="updateStateRange('editValue','editStateReadout')">
                    <div class="state-scale"><span>-10</span><span>0</span><span>+10</span></div>
                </div>

                <label class="form-label" for="editNotes">Notas <span>opcional</span></label>
                <textarea id="editNotes">${record.notes || ''}</textarea>

                <button class="primary-action" onclick="saveEditedRecord(${id})"><i data-lucide="check"></i> Salvar alterações</button>
                <div class="management-zone">
                    <button class="secondary-action danger-action" onclick="deleteRecord(${id})"><i data-lucide="trash-2"></i> Excluir este registro</button>
                </div>
            </div>
        `,'Editar registro');
        updateStateRange('editValue','editStateReadout');
    }else{
        const d=Number(record.duration)||30;
        showModal(record.activity, `
            <div class="sheet-form">
                <div class="form-row">
                    <div>
                        <label class="form-label" for="editDate">Data</label>
                        <input id="editDate" type="date" value="${record.date || ''}">
                    </div>
                    <div>
                        <label class="form-label" for="editStartTime">Hora inicial</label>
                        <input id="editStartTime" type="time" value="${record.startTime || ''}">
                    </div>
                </div>

                <label class="form-label">Duração</label>
                <div class="duration-chips">
                    ${[30,60,90,120,180,240].map(v=>
                        `<button type="button" class="duration-chip ${v===d?'active':''}" data-duration="${v}" onclick="setDuration(${v},'editDuration')">${formatDuration(v)}</button>`
                    ).join('')}
                </div>
                <div class="duration-custom">
                    <span>Outra duração</span>
                    <input id="editDuration" type="number" min="1" step="5" value="${d}" oninput="syncDurationChips('editDuration')">
                    <span>min</span>
                </div>

                <label class="form-label" for="editNotes">Notas <span>opcional</span></label>
                <textarea id="editNotes">${record.notes || ''}</textarea>

                <button class="primary-action" onclick="saveEditedRecord(${id})"><i data-lucide="check"></i> Salvar alterações</button>
                <div class="management-zone">
                    <button class="secondary-action danger-action" onclick="deleteRecord(${id})"><i data-lucide="trash-2"></i> Excluir este registro</button>
                </div>
            </div>
        `,'Editar registro');
    }
}

function saveEditedRecord(id){

    const record = records.find(r => r.id === id);

    if(!record) return;

    const isState =
    STATE_ACTIVITIES.includes(
        record.activity.toLowerCase()
    );

    record.date =
    document.getElementById("editDate").value;

    record.notes =
    document.getElementById("editNotes").value;

    if(isState){

        record.value = Number(
            document.getElementById("editValue").value
        );

    }else{

        record.startTime =
        document.getElementById("editStartTime").value;

        record.duration = Number(
            document.getElementById("editDuration").value
        );

    }

    save();
    closeModal();
    renderHistory();
    showToast('Alterações salvas.');
}
function normalActiveActivities(){
    const stateSet=new Set(STATE_ACTIVITIES.map(x=>x.toLowerCase()));
    return activities.filter(a=>!a.archived && !stateSet.has(a.name.toLowerCase()));
}

function openReorderActivities(){
    const list=normalActiveActivities();
    const items=list.map((a,i)=>`
        <div class="reorder-item">
            <div class="reorder-name">${escapeHTML(a.name)}</div>
            <button class="reorder-btn" ${i===0?'disabled':''} onclick="moveActivity(${inlineArg(a.name)},-1)" aria-label="Mover ${escapeHTML(a.name)} para cima"><i data-lucide="chevron-up"></i></button>
            <button class="reorder-btn" ${i===list.length-1?'disabled':''} onclick="moveActivity(${inlineArg(a.name)},1)" aria-label="Mover ${escapeHTML(a.name)} para baixo"><i data-lucide="chevron-down"></i></button>
        </div>`).join('');
    showModal('Organizar atividades',`
        <p class="menu-note">Defina a ordem em que as atividades aparecem na tela Registrar.</p>
        <div class="reorder-list">${items || '<div class="small">Nenhuma atividade disponível.</div>'}</div>
    `,'Organização');
}

function moveActivity(name,direction){
    const list=normalActiveActivities();
    const pos=list.findIndex(a=>a.name===name);
    const target=pos+direction;
    if(pos<0 || target<0 || target>=list.length) return;
    const a=list[pos], b=list[target];
    const ia=activities.indexOf(a), ib=activities.indexOf(b);
    [activities[ia],activities[ib]]=[activities[ib],activities[ia]];
    save();
    renderActivities();
    openReorderActivities();
}

function openDataMenu(){
    showModal('Dados', `
        <p class="menu-note">Exportação dos registros do Rastro.</p>
        <div class="menu-stack">
            <button onclick="exportCSV();closeModal()">Exportar planilha (CSV)</button>
            <button onclick="exportJSON();closeModal()">Exportar backup (JSON)</button>
        </div>
    `,'Exportação');
}

function openMoreMenu(){
    showModal('Mais', `
        <p class="menu-note">Ações de manutenção do aplicativo.</p>
        <div class="menu-stack">
            <button onclick="closeModal();openReorderActivities()"><i data-lucide="list-restart"></i> Organizar atividades</button>
            <button onclick="importJSON();closeModal()"><i data-lucide="upload"></i> Importar backup (JSON)</button>
        </div>
    `,'Rastro');
}

function exportCSV(){

let csv =
"Data;Atividade;HoraInicial;Duracao;Valor;Notas\n";

records.forEach(r=>{

csv += [
r.date || "",
r.activity || "",
r.startTime || "",
r.duration || "",
r.value || "",
`"${(r.notes || "").replace(/"/g,'""')}"`
].join(";");

csv += "\n";

});

const blob = new Blob(
['\ufeff' + csv],
{type:"text/csv;charset=utf-8;"}
);

const link = document.createElement("a");

link.href = URL.createObjectURL(blob);

link.download = "rastro.csv";

link.click();
setTimeout(()=>URL.revokeObjectURL(link.href),1000);
showToast('Planilha exportada.');

}

function exportJSON(){

const data = {

exportadoEm:new Date(),

atividades:activities,

registros:records

};

const blob = new Blob(
[
JSON.stringify(data,null,2)
],
{
type:"application/json"
}
);

const link=document.createElement("a");

link.href=URL.createObjectURL(blob);

link.download="rastro.json";

link.click();
setTimeout(()=>URL.revokeObjectURL(link.href),1000);
showToast('Backup exportado.');

}

/* ===========================
   IMPORTAÇÃO JSON
=========================== */

function importJSON(){
    document.getElementById("importFile").click();
}

function handleImport(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        try{

            const data = JSON.parse(e.target.result);

          if(data.atividades){

    data.atividades.forEach(novaAtividade => {

        const existe = activities.some(
            a => a.name === novaAtividade.name
        );

        if(!existe){
            activities.push(novaAtividade);
        }
    });
}

if(data.registros){

    data.registros.forEach(registro => {

        records.push({
            ...registro,
            id: Date.now() + Math.random()
        });

    });
}

            save();

            renderActivities();

            showToast("Importação concluída com sucesso.");
            event.target.value="";

        }catch(error){

            showToast("Arquivo JSON inválido.","error");
            event.target.value="";

            console.error(error);
        }
    };

    reader.readAsText(file);
}
document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && document.querySelector('.modal')) closeModal();
    if(e.key==='Enter' && e.target?.id==='newActivityName') createActivity();
});

document.addEventListener('focusin',e=>{
    if(!e.target.closest?.('.modal-content')) return;
    if(!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),260);
});

if(window.visualViewport){
    const syncKeyboard=()=>{
        const delta=Math.max(0,window.innerHeight-window.visualViewport.height);
        document.body.classList.toggle('keyboard-open',delta>140 && !!document.querySelector('.modal'));
    };
    window.visualViewport.addEventListener('resize',syncKeyboard);
    window.visualViewport.addEventListener('scroll',syncKeyboard);
}

showHome();
</script>
