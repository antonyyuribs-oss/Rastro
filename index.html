<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastro</title>


<style>
:root{
    --bg:#0a0c0f;
    --surface:#11151a;
    --surface-2:#161b22;
    --surface-3:#0f1318;
    --border:#252d37;
    --border-soft:rgba(255,255,255,.07);
    --text:#f2f5f8;
    --text-2:#c4cbd4;
    --muted:#7f8a98;
    --accent:#3b82f6;
    --accent-soft:rgba(59,130,246,.14);
    --green:#48c78e;
    --blue:#60a5fa;
    --amber:#f3b54a;
    --red:#f26b6b;
    --radius-sm:12px;
    --radius-md:16px;
    --radius-lg:22px;
    --shadow:0 18px 45px rgba(0,0,0,.28);
    --content:760px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
    background:
        radial-gradient(circle at 50% -12%,rgba(59,130,246,.075),transparent 27rem),
        var(--bg);
    color:var(--text);
    line-height:1.45;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

.app-header{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(10,12,15,.82);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border-bottom:1px solid var(--border-soft);
}
.header-inner{
    width:min(100%,var(--content));
    margin:auto;
    padding:calc(12px + env(safe-area-inset-top)) 18px 14px;
}
.brand-row{display:flex;align-items:center;gap:13px}
.brand-mark{width:31px;height:28px;display:flex;flex-direction:column;justify-content:center;gap:5px;flex:none}
.brand-mark span{display:block;height:4px;border-radius:999px;background:linear-gradient(90deg,#6aa3ff,#3b82f6)}
.brand-mark span:nth-child(1){width:18px}
.brand-mark span:nth-child(2){width:28px;background:#dfe8f5}
.brand-mark span:nth-child(3){width:23px;opacity:.8}
.header-copy{min-width:0}
#screenTitle{font-size:24px;line-height:1.1;font-weight:760;letter-spacing:-.025em}
#screenSubtitle{margin-top:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.container{width:min(100%,var(--content));margin:auto;padding:20px 18px 28px}

.section-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:2px 0 11px}
.section-heading h2{font-size:16px;line-height:1.2;font-weight:720;letter-spacing:-.01em}
.section-heading .eyebrow{color:var(--muted);font-size:11px}
.section-label{margin:22px 0 10px;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.14em}

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px;
}

/* HOME — estados */
.state-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:23px}
.state-card{
    min-width:0;
    border:1px solid var(--border-soft);
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border-radius:14px;
    padding:12px 7px 11px;
    text-align:center;
    cursor:pointer;
    transition:border-color .16s ease,transform .16s ease,background .16s ease;
}
.state-card:active{transform:scale(.98)}
.state-icon{
    width:30px;height:30px;margin:0 auto 8px;border-radius:9px;
    display:grid;place-items:center;background:rgba(255,255,255,.035)
}
.state-icon svg{width:17px;height:17px}
.state-card.mental .state-icon,.state-card.mental .state-value{color:var(--green)}
.state-card.body .state-icon,.state-card.body .state-value{color:var(--blue)}
.state-card.disp-mental .state-icon,.state-card.disp-mental .state-value{color:var(--amber)}
.state-card.disp-body .state-icon,.state-card.disp-body .state-value{color:var(--red)}
.state-name{font-size:10px;line-height:1.16;color:var(--text-2);min-height:24px;display:flex;align-items:center;justify-content:center}
.state-value{font-size:22px;line-height:1.1;font-weight:760;margin-top:5px;letter-spacing:-.03em}
.state-value.empty{color:var(--muted)!important;font-weight:500}

/* HOME — atividades */
.activities-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.activity-card{
    min-height:86px;
    padding:11px 7px 9px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:border-color .16s ease,background .16s ease,transform .16s ease;
}
.activity-card:active{transform:scale(.98);background:#192029}
.activity-icon{
    width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    color:#7fb0ff;background:rgba(59,130,246,.08)
}
.activity-icon svg{width:18px;height:18px;stroke-width:1.9}
.activity-title-btn{width:100%;font-size:11px;line-height:1.15;font-weight:590;color:var(--text-2);overflow-wrap:anywhere}
.archived-wrap{margin-top:26px;padding-top:20px;border-top:1px solid var(--border-soft)}
.archived-grid{display:grid;gap:8px}
.archived-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.activity-name{font-weight:600;font-size:13px}

/* botões e formulários */
button{
    background:var(--surface-2);color:var(--text);border:1px solid var(--border);
    padding:10px 14px;border-radius:12px;cursor:pointer;transition:.16s ease;
}
button:hover{border-color:#3b4e68}
button:active{transform:scale(.985)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.restore-btn{border-color:rgba(59,130,246,.45);color:#9fc2ff}
input,select,textarea{
    width:100%;margin-top:8px;margin-bottom:14px;background:var(--surface-3);color:var(--text);
    border:1px solid var(--border);border-radius:12px;padding:12px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:100px}
.quick-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.quick-buttons button{padding:10px}
.modal-footer-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.modal-footer-actions button{width:100%}

/* histórico — mantém a função existente com acabamento novo */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.calendar-header{text-align:center;color:var(--muted);padding:5px 2px;font-size:11px}
.calendar-day{
    aspect-ratio:1/1;min-height:0;border:1px solid var(--border);border-radius:12px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--surface-3);transition:.16s
}
.calendar-day:hover{border-color:#3b4e68}
.calendar-day.has-record{background:var(--accent-soft);border-color:rgba(59,130,246,.72);font-weight:700;color:#dbeafe}
.calendar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.calendar-top h2{font-size:20px;letter-spacing:-.02em}
.back-btn{margin-bottom:16px}
.record{color:var(--text);padding:12px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;margin:8px 0}
.small{font-size:12px;color:var(--muted)}
.day{margin-bottom:34px;padding:20px;background:rgba(20,24,29,.55);border:1px solid var(--border);border-radius:20px}
.day-title{font-size:22px;margin-bottom:16px;font-weight:700;display:flex;justify-content:space-between}
.state-box{background:var(--surface-3);border:1px solid var(--border);padding:16px;border-radius:16px;margin-bottom:16px}
.timeline{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface)}
.slot{min-height:42px;border-bottom:1px solid rgba(255,255,255,.04);padding:8px 12px;display:flex;gap:14px}
.slot:has(.record){background:rgba(59,130,246,.05)}
.time{width:64px;color:var(--muted);font-size:13px}

/* modal atual — bottom sheet virá na etapa 5 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.modal-content{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#11161b;border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.modal-content h3{font-size:20px;letter-spacing:-.015em}
.menu-stack{display:grid;gap:9px}
.menu-stack button{width:100%;text-align:left;padding:14px}
.menu-note{font-size:12px;color:var(--muted);margin:0 0 12px}

/* navegação inferior */
.bottom-nav{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;
    width:min(100%,var(--content));
    display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:rgba(12,15,19,.94);border-top:1px solid var(--border-soft);
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
}
.nav-item{
    border:0;background:transparent;padding:5px 2px 2px;border-radius:10px;
    min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--muted);font-size:9px
}
.nav-item svg{width:19px;height:19px;stroke-width:1.9}
.nav-item.active{color:var(--accent)}
.nav-item:hover{border-color:transparent}
.nav-item.add{position:relative;color:#dbeafe}
.nav-item.add .add-orb{
    width:42px;height:42px;margin-top:-22px;margin-bottom:2px;border-radius:50%;
    display:grid;place-items:center;background:linear-gradient(180deg,#2b5f98,#203c5d);
    border:1px solid #416b97;box-shadow:0 8px 20px rgba(0,0,0,.34)
}
.nav-item.add .add-orb svg{width:24px;height:24px}

@media(min-width:620px){
    .activities-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
    .activity-card{min-height:94px}
    .state-grid{gap:10px}
}
@media(max-width:360px){
    .container{padding-left:12px;padding-right:12px}
    .header-inner{padding-left:12px;padding-right:12px}
    .activities-grid,.state-grid{gap:6px}
    .activity-card{min-height:82px;padding-left:5px;padding-right:5px}
    .activity-title-btn{font-size:10px}
    .state-name{font-size:9px}
}
</style>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<header class="app-header">
    <div class="header-inner">
        <div class="brand-row">
            <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="header-copy">
                <h1 id="screenTitle">Rastro</h1>
                <div id="screenSubtitle"></div>
            </div>
        </div>
    </div>
</header>

<input
    type="file"
    id="importFile"
    accept=".json"
    style="display:none"
    onchange="handleImport(event)"
>

<div class="container">

    <div id="homeScreen"></div>

    <div id="historyScreen" class="hidden"></div>

</div>

<div id="modalContainer"></div>

<nav class="bottom-nav" aria-label="Navegação principal">
    <button class="nav-item active" id="navHome" onclick="showHome()" aria-label="Registrar">
        <i data-lucide="house"></i><span>Registrar</span>
    </button>
    <button class="nav-item" id="navHistory" onclick="showHistory()" aria-label="Histórico">
        <i data-lucide="calendar-days"></i><span>Histórico</span>
    </button>
    <button class="nav-item add" onclick="addActivity()" aria-label="Nova atividade">
        <span class="add-orb"><i data-lucide="plus"></i></span><span>Adicionar</span>
    </button>
    <button class="nav-item" onclick="openDataMenu()" aria-label="Dados">
        <i data-lucide="chart-no-axes-column-increasing"></i><span>Dados</span>
    </button>
    <button class="nav-item" onclick="openMoreMenu()" aria-label="Mais opções">
        <i data-lucide="ellipsis"></i><span>Mais</span>
    </button>
</nav>

<script>

const STATE_ACTIVITIES = [
"mente ao acordar",
"corpo ao acordar",
"disposição mental",
"disposição física"
];

const DEFAULT_ACTIVITIES = [
"Mente ao Acordar",
"Corpo ao Acordar",
"Disposição Mental",
"Disposição Física",
"Trabalho",
"Sono",
"Descanso",
"Treino",
"Leitura",
"Xadrez",
"Bíblia",
"Oração",
"Culto",
"Estudo Musical",
"Ensaio",
"Esposa",
"Filhos",
"Família",
"Redes Sociais",
"YouTube",
"Netflix",
"Casa",
"Meditação"
];

let activities =
JSON.parse(localStorage.getItem("rastro_activities"))
||
DEFAULT_ACTIVITIES.map(a=>({
    name:a,
    archived:false
}));

let records =
JSON.parse(localStorage.getItem("rastro_records"))
||
[];

let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let selectedDate = null;

let draggedIndex = null;
let draggedActivity = null;

function save(){
localStorage.setItem(
"rastro_activities",
JSON.stringify(activities)
);

localStorage.setItem(
"rastro_records",
JSON.stringify(records)
);
}

function formatHeaderDate(){
    const raw = new Intl.DateTimeFormat('pt-BR',{
        weekday:'long',day:'numeric',month:'long',year:'numeric'
    }).format(new Date());
    return raw.charAt(0).toUpperCase()+raw.slice(1);
}

function setActiveNav(screen){
    document.getElementById('navHome')?.classList.toggle('active',screen==='home');
    document.getElementById('navHistory')?.classList.toggle('active',screen==='history');
}

function setScreenHeader(title,subtitle=''){
    const titleEl=document.getElementById('screenTitle');
    const subtitleEl=document.getElementById('screenSubtitle');
    if(titleEl) titleEl.textContent=title;
    if(subtitleEl) subtitleEl.textContent=subtitle;
}

function showHome(){
    document.getElementById("homeScreen").classList.remove("hidden");
    document.getElementById("historyScreen").classList.add("hidden");
    setScreenHeader('Rastro',formatHeaderDate());
    setActiveNav('home');
    renderActivities();
    lucide.createIcons();
}

function showHistory(){
    document.getElementById("homeScreen").classList.add("hidden");
    document.getElementById("historyScreen").classList.remove("hidden");
    setScreenHeader('Histórico','Seu rastro ao longo do tempo');
    setActiveNav('history');
    renderHistory();
    lucide.createIcons();
}


const STATE_UI = [
    {name:'Mente ao Acordar', short:'Mente', icon:'brain', cls:'mental'},
    {name:'Corpo ao Acordar', short:'Corpo', icon:'person-standing', cls:'body'},
    {name:'Disposição Mental', short:'Disp. Mental', icon:'lightbulb', cls:'disp-mental'},
    {name:'Disposição Física', short:'Disp. Física', icon:'flame', cls:'disp-body'}
];

const ACTIVITY_ICONS = {
    'Trabalho':'briefcase-business','Sono':'moon','Descanso':'armchair','Treino':'dumbbell',
    'Leitura':'book-open','Xadrez':'chess-knight','Bíblia':'book-marked','Oração':'cross',
    'Culto':'church','Estudo Musical':'music','Ensaio':'guitar','Esposa':'heart',
    'Filhos':'baby','Família':'users','Redes Sociais':'smartphone','YouTube':'play',
    'Netflix':'tv','Casa':'house','Meditação':'brain'
};

function activityIcon(name){
    return ACTIVITY_ICONS[name] || 'circle-dot';
}

function todayISO(){
    return new Date().toLocaleDateString('en-CA');
}

function latestStateToday(name){
    const matches=records.filter(r=>r.activity===name && r.date===todayISO());
    return matches.length ? matches[matches.length-1] : null;
}

function formatStateValue(value){
    if(value===undefined || value===null || Number.isNaN(Number(value))) return '—';
    const n=Number(value);
    return n>0 ? `+${n}` : String(n);
}

function renderActivities(){
    const home=document.getElementById("homeScreen");
    const active=activities.filter(a=>!a.archived);
    const archived=activities.filter(a=>a.archived);
    const stateNames=new Set(STATE_ACTIVITIES.map(x=>x.toLowerCase()));
    const normalActivities=active.filter(a=>!stateNames.has(a.name.toLowerCase()));

    const stateCards=STATE_UI.map(cfg=>{
        const exists=active.some(a=>a.name.toLowerCase()===cfg.name.toLowerCase());
        if(!exists) return '';
        const r=latestStateToday(cfg.name);
        const value=r ? formatStateValue(r.value) : '—';
        return `
            <div class="state-card ${cfg.cls}" onclick="openRegister('${cfg.name}')">
                <div class="state-icon"><i data-lucide="${cfg.icon}"></i></div>
                <div class="state-name">${cfg.short}</div>
                <div class="state-value ${r?'':'empty'}">${value}</div>
            </div>`;
    }).join('');

    home.innerHTML=`
        <section aria-labelledby="todayStateTitle">
            <div class="section-heading">
                <h2 id="todayStateTitle">Estado de hoje</h2>
                <span class="eyebrow">toque para registrar</span>
            </div>
            <div class="state-grid">${stateCards}</div>
        </section>

        <section aria-labelledby="activityTitle">
            <div class="section-heading">
                <h2 id="activityTitle">Registrar atividade</h2>
                <span class="eyebrow">${normalActivities.length} atividades</span>
            </div>
            <div class="activities-grid" id="activitiesGrid"></div>
        </section>
    `;

    normalActivities.forEach(activity=>{
        const card=document.createElement("div");
        card.className="card activity-card";
        card.draggable=true;

        card.addEventListener("dragstart",()=>{draggedActivity=activity;});
        card.addEventListener("dragover",e=>e.preventDefault());
        card.addEventListener("drop",()=>{
            const from=activities.indexOf(draggedActivity);
            const to=activities.indexOf(activity);
            if(from<0 || to<0 || from===to) return;
            const item=activities.splice(from,1)[0];
            activities.splice(to,0,item);
            save();
            renderActivities();
        });

        card.onclick=()=>openRegister(activity.name);
        card.innerHTML=`
            <div class="activity-icon"><i data-lucide="${activityIcon(activity.name)}"></i></div>
            <div class="activity-title-btn">${activity.name}</div>
        `;
        document.getElementById("activitiesGrid").appendChild(card);
    });

    if(archived.length){
        const div=document.createElement('div');
        div.className='archived-wrap';
        div.innerHTML=`<div class="section-label">Arquivadas</div><div class="archived-grid">`+
            archived.map(a=>{
                const idx=activities.indexOf(a);
                return `<div class="archived-item">
                    <div class="activity-name">${a.name}</div>
                    <button class="restore-btn" onclick="event.stopPropagation();unarchiveActivity(${idx})">Restaurar</button>
                </div>`;
            }).join('')+`</div>`;
        home.appendChild(div);
    }

    lucide.createIcons();
}

function archiveActivity(index){
    activities[index].archived = true;
    save();
    renderActivities();
}

function unarchiveActivity(index){
    activities[index].archived = false;
    save();
    renderActivities();
}

function deleteActivity(index){

if(!confirm("Excluir atividade?")) return;

activities.splice(index,1);

save();
renderActivities();
}
function archiveByName(activityName){

    const idx = activities.findIndex(
        a => a.name === activityName
    );

    if(idx === -1) return;

    archiveActivity(idx);
    closeModal();
}

function deleteByName(activityName){

    const idx = activities.findIndex(
        a => a.name === activityName
    );

    if(idx === -1) return;

    deleteActivity(idx);
    closeModal();
}
function addActivity(){

const name=prompt("Nome da atividade");

if(!name) return;

activities.push({
name,
archived:false
});

save();
renderActivities();
}

function openRegister(activity){

const isState =
STATE_ACTIVITIES.includes(
activity.toLowerCase()
);

const today=
new Date().toLocaleDateString('en-CA');

let content="";

if(isState){

content=`
<label>Data</label>
<input id="date" type="date" value="${today}">

<label>Valor (-10 a +10)</label>
<input id="value" type="number" min="-10" max="10" value="0">

<label>Notas</label>
<textarea id="notes"></textarea>

<button onclick="saveStateRecord('${activity}')">
Salvar
</button>

<br><br>

<button onclick="deleteByName('${activity}')">
Excluir
</button>

<button onclick="archiveByName('${activity}')">
Arquivar
</button>
`;

}else{

content=`
<label>Data</label>
<input id="date" type="date" value="${today}">

<label>Hora Inicial</label>
<input id="startTime" type="time">

<label>Duração</label>

<div class="quick-buttons">
${[
30,60,90,120,180,240
].map(v=>
`<button type="button"
onclick="setDuration(${v})">${formatDuration(v)}</button>`
).join("")}
</div>

<input id="duration" type="number" value="30">

<label>Notas</label>
<textarea id="notes"></textarea>

<div class="modal-footer-actions">

<button onclick="saveActivityRecord('${activity}')">
Salvar
</button>

<button onclick="deleteByName('${activity}')">
Excluir
</button>

<button onclick="archiveByName('${activity}')">
Arquivar
</button>

</div>
`;
}

showModal(activity,content);

}

function formatDuration(min){

if(min===60) return "1h";
if(min===90) return "1h30";
if(min===120) return "2h";
if(min===180) return "3h";
if(min===240) return "4h";

return min+" min";
}

function setDuration(v){
document.getElementById("duration").value=v;
}

function saveStateRecord(activity){

records.push({
id:Date.now(),
activity,
date:date.value,
value:Number(value.value),
notes:notes.value
});

save();
closeModal();
}

function saveActivityRecord(activity){

records.push({
id:Date.now(),
activity,
date:date.value,
startTime:startTime.value,
duration:Number(duration.value),
notes:notes.value
});

save();
closeModal();
}

function showModal(title,content){

document.getElementById(
"modalContainer"
).innerHTML=
`
<div class="modal">
<div class="modal-content">
<h3>${title}</h3>
<br>
${content}
<br>
<button onclick="closeModal()">Fechar</button>
</div>
</div>
`;
}

function closeModal(){
document.getElementById(
"modalContainer"
).innerHTML="";
}


function renderHistory(){

    if(selectedDate){
        renderDay(selectedDate);
    }else{
        renderCalendar();
    }

}

function renderCalendar(){

    const history=document.getElementById("historyScreen");

    const months=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

    const firstDay=new Date(currentYear,currentMonth,1);
    const totalDays=new Date(currentYear,currentMonth+1,0).getDate();
    const startWeekDay=firstDay.getDay();

    const datesWithRecords=[...new Set(records.map(r=>r.date))];

    let html=`
    <div class="card">
        <div class="calendar-top">
            <button onclick="prevMonth()">◀</button>
            <h2>${months[currentMonth]} ${currentYear}</h2>
            <button onclick="nextMonth()">▶</button>
        </div>

        <div class="calendar-grid">
            <div class="calendar-header">D</div>
            <div class="calendar-header">S</div>
            <div class="calendar-header">T</div>
            <div class="calendar-header">Q</div>
            <div class="calendar-header">Q</div>
            <div class="calendar-header">S</div>
            <div class="calendar-header">S</div>
    `;

    for(let i=0;i<startWeekDay;i++) html+=`<div></div>`;

    for(let day=1;day<=totalDays;day++){

        const date=`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

        html+=`
        <div class="calendar-day ${datesWithRecords.includes(date)?'has-record':''}"
             onclick="openDay('${date}')">
             ${day}
        </div>`;
    }

    html+=`</div></div>`;

    history.innerHTML=html;
}

function openDay(date){
    selectedDate=date;
    renderHistory();
}

function backToCalendar(){
    selectedDate=null;
    renderHistory();
}
function previousDay(){

    const [year, month, day] = selectedDate.split('-').map(Number);

    const d = new Date(year, month - 1, day);

    d.setDate(d.getDate() - 1);

    selectedDate =
        d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');

    renderHistory();
}

function nextDay(){

    const [year, month, day] = selectedDate.split('-').map(Number);

    const d = new Date(year, month - 1, day);

    d.setDate(d.getDate() + 1);

    selectedDate =
        d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');

    renderHistory();
}
function prevMonth(){
    currentMonth--;
    if(currentMonth<0){
        currentMonth=11;
        currentYear--;
    }
    renderCalendar();
}

function nextMonth(){
    currentMonth++;
    if(currentMonth>11){
        currentMonth=0;
        currentYear++;
    }
    renderCalendar();
}
function getEndTime(startTime, duration){

    if(!startTime) return '--:--';

    const [h,m] = startTime.split(':').map(Number);

    const totalMinutes = h * 60 + m + duration;

    const endH = Math.floor(totalMinutes / 60) % 24;
    const endM = totalMinutes % 60;

    return `${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}`;
}
function renderDay(date){

    const history=document.getElementById("historyScreen");

    const dayRecords=records.filter(r=>r.date===date);

    const states=dayRecords.filter(r=>
        STATE_ACTIVITIES.includes(r.activity.toLowerCase())
    );

    const activities=dayRecords.filter(r=>
        !STATE_ACTIVITIES.includes(r.activity.toLowerCase())
    );

        history.innerHTML=`
<div class="card">

    <div style="
        display:flex;
        gap:10px;
        align-items:center;
        margin-bottom:16px;
        flex-wrap:wrap;
    ">

        <button onclick="backToCalendar()">
            ← Calendário
        </button>

        <button onclick="previousDay()">
            ⬅️
        </button>

        <button onclick="nextDay()">
            ➡️
        </button>

    </div>

    <h2>${date}</h2>


${states.length
? states.map(r=>`
    <div class="record">

        <strong>${r.activity}</strong>: ${r.value}

        ${r.notes ? `
            <div style="margin-top:8px;color:#c9d2dc;">
                ${r.notes}
            </div>
        ` : ''}

        <br><br>

        <button onclick="editRecord(${r.id})">
            Editar
        </button>

        <button onclick="deleteRecord(${r.id})">
            Excluir
        </button>

    </div>
`).join('')
    : '<div class="small">Sem registros</div>'
}

        <div class="section-label">Atividades</div>

        ${activities.length
            ? activities.sort((a,b)=>(a.startTime||"").localeCompare(b.startTime||""))
                .map(r=>`
<div class="record">

    <strong>
${r.startTime||'--:--'}–${getEndTime(r.startTime,r.duration)}
</strong>
    • ${r.activity}
    (${formatDuration(r.duration)})

    ${r.notes ? `
        <div style="
            margin-top:10px;
            padding:10px;
            background:#101419;
            border-radius:10px;
            color:#c9d2dc;
        ">
            ${r.notes}
        </div>
    ` : ''}

    <br><br>

    <button onclick="editRecord(${r.id})">
        Editar
    </button>

    <button onclick="deleteRecord(${r.id})">
        Excluir
    </button>

</div>`).join('')
            : '<div class="small">Sem atividades</div>'}

    </div>`;
}

function deleteRecord(id){

if(!confirm("Excluir este registro?")) return;

records = records.filter(
r => r.id !== id
);

save();
renderHistory();
}

function editRecord(id){

    const record = records.find(r => r.id === id);

    if(!record) return;

    const isState =
    STATE_ACTIVITIES.includes(
        record.activity.toLowerCase()
    );

    if(isState){

        showModal("Editar Registro", `

            <label>Data</label>
            <input id="editDate"
                   type="date"
                   value="${record.date || ''}">

            <label>Valor (-10 a +10)</label>
            <input id="editValue"
                   type="number"
                   min="-10"
                   max="10"
                   value="${record.value || 0}">

            <label>Notas</label>
            <textarea id="editNotes">${record.notes || ''}</textarea>

            <button onclick="saveEditedRecord(${id})">
                Salvar Alterações
            </button>

        `);

    }else{

        showModal("Editar Registro", `

            <label>Data</label>
            <input id="editDate"
                   type="date"
                   value="${record.date || ''}">

            <label>Hora Inicial</label>
            <input id="editStartTime"
                   type="time"
                   value="${record.startTime || ''}">

            <label>Duração (min)</label>
            <input id="editDuration"
                   type="number"
                   value="${record.duration || 30}">

            <label>Notas</label>
            <textarea id="editNotes">${record.notes || ''}</textarea>

            <button onclick="saveEditedRecord(${id})">
                Salvar Alterações
            </button>

        `);

    }

}

function saveEditedRecord(id){

    const record = records.find(r => r.id === id);

    if(!record) return;

    const isState =
    STATE_ACTIVITIES.includes(
        record.activity.toLowerCase()
    );

    record.date =
    document.getElementById("editDate").value;

    record.notes =
    document.getElementById("editNotes").value;

    if(isState){

        record.value = Number(
            document.getElementById("editValue").value
        );

    }else{

        record.startTime =
        document.getElementById("editStartTime").value;

        record.duration = Number(
            document.getElementById("editDuration").value
        );

    }

    save();
    closeModal();
    renderHistory();
}

    showModal('Mais', `

        </div>
    `);
}

function exportCSV(){

let csv =
"Data;Atividade;HoraInicial;Duracao;Valor;Notas\n";

records.forEach(r=>{

csv += [
r.date || "",
r.activity || "",
r.startTime || "",
r.duration || "",
r.value || "",
`"${(r.notes || "").replace(/"/g,'""')}"`
].join(";");

csv += "\n";

});

const blob = new Blob(
['\ufeff' + csv],
{type:"text/csv;charset=utf-8;"}
);

const link = document.createElement("a");

link.href = URL.createObjectURL(blob);

link.download = "rastro.csv";

link.click();

}

function exportJSON(){

const data = {

exportadoEm:new Date(),

atividades:activities,

registros:records

};

const blob = new Blob(
[
JSON.stringify(data,null,2)
],
{
type:"application/json"
}
);

const link=document.createElement("a");

link.href=URL.createObjectURL(blob);

link.download="rastro.json";

link.click();

}

function importJSON(){
    document.getElementById("importFile").click();
}

function handleImport(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        try{

            const data = JSON.parse(e.target.result);

          if(data.atividades){

    data.atividades.forEach(novaAtividade => {

        const existe = activities.some(
            a => a.name === novaAtividade.name
        );

        if(!existe){
            activities.push(novaAtividade);
        }
    });
}

if(data.registros){

    data.registros.forEach(registro => {

        records.push({
            ...registro,
            id: Date.now() + Math.random()
        });

    });
}

            save();

            renderActivities();

            alert("Importação concluída com sucesso.");

        }catch(error){

            alert("Arquivo JSON inválido.");

            console.error(error);
        }
    };

    reader.readAsText(file);
}
