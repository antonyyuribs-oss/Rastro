<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastro</title>

<style>
body{
    margin:0;
    background:#0b0b0d;
    color:#ffffff;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

header{
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:700;
    border-bottom:1px solid #222;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

.card{
    background:#16181d;
    border-radius:16px;
    padding:18px;
    margin-bottom:12px;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    background:#1f2229;
}

.activity{
    font-size:18px;
    font-weight:600;
}

.subtitle{
    color:#999;
    margin-top:6px;
    font-size:14px;
}

button{
    width:100%;
    background:#2563eb;
    color:white;
    border:none;
    padding:16px;
    border-radius:14px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    opacity:.9;
}
</style>

</head>
<body>

<header>
Rastro
</header>

<div class="container">

<div class="card">
<div class="activity">Mente ao Acordar</div>
<div class="subtitle">Registrar valor de -10 a +10</div>
</div>

<div class="card">
<div class="activity">Corpo ao Acordar</div>
<div class="subtitle">Registrar valor de -10 a +10</div>
</div>

<div class="card">
<div class="activity">Disposição Mental</div>
<div class="subtitle">Registrar valor de -10 a +10</div>
</div>

<div class="card">
<div class="activity">Disposição Física</div>
<div class="subtitle">Registrar valor de -10 a +10</div>
</div>

<div class="card">
<div class="activity">Trabalho</div>
<div class="subtitle">Registrar duração</div>
</div>

<div class="card">
<div class="activity">Treino</div>
<div class="subtitle">Registrar duração</div>
</div>

<div class="card">
<div class="activity">Leitura</div>
<div class="subtitle">Registrar duração</div>
</div>

<button>
Novo Registro
</button>

</div>

</body>
</html>
