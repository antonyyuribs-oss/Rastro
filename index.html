<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastro</title>


<style>
:root{
    --bg:#0b0d10;
    --card:#14181d;
    --border:#242b33;
    --text:#e8edf2;
    --muted:#8e99a5;
    --accent:#2d6cdf;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
}

header{
    position:sticky;
    top:0;
    background:rgba(11,13,16,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
    padding:18px 22px;
    z-index:10;
}

h1{
    font-size:26px;
    font-weight:700;
    letter-spacing:.5px;
}

.nav{
    margin-top:14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    transition:.18s ease;
}

button:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
}

.container{
    max-width:1700px;
    margin:auto;
    padding:20px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    margin-bottom:0;
}

.activity{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    cursor:grab;
}

.activity-name{
    font-weight:600;
    font-size:15px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

input,select,textarea{
    width:100%;
    margin-top:8px;
    margin-bottom:14px;
    background:#101419;
    color:var(--text);
    border:1px solid #2b3440;
    border-radius:12px;
    padding:12px;
}

textarea{
    resize:vertical;
    min-height:100px;
}

.hidden{display:none;}

.day{
    margin-bottom:34px;
    padding:20px;
    background:rgba(20,24,29,.55);
    border:1px solid var(--border);
    border-radius:20px;
}

.day-title{
    font-size:22px;
    margin-bottom:16px;
    font-weight:700;
}

.state-box{
    background:#101419;
    border:1px solid var(--border);
    padding:16px;
    border-radius:16px;
    margin-bottom:16px;
}

.timeline{
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    background:#11161b;
}

.slot{
    min-height:42px;
    border-bottom:1px solid rgba(255,255,255,.04);
    padding:8px 12px;
    display:flex;
    gap:14px;
}

.time{
    width:64px;
    color:var(--muted);
    font-size:13px;
}

.record{
    color:var(--text);
}

.small{
    font-size:12px;
    color:var(--muted);
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    width:100%;
    max-width:560px;
    background:#11161b;
    border:1px solid var(--border);
    border-radius:22px;
    padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.quick-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:12px;
}

.quick-buttons button{
    padding:10px;
}

@media(max-width:720px){
    .activity{
        flex-direction:column;
        align-items:flex-start;
    }

    .actions{
        width:100%;
    }

    .actions button{
        flex:1;
    }
}

.hero{background:linear-gradient(180deg,#171c23,#11161b);padding:24px;border:1px solid var(--border);border-radius:24px;margin-bottom:24px}
.metrics{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px}
.metric b{font-size:28px;display:block}
.section-label{margin:20px 0 10px;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.1em}
.activity-card{display:flex;justify-content:space-between;align-items:center;gap:20px}
.activities-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.activity-meta{color:var(--muted);font-size:12px;margin-top:4px}
    .activity-title-btn{
    background:none;
    border:none;
    padding:0;
    color:var(--text);
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}

.activity-title-btn:hover{
    color:var(--accent);
    transform:none;
}
    .modal-footer-actions{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:20px;
}

.modal-footer-actions button{
    width:100%;
}
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}
.archived-wrap{margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.restore-btn{border-color:var(--accent)}
.day-title{display:flex;justify-content:space-between}
.record{padding:8px 10px;background:#171c23;border-radius:10px;margin:4px 0}
.slot:has(.record){background:rgba(45,108,223,.05)}

.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.calendar-header{text-align:center;color:var(--muted);padding:8px;font-size:12px}
.calendar-day{min-height:70px;border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#101419;transition:.2s}
.calendar-day:hover{border-color:var(--accent)}
.calendar-day.has-record{background:rgba(45,108,223,.15);border-color:var(--accent);font-weight:bold}
.calendar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.back-btn{margin-bottom:16px}

</style>

</head>
<body>

<header>
    <div class="nav">
    <button onclick="showHome()">Registro</button>
    <button onclick="showHistory()">Histórico</button>
    <button onclick="addActivity()">+</button>
    <button onclick="exportCSV()">Excel</button>
    <button onclick="exportJSON()">IA</button>
</div>
</header>

<div class="container">

    <div id="homeScreen"></div>

    <div id="historyScreen" class="hidden"></div>

</div>

<div id="modalContainer"></div>

<script>

const STATE_ACTIVITIES = [
"mente ao acordar",
"corpo ao acordar",
"disposição mental",
"disposição física"
];

const DEFAULT_ACTIVITIES = [
"Mente ao Acordar",
"Corpo ao Acordar",
"Disposição Mental",
"Disposição Física",
"Trabalho",
"Sono",
"Descanso",
"Treino",
"Leitura",
"Xadrez",
"Bíblia",
"Oração",
"Culto",
"Estudo Musical",
"Ensaio",
"Esposa",
"Filhos",
"Família",
"Redes Sociais",
"YouTube",
"Netflix",
"Casa",
"Meditação"
];

let activities =
JSON.parse(localStorage.getItem("rastro_activities"))
||
DEFAULT_ACTIVITIES.map(a=>({
    name:a,
    archived:false
}));

let records =
JSON.parse(localStorage.getItem("rastro_records"))
||
[];

let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let selectedDate = null;

let draggedIndex = null;
let draggedActivity = null;

function save(){
localStorage.setItem(
"rastro_activities",
JSON.stringify(activities)
);

localStorage.setItem(
"rastro_records",
JSON.stringify(records)
);
}

function showHome(){
document.getElementById("homeScreen").classList.remove("hidden");
document.getElementById("historyScreen").classList.add("hidden");
renderActivities();
}

function showHistory(){
document.getElementById("homeScreen").classList.add("hidden");
document.getElementById("historyScreen").classList.remove("hidden");
renderHistory();
}


function renderActivities(){

const home=document.getElementById("homeScreen");

const active=activities.filter(a=>!a.archived);
const archived=activities.filter(a=>a.archived);

home.innerHTML=`

<div class="section-label">
Atividades Ativas
</div>

<div class="activities-grid" id="activitiesGrid">
</div>

`;

active.forEach(activity=>{

const total=records.filter(r=>r.activity===activity.name).length;
const idx=activities.indexOf(activity);

const card=document.createElement("div");
card.className="card activity-card";
card.draggable = true;

card.addEventListener("dragstart", () => {
    draggedActivity = activity;
});

card.addEventListener("dragover", (e) => {
    e.preventDefault();
});

card.addEventListener("drop", () => {

    const from = activities.indexOf(draggedActivity);
    const to = activities.indexOf(activity);

    const item = activities.splice(from, 1)[0];
    activities.splice(to, 0, item);

    save();
    renderActivities();
});
card.innerHTML=`
<div>
    <button
        class="activity-title-btn"
        onclick="openRegister('${activity.name}')">
        ${activity.name}
    </button>

    
</div>
`;

document
.getElementById("activitiesGrid")
.appendChild(card);
});

if(archived.length){
const div=document.createElement('div');
div.className='archived-wrap';
div.innerHTML=`<div class="section-label">Arquivadas</div>` +
archived.map(a=>{
const idx=activities.indexOf(a);
return `<div class="card activity-card">
<div><div class="activity-name">${a.name}</div></div>
<div class="actions"><button class="restore-btn" onclick="unarchiveActivity(${idx})">Restaurar</button></div>
</div>`;
}).join('');
home.appendChild(div);
}
}

function archiveActivity(index){
    activities[index].archived = true;
    save();
    renderActivities();
}

function unarchiveActivity(index){
    activities[index].archived = false;
    save();
    renderActivities();
}

function deleteActivity(index){

if(!confirm("Excluir atividade?")) return;

activities.splice(index,1);

save();
renderActivities();
}
function archiveByName(activityName){

    const idx = activities.findIndex(
        a => a.name === activityName
    );

    if(idx === -1) return;

    archiveActivity(idx);
    closeModal();
}

function deleteByName(activityName){

    const idx = activities.findIndex(
        a => a.name === activityName
    );

    if(idx === -1) return;

    deleteActivity(idx);
    closeModal();
}
function addActivity(){

const name=prompt("Nome da atividade");

if(!name) return;

activities.push({
name,
archived:false
});

save();
renderActivities();
}

function openRegister(activity){

const isState =
STATE_ACTIVITIES.includes(
activity.toLowerCase()
);

const today=
new Date().toLocaleDateString('en-CA');

let content="";

if(isState){

content=`
<label>Data</label>
<input id="date" type="date" value="${today}">

<label>Valor (-10 a +10)</label>
<input id="value" type="number" min="-10" max="10" value="0">

<label>Notas</label>
<textarea id="notes"></textarea>

<button onclick="saveStateRecord('${activity}')">
Salvar
</button>
`;

}else{

content=`
<label>Data</label>
<input id="date" type="date" value="${today}">

<label>Hora Inicial</label>
<input id="startTime" type="time">

<label>Duração</label>

<div class="quick-buttons">
${[
30,60,90,120,180,240
].map(v=>
`<button type="button"
onclick="setDuration(${v})">${formatDuration(v)}</button>`
).join("")}
</div>

<input id="duration" type="number" value="30">

<label>Notas</label>
<textarea id="notes"></textarea>

<div class="modal-footer-actions">

<button onclick="saveActivityRecord('${activity}')">
Salvar
</button>

<button onclick="deleteByName('${activity}')">
Excluir
</button>

<button onclick="archiveByName('${activity}')">
Arquivar
</button>

</div>
`;
}

showModal(activity,content);

}

function formatDuration(min){

if(min===60) return "1h";
if(min===90) return "1h30";
if(min===120) return "2h";
if(min===180) return "3h";
if(min===240) return "4h";

return min+" min";
}

function setDuration(v){
document.getElementById("duration").value=v;
}

function saveStateRecord(activity){

records.push({
id:Date.now(),
activity,
date:date.value,
value:Number(value.value),
notes:notes.value
});

save();
closeModal();
}

function saveActivityRecord(activity){

records.push({
id:Date.now(),
activity,
date:date.value,
startTime:startTime.value,
duration:Number(duration.value),
notes:notes.value
});

save();
closeModal();
}

function showModal(title,content){

document.getElementById(
"modalContainer"
).innerHTML=
`
<div class="modal">
<div class="modal-content">
<h3>${title}</h3>
<br>
${content}
<br>
<button onclick="closeModal()">Fechar</button>
</div>
</div>
`;
}

function closeModal(){
document.getElementById(
"modalContainer"
).innerHTML="";
}


function renderHistory(){

    if(selectedDate){
        renderDay(selectedDate);
    }else{
        renderCalendar();
    }

}

function renderCalendar(){

    const history=document.getElementById("historyScreen");

    const months=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

    const firstDay=new Date(currentYear,currentMonth,1);
    const totalDays=new Date(currentYear,currentMonth+1,0).getDate();
    const startWeekDay=firstDay.getDay();

    const datesWithRecords=[...new Set(records.map(r=>r.date))];

    let html=`
    <div class="card">
        <div class="calendar-top">
            <button onclick="prevMonth()">◀</button>
            <h2>${months[currentMonth]} ${currentYear}</h2>
            <button onclick="nextMonth()">▶</button>
        </div>

        <div class="calendar-grid">
            <div class="calendar-header">D</div>
            <div class="calendar-header">S</div>
            <div class="calendar-header">T</div>
            <div class="calendar-header">Q</div>
            <div class="calendar-header">Q</div>
            <div class="calendar-header">S</div>
            <div class="calendar-header">S</div>
    `;

    for(let i=0;i<startWeekDay;i++) html+=`<div></div>`;

    for(let day=1;day<=totalDays;day++){

        const date=`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

        html+=`
        <div class="calendar-day ${datesWithRecords.includes(date)?'has-record':''}"
             onclick="openDay('${date}')">
             ${day}
        </div>`;
    }

    html+=`</div></div>`;

    history.innerHTML=html;
}

function openDay(date){
    selectedDate=date;
    renderHistory();
}

function backToCalendar(){
    selectedDate=null;
    renderHistory();
}

function prevMonth(){
    currentMonth--;
    if(currentMonth<0){
        currentMonth=11;
        currentYear--;
    }
    renderCalendar();
}

function nextMonth(){
    currentMonth++;
    if(currentMonth>11){
        currentMonth=0;
        currentYear++;
    }
    renderCalendar();
}
function getEndTime(startTime, duration){

    if(!startTime) return '--:--';

    const [h,m] = startTime.split(':').map(Number);

    const totalMinutes = h * 60 + m + duration;

    const endH = Math.floor(totalMinutes / 60) % 24;
    const endM = totalMinutes % 60;

    return `${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}`;
}
function renderDay(date){

    const history=document.getElementById("historyScreen");

    const dayRecords=records.filter(r=>r.date===date);

    const states=dayRecords.filter(r=>
        STATE_ACTIVITIES.includes(r.activity.toLowerCase())
    );

    const activities=dayRecords.filter(r=>
        !STATE_ACTIVITIES.includes(r.activity.toLowerCase())
    );

    history.innerHTML=`
    <div class="card">

        <button class="back-btn" onclick="backToCalendar()">
            ← Calendário
        </button>

        <h2>${date}</h2>

        ${states.length
    ? states.map(r=>`
        <div class="record">
            <strong>${r.activity}</strong>: ${r.value}

            ${r.notes ? `
                <div style="margin-top:8px;color:#c9d2dc;">
                    ${r.notes}
                </div>
            ` : ''}

        </div>
    `).join('')
    : '<div class="small">Sem registros</div>'
}

        <div class="section-label">Atividades</div>

        ${activities.length
            ? activities.sort((a,b)=>(a.startTime||"").localeCompare(b.startTime||""))
                .map(r=>`
<div class="record">

    <strong>
${r.startTime||'--:--'}–${getEndTime(r.startTime,r.duration)}
</strong>
    • ${r.activity}
    (${formatDuration(r.duration)})

    ${r.notes ? `
        <div style="
            margin-top:10px;
            padding:10px;
            background:#101419;
            border-radius:10px;
            color:#c9d2dc;
        ">
            ${r.notes}
        </div>
    ` : ''}

    <br><br>

    <button onclick="editRecord(${r.id})">
        Editar
    </button>

    <button onclick="deleteRecord(${r.id})">
        Excluir
    </button>

</div>`).join('')
            : '<div class="small">Sem atividades</div>'}

    </div>`;
}

function deleteRecord(id){

if(!confirm("Excluir este registro?")) return;

records = records.filter(
r => r.id !== id
);

save();
renderHistory();
}

function editRecord(id){

const record=
records.find(
r=>r.id===id
);

if(!record) return;

const notes=
prompt(
"Editar notas",
record.notes || ""
);

if(notes===null) return;

record.notes=notes;

save();
renderHistory();
}
function exportCSV(){

let csv =
"Data;Atividade;HoraInicial;Duracao;Valor;Notas\n";

records.forEach(r=>{

csv += [
r.date || "",
r.activity || "",
r.startTime || "",
r.duration || "",
r.value || "",
`"${(r.notes || "").replace(/"/g,'""')}"`
].join(";");

csv += "\n";

});

const blob = new Blob(
['\ufeff' + csv],
{type:"text/csv;charset=utf-8;"}
);

const link = document.createElement("a");

link.href = URL.createObjectURL(blob);

link.download = "rastro.csv";

link.click();

}

function exportJSON(){

const data = {

exportadoEm:new Date(),

atividades:activities,

registros:records

};

const blob = new Blob(
[
JSON.stringify(data,null,2)
],
{
type:"application/json"
}
);

const link=document.createElement("a");

link.href=URL.createObjectURL(blob);

link.download="rastro.json";

link.click();

}
renderActivities();

</script>

</body>
</html>
