<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastro</title>

<style>

:root{
    --bg:#080b10;
    --card:#121925;
    --card-hover:#182132;
    --blue:#2b6fff;
    --text:#ffffff;
    --muted:#8ea2bf;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

header{
    padding:20px;
    text-align:center;
    font-size:32px;
    font-weight:700;
    border-bottom:1px solid #1a2230;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.section-title{
    font-size:20px;
    margin-bottom:12px;
}

.states{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:24px;
}

.state-card{
    background:var(--card);
    border-radius:18px;
    padding:18px;
}

.state-value{
    font-size:42px;
    font-weight:700;
    color:var(--blue);
}

.fronts{
    display:grid;
    gap:12px;
    margin-bottom:30px;
}

.front-card{
    background:var(--card);
    border-radius:16px;
    padding:18px;
    cursor:pointer;
}

.front-card:hover{
    background:var(--card-hover);
}

.timeline{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.timeline-item{
    background:var(--card);
    border-radius:14px;
    padding:14px;
}

.time{
    color:var(--blue);
    font-weight:700;
}

.capture-btn{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    width:74px;
    height:74px;
    border:none;
    border-radius:50%;
    background:var(--blue);
    color:white;
    font-size:34px;
    cursor:pointer;
    box-shadow:0 0 30px rgba(43,111,255,.4);
}

</style>
</head>
<body>

<header>Rastro</header>

<div class="container">

    <h2 class="section-title">Estados</h2>

    <div class="states">

        <div class="state-card">
            <div>Mental</div>
            <div class="state-value">7</div>
        </div>

        <div class="state-card">
            <div>Físico</div>
            <div class="state-value">6</div>
        </div>

    </div>

    <h2 class="section-title">Frentes Ativas</h2>

    <div class="fronts">

        <div class="front-card">
            Marcha 38
        </div>

        <div class="front-card">
            Contrabaixo
        </div>

        <div class="front-card">
            Estudo dos Evangelhos
        </div>

        <div class="front-card">
            Finanças
        </div>

    </div>

    <h2 class="section-title">Hoje</h2>

    <div class="timeline">

        <div class="timeline-item">
            <div class="time">08:00</div>
            Caminhada 4 km
        </div>

        <div class="timeline-item">
            <div class="time">12:00</div>
            Mandados urbanos
        </div>

        <div class="timeline-item">
            <div class="time">20:00</div>
            Estudo musical
        </div>

    </div>

</div>

<button class="capture-btn">+</button>

</body>
</html>
