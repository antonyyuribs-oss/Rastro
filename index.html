<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rastro">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#151c13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rastro">
<title>Rastro</title>


<style>
:root{
    --bg:#151c13;
    --surface:#1b2418;
    --surface-2:#222d1e;
    --surface-3:#121910;
    --border:#33402d;
    --border-soft:rgba(var(--sand-rgb),.075);
    --text:#f1f0e9;
    --text-2:#d1d2c5;
    --muted:#979d8c;
    --accent:#82905a;
    --accent-rgb:130,144,90;
    --accent-soft:rgba(var(--accent-rgb),.19);
    --accent-icon:#a8bf7c;
    --accent-text:#dbe7c8;
    --accent-hover:#a2bd78;
    --green:#48c78e;
    --blue:#5da9e9;
    --sand:#d6c39d;
    --sand-rgb:214,195,157;
    --sand-muted:#aa9874;
    --header-rgb:20,28,18;
    --bg-glow-1:rgba(79,94,58,.28);
    --bg-glow-2:rgba(43,59,39,.32);
    --bg-glow-3:rgba(64,78,47,.22);
    --bg-glow-4:rgba(35,48,32,.30);
    --bg-a:#182016;
    --bg-b:#131a12;
    --bg-c:#192217;
    --amber:#f3b54a;
    --red:#f26b6b;
    --radius-sm:12px;
    --radius-md:16px;
    --radius-lg:22px;
    --shadow:0 18px 45px rgba(0,0,0,.28);
    --content:760px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
    background:
        radial-gradient(ellipse at 12% 8%,var(--bg-glow-1) 0 10%,transparent 31%),
        radial-gradient(ellipse at 88% 18%,var(--bg-glow-2) 0 12%,transparent 34%),
        radial-gradient(ellipse at 24% 62%,var(--bg-glow-3) 0 13%,transparent 35%),
        radial-gradient(ellipse at 82% 78%,var(--bg-glow-4) 0 11%,transparent 33%),
        linear-gradient(145deg,var(--bg-a) 0%,var(--bg-b) 46%,var(--bg-c) 100%);
    color:var(--text);
    line-height:1.45;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

.app-header{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(var(--header-rgb),.86);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border-bottom:1px solid var(--border-soft);
}
.header-inner{
    width:min(100%,var(--content));
    margin:auto;
    padding:calc(12px + env(safe-area-inset-top)) 18px 14px;
}
.brand-row{display:flex;align-items:center;gap:13px}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;flex:none;color:var(--sand);background:rgba(var(--sand-rgb),.065);border:1px solid rgba(var(--sand-rgb),.16);border-radius:11px}
.brand-mark svg{width:20px;height:20px;stroke-width:1.8}
#screenTitle{color:var(--sand)}
.header-copy{min-width:0}
#screenTitle{font-size:24px;line-height:1.1;font-weight:760;letter-spacing:-.025em}
#screenSubtitle{margin-top:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.container{width:min(100%,var(--content));margin:auto;padding:20px 18px 28px}

.section-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:2px 0 11px}
.section-heading h2{font-size:16px;line-height:1.2;font-weight:720;letter-spacing:-.01em}
.section-heading .eyebrow{color:var(--muted);font-size:11px}
.section-label{margin:22px 0 10px;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.14em}

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px;
}

/* HOME — estados */
.state-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:23px}
.state-card{
    min-width:0;
    border:1px solid var(--border-soft);
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border-radius:14px;
    padding:12px 7px 11px;
    text-align:center;
    cursor:pointer;
    transition:border-color .16s ease,transform .16s ease,background .16s ease;
}
.state-card:active{transform:scale(.98)}
.state-icon{
    width:30px;height:30px;margin:0 auto 8px;border-radius:9px;
    display:grid;place-items:center;background:rgba(255,255,255,.035)
}
.state-icon svg{width:17px;height:17px}
.state-card.mental .state-icon,.state-card.mental .state-value{color:var(--green)}
.state-card.body .state-icon,.state-card.body .state-value{color:var(--blue)}
.state-card.disp-mental .state-icon,.state-card.disp-mental .state-value{color:var(--amber)}
.state-card.disp-body .state-icon,.state-card.disp-body .state-value{color:var(--red)}
.state-name{font-size:10px;line-height:1.16;color:var(--text-2);min-height:24px;display:flex;align-items:center;justify-content:center}
.state-value{font-size:22px;line-height:1.1;font-weight:760;margin-top:5px;letter-spacing:-.03em}
.state-value.empty{color:var(--muted)!important;font-weight:500}

/* Avaliações repetidas de disposição: hora da última nota e quantidade de registros. */
.state-extra{margin-top:5px;font-size:9px;line-height:1.2;color:var(--muted);font-variant-numeric:tabular-nums;white-space:normal}
.day-state-card .state-extra{font-size:8px;min-height:10px}
.state-time-help{margin:-6px 0 15px;color:var(--muted);font-size:11px;line-height:1.45}
.timeline-state-score{display:inline-block;margin-left:4px;font-size:12px;font-weight:750;color:var(--accent-text)}
.timeline-activity-icon.disp-mental{color:var(--amber);background:rgba(243,181,74,.12)}
.timeline-activity-icon.disp-body{color:var(--red);background:rgba(242,107,107,.12)}

/* HOME — atividades */
.activities-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.activity-card{
    min-height:86px;
    padding:11px 7px 9px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:border-color .16s ease,background .16s ease,transform .16s ease;
}
.activity-card:active{transform:scale(.98);background:rgba(var(--accent-rgb),.16)}
.activity-card{-webkit-touch-callout:none}
.activity-card.reorder-source{
    transform:scale(.95);
    border-color:var(--accent);
    background:linear-gradient(180deg,rgba(var(--accent-rgb),.24),var(--surface));
    box-shadow:0 12px 28px rgba(0,0,0,.28),0 0 0 2px rgba(var(--accent-rgb),.15);
    position:relative;z-index:4
}
.activity-card.reorder-target{border-color:rgba(var(--sand-rgb),.52)}
body.reordering{user-select:none;-webkit-user-select:none}
body.reordering .activity-card:not(.reorder-source){transition:transform .12s ease,border-color .12s ease}
.activity-icon{
    width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    color:var(--accent-icon);background:rgba(var(--accent-rgb),.14)
}
.activity-icon svg{width:18px;height:18px;stroke-width:1.9}
.activity-title-btn{width:100%;font-size:11px;line-height:1.15;font-weight:590;color:var(--text-2);overflow-wrap:anywhere}
.archived-wrap{margin-top:26px;padding-top:20px;border-top:1px solid var(--border-soft)}
.archived-grid{display:grid;gap:8px}
.archived-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.activity-name{font-weight:600;font-size:13px}

/* botões e formulários */
button{
    background:var(--surface-2);color:var(--text);border:1px solid var(--border);
    padding:10px 14px;border-radius:12px;cursor:pointer;transition:.16s ease;
}
button:hover{border-color:var(--accent-hover)}
button:active{transform:scale(.985)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.restore-btn{border-color:rgba(var(--accent-rgb),.55);color:var(--accent-text)}
input,select,textarea{
    width:100%;margin-top:8px;margin-bottom:14px;background:var(--surface-3);color:var(--text);
    border:1px solid var(--border);border-radius:12px;padding:12px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:100px}
.quick-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.quick-buttons button{padding:10px}
.modal-footer-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.modal-footer-actions button{width:100%}

/* HISTÓRICO — calendário e Rastro do dia */
.history-shell{display:grid;gap:18px}
.calendar-card{padding:16px 14px 18px}
.calendar-top{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:10px;margin-bottom:17px}
.calendar-top h2{text-align:center;font-size:20px;line-height:1.2;letter-spacing:-.025em}
.icon-button{width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--surface-3)}
.icon-button svg{width:18px;height:18px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calendar-header{text-align:center;color:var(--muted);padding:4px 0 7px;font-size:10px;font-weight:650;text-transform:uppercase}
.calendar-day{
    position:relative;aspect-ratio:1/1;min-height:0;border:1px solid transparent;border-radius:12px;
    display:grid;place-items:center;cursor:pointer;background:transparent;color:var(--text-2);
    font-size:13px;transition:.16s ease
}
.calendar-day:hover{background:var(--surface-2)}
.calendar-day.today{border-color:rgba(255,255,255,.17);font-weight:760;color:var(--text)}
.calendar-day.has-record{background:var(--surface-2);color:var(--text);font-weight:650}
.calendar-day.has-record::after{
    content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;
    border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px rgba(var(--accent-rgb),.17)
}
.calendar-day.many-records::after{width:16px;border-radius:99px}
/* Recompensas: destaque próprio, inclusive em datas futuras.
   O marcador comum permanece para os demais registros do mesmo dia. */
.calendar-day.has-reward{background:rgba(243,181,74,.11);border-color:rgba(243,181,74,.44);color:#fbe0a0;font-weight:750}
.calendar-day.has-reward::before{content:'✦';position:absolute;top:2px;right:4px;color:#f3b54a;font-size:10px;line-height:1}
.calendar-day.reward-only::after{background:#f3b54a!important;box-shadow:0 0 0 2px rgba(243,181,74,.19)!important}
.legend-dot.reward{background:#f3b54a}
.activity-shortcode{font-size:19px;font-weight:790;line-height:1;letter-spacing:.025em;color:var(--accent-text)}
.calendar-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:15px;color:var(--muted);font-size:10px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.legend-today{width:12px;height:12px;border:1px solid rgba(255,255,255,.22);border-radius:4px}
.history-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.history-stat{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:12px 10px}
.history-stat b{display:block;font-size:18px;line-height:1.1;margin-bottom:5px;letter-spacing:-.02em}
.history-stat span{display:block;color:var(--muted);font-size:10px;line-height:1.2}

.day-view{display:grid;gap:18px}
.day-toolbar{display:grid;grid-template-columns:42px 1fr 42px;gap:10px;align-items:center}
.day-toolbar-main{display:flex;justify-content:center;align-items:center;gap:7px;min-width:0}
.day-back{display:inline-flex;align-items:center;gap:7px;background:transparent;border-color:transparent;color:var(--text-2);padding:8px 4px}
.day-back svg{width:17px;height:17px}
.day-date{text-align:center}
.day-date h2{font-size:20px;letter-spacing:-.025em}
.day-date p{font-size:11px;color:var(--muted);margin-top:3px}
.day-nav-button{width:42px;height:42px;padding:0;display:grid;place-items:center;background:var(--surface-3)}
.day-nav-button svg{width:18px;height:18px}
.day-state-section .section-heading{margin-bottom:10px}
.day-state-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.day-state-card{
    min-width:0;background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--border-soft);
    border-radius:14px;padding:10px 5px;text-align:center;cursor:pointer
}
.day-state-card .state-icon{margin-bottom:6px;width:27px;height:27px}
.day-state-card .state-icon svg{width:15px;height:15px}
.day-state-card .state-name{font-size:9px;min-height:20px}
.day-state-card .state-value{font-size:19px;margin-top:4px}
.day-state-card.mental .state-icon,.day-state-card.mental .state-value{color:var(--green)}
.day-state-card.body .state-icon,.day-state-card.body .state-value{color:var(--blue)}
.day-state-card.disp-mental .state-icon,.day-state-card.disp-mental .state-value{color:var(--amber)}
.day-state-card.disp-body .state-icon,.day-state-card.disp-body .state-value{color:var(--red)}
.day-state-card.empty-state{opacity:.72}

.timeline-wrap{position:relative;display:grid;gap:0;margin-top:2px}
.timeline-empty{padding:28px 14px;text-align:center;border:1px dashed var(--border);border-radius:16px;color:var(--muted);font-size:12px}
.timeline-item{display:grid;grid-template-columns:54px 18px minmax(0,1fr);gap:8px;position:relative;min-height:96px}
.timeline-time{padding-top:14px;color:var(--text-2);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.timeline-rail{position:relative;display:flex;justify-content:center}
.timeline-rail::before{content:'';position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(var(--accent),rgba(var(--accent-rgb),.18))}
.timeline-item:first-child .timeline-rail::before{top:20px}
.timeline-item:last-child .timeline-rail::before{bottom:calc(100% - 21px)}
.timeline-dot{position:relative;z-index:1;width:10px;height:10px;margin-top:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.16)}
.timeline-card{
    margin:5px 0 12px;background:var(--surface);border:1px solid var(--border-soft);border-radius:15px;
    padding:12px 13px;cursor:pointer;transition:.16s ease
}
.timeline-card:active{transform:scale(.992);background:var(--surface-2)}
.timeline-title-row{display:flex;align-items:center;gap:9px;min-width:0}
.timeline-activity-icon{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;color:var(--accent-icon);background:rgba(var(--accent-rgb),.14)}
.timeline-activity-icon svg{width:16px;height:16px}
.timeline-title{font-size:13px;font-weight:690;color:var(--text);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline-meta{font-size:10px;color:var(--muted);margin-top:2px}
.timeline-notes{margin-top:10px;padding-top:9px;border-top:1px solid var(--border-soft);color:var(--text-2);font-size:11px;line-height:1.45}
.timeline-edit-hint{margin-top:8px;color:var(--muted);font-size:9px}
.small{font-size:12px;color:var(--muted)}

/* ETAPA 5 — bottom sheets e formulários móveis */
.modal{
    position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.68);
    display:flex;align-items:flex-end;justify-content:center;padding:0;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    animation:fadeIn .16s ease both
}
.modal-content{
    width:min(100%,560px);max-height:min(92dvh,820px);overflow:auto;
    background:linear-gradient(180deg,#202a1c,#141b12 38%);
    border:1px solid var(--border);border-bottom:0;border-radius:26px 26px 0 0;
    padding:9px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -18px 60px rgba(0,0,0,.46);
    animation:sheetUp .22s cubic-bezier(.2,.75,.25,1) both;
    overscroll-behavior:contain
}
.sheet-handle{width:36px;height:4px;border-radius:999px;background:#536048;margin:2px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.sheet-title-wrap{min-width:0}
.sheet-eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.modal-content h3{font-size:21px;line-height:1.15;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-close{width:36px;height:36px;flex:none;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.sheet-close svg{width:17px;height:17px}
.sheet-form{display:grid;gap:0}
.form-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:650;color:var(--text-2);margin:0 0 6px}
.form-label span{font-size:10px;font-weight:500;color:var(--muted)}
.modal-content input:not([type="range"]),.modal-content select,.modal-content textarea{
    margin:0 0 16px;background:#10170f;border-color:#33402d;border-radius:13px;padding:13px 14px
}
.modal-content input[type="date"],.modal-content input[type="time"]{min-height:47px}
.modal-content textarea{min-height:94px;max-height:180px}
/* Botão de modelo das notas, visível apenas nas atividades configuradas. */
.notes-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.notes-heading .form-label{margin:0}
.notes-model-btn{min-height:36px;padding:6px 13px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--accent-text);border:1px solid var(--border);border-radius:10px;flex-shrink:0}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-buttons,.duration-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.duration-chip{
    min-height:43px;padding:8px 6px;border-radius:12px;background:var(--surface-2);color:var(--text-2);
    border-color:var(--border);font-size:12px;font-weight:650
}
.duration-chip.active{background:var(--accent-soft);border-color:rgba(var(--accent-rgb),.82);color:var(--accent-text);box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.17)}
.duration-custom{display:grid;grid-template-columns:1fr 86px auto;align-items:center;gap:8px;margin-bottom:16px;color:var(--muted);font-size:11px}
.duration-custom input{margin:0!important;text-align:center;padding:10px!important;min-height:40px!important}
.primary-action{
    width:100%;min-height:50px;margin-top:2px;border-color:#8b9861;background:linear-gradient(180deg,#84925c,#667344);
    color:#f6f3e8;font-weight:730;box-shadow:0 8px 22px rgba(33,45,25,.34);display:flex;align-items:center;justify-content:center;gap:8px
}
.primary-action svg{width:18px;height:18px}
.secondary-action{width:100%;min-height:46px}
.danger-action{color:#ff9b9b;border-color:rgba(242,107,107,.3);background:rgba(242,107,107,.065)}
.management-zone{margin-top:22px;padding-top:16px;border-top:1px solid var(--border-soft)}
.management-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.management-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.management-actions button{min-height:42px;font-size:11px}
.state-control{padding:4px 0 18px}
.state-readout{font-size:48px;line-height:1;font-weight:780;letter-spacing:-.055em;text-align:center;color:var(--text);font-variant-numeric:tabular-nums;margin:2px 0 18px}
.state-readout.positive{color:#7dd9ac}.state-readout.negative{color:#ff8585}.state-readout.neutral{color:var(--text-2)}
.state-range{appearance:none;-webkit-appearance:none;width:100%;height:8px;border-radius:99px;outline:none;margin:0!important;background:linear-gradient(90deg,#df6868 0%,#69727d 50%,#58c895 100%)}
.state-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#f5f7fa;border:5px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.state-range::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:#f5f7fa;border:5px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.state-scale{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:10px}
.state-scale span:nth-child(2){color:var(--text-2)}
.menu-stack{display:grid;gap:9px}
.menu-stack button{width:100%;text-align:left;padding:14px}
.menu-note{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.5}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(22px);opacity:.4}to{transform:translateY(0);opacity:1}}
@media(min-width:700px){.modal{padding:24px;align-items:flex-end}.modal-content{border-bottom:1px solid var(--border);border-radius:26px}}


/* CONTADORES — sequências de dias */
.counter-page{display:grid;gap:16px}
.counter-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
.counter-toolbar-copy h2{font-size:17px;line-height:1.2;font-weight:730;letter-spacing:-.015em}
.counter-toolbar-copy p{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}
.counter-add-btn{min-width:44px;height:44px;padding:0 13px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--sand);border-color:rgba(var(--sand-rgb),.18);background:rgba(var(--sand-rgb),.055)}
.counter-add-btn svg{width:17px;height:17px}
.counter-grid{display:grid;grid-template-columns:1fr;gap:12px}
.counter-card{position:relative;overflow:hidden;min-height:222px;padding:17px 17px 16px;border:1px solid var(--border-soft);border-radius:22px;cursor:pointer;background:linear-gradient(145deg,rgba(40,53,34,.98),rgba(22,30,20,.98));box-shadow:0 15px 34px rgba(0,0,0,.18);isolation:isolate}
.counter-card::before{content:'';position:absolute;z-index:-1;width:210px;height:210px;border-radius:50%;right:-92px;top:-92px;background:radial-gradient(circle,rgba(var(--accent-rgb),.19),rgba(var(--accent-rgb),0) 68%)}
.counter-card.without::before{background:radial-gradient(circle,rgba(var(--sand-rgb),.15),rgba(var(--sand-rgb),0) 68%)}
.counter-card::after{content:attr(data-days);position:absolute;z-index:-2;right:-8px;bottom:-36px;font-size:150px;line-height:1;font-weight:850;letter-spacing:-.09em;color:rgba(255,255,255,.018);font-variant-numeric:tabular-nums;pointer-events:none}
.counter-card:active{transform:scale(.992)}
.counter-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.counter-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:#b5c184;background:rgba(var(--accent-rgb),.14);border:1px solid rgba(var(--accent-rgb),.12)}
.counter-card.without .counter-icon{color:var(--sand);background:rgba(var(--sand-rgb),.08);border-color:rgba(var(--sand-rgb),.11)}
.counter-icon svg{width:20px;height:20px;stroke-width:1.9}
.counter-kind{font-size:9px;font-weight:760;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-radius:999px;background:rgba(0,0,0,.11);border:1px solid var(--border-soft)}
.counter-number{margin-top:22px;font-size:72px;line-height:.86;font-weight:820;letter-spacing:-.07em;color:var(--text);font-variant-numeric:tabular-nums}
.counter-card.without .counter-number{color:var(--sand)}
.counter-card.doing .counter-number{color:#b5c184}
.counter-unit{margin-top:6px;font-size:12px;font-weight:720;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.counter-title{margin-top:18px;font-size:16px;line-height:1.28;font-weight:700;color:var(--text);letter-spacing:-.012em}
.counter-since{margin-top:5px;font-size:10px;color:var(--muted)}
.counter-empty{padding:34px 18px;border:1px dashed var(--border);border-radius:20px;text-align:center;background:rgba(27,36,24,.54)}
.counter-empty-icon{width:48px;height:48px;margin:0 auto 12px;border-radius:15px;display:grid;place-items:center;color:var(--sand-muted);background:rgba(var(--sand-rgb),.055)}
.counter-empty-icon svg{width:23px;height:23px}
.counter-empty h3{font-size:15px;margin-bottom:6px}
.counter-empty p{max-width:300px;margin:0 auto;color:var(--muted);font-size:11px;line-height:1.5}
.counter-empty button{margin-top:15px}
.counter-form-note{margin:-4px 0 15px;color:var(--muted);font-size:11px;line-height:1.5}
.counter-form-note~.management-zone .management-actions{grid-template-columns:1fr 1fr}
.counter-preview{margin:1px 0 17px;padding:14px;border-radius:16px;border:1px solid var(--border-soft);background:linear-gradient(145deg,var(--surface-2),var(--surface));text-align:center}
.counter-preview strong{display:block;font-size:34px;line-height:1;color:var(--sand);letter-spacing:-.05em}
.counter-preview span{display:block;margin-top:4px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.counter-history{margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft)}
.counter-history-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.counter-history-head strong{font-size:12px;letter-spacing:.02em}
.counter-history-head span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.11em}
.counter-history-list{display:grid;gap:8px}
.counter-history-item{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--border-soft);border-radius:14px;background:var(--surface-3)}
.counter-history-days{font-size:24px;line-height:1;font-weight:800;letter-spacing:-.05em;color:var(--sand);font-variant-numeric:tabular-nums}
.counter-history-days small{display:block;margin-top:4px;font-size:8px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.counter-history-period{font-size:11px;color:var(--text-2);line-height:1.4}
.counter-history-reset{margin-top:2px;font-size:9px;color:var(--muted)}
.counter-history-empty{padding:12px;border:1px dashed var(--border);border-radius:13px;color:var(--muted);font-size:10px;line-height:1.45}

@media(min-width:620px){.counter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* PLANEJAMENTO SEMANAL */
.planning-page{display:grid;gap:16px}
.plan-week-nav{
    display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:10px;
    padding:10px;border:1px solid var(--border-soft);border-radius:17px;background:rgba(var(--header-rgb),.62)
}
.plan-week-nav-button{width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--surface-3)}
.plan-week-nav-button svg{width:18px;height:18px}
.plan-week-nav-copy{text-align:center;min-width:0}
.plan-week-nav-copy strong{display:block;color:var(--heading);font-size:15px;line-height:1.2;letter-spacing:-.015em}
.plan-week-nav-copy span{display:block;margin-top:4px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-view-switch{
    display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--border-soft);
    border-radius:14px;background:var(--surface-3)
}
.plan-view-tab{
    min-height:40px;padding:8px 12px;border:0;border-radius:10px;background:transparent;color:var(--muted);
    font-size:11px;font-weight:700
}
.plan-view-tab.active{
    color:var(--heading);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-soft)
}
.plan-view-section{display:grid;gap:14px}
.plan-view-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.plan-view-toolbar-copy{min-width:0}
.plan-view-toolbar-copy h2{font-size:16px;line-height:1.18;letter-spacing:-.015em}
.plan-view-toolbar-copy p{margin-top:4px;color:var(--muted);font-size:9px}
.plan-view-toolbar .plan-week-actions{flex:none}
.plan-day-overview{
    display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;
    border:1px solid var(--border-soft);border-radius:14px;background:rgba(27,36,24,.58)
}
.plan-day-overview-date{min-width:0}
.plan-day-overview-date strong{display:block;font-size:12px;line-height:1.2;text-transform:capitalize}
.plan-day-overview-date span{display:block;margin-top:3px;color:var(--muted);font-size:9px}
.plan-day-overview-metrics{display:flex;align-items:center;justify-content:flex-end;gap:13px;flex-wrap:wrap}
.plan-day-metric{text-align:right;white-space:nowrap}
.plan-day-metric b{display:block;font-size:11px;line-height:1.1;color:var(--text-2);font-variant-numeric:tabular-nums}
.plan-day-metric span{display:block;margin-top:3px;color:var(--muted);font-size:8px}
.plan-day-metric.progress b{color:var(--sand)}
.plan-month-card{padding:15px 14px 14px}
.plan-month-top{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:10px;margin-bottom:13px}
.plan-month-title{text-align:center;font-size:18px;font-weight:740;letter-spacing:-.02em}
.week-strip{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 5px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.week-strip::-webkit-scrollbar{display:none}
.week-chip{flex:0 0 auto;min-width:62px;min-height:49px;padding:7px 9px;border-radius:13px;background:var(--surface-3);border:1px solid var(--border-soft);color:var(--muted);display:grid;place-items:center;gap:1px}
.week-chip b{font-size:11px;color:var(--text-2);font-weight:700}
.week-chip span{font-size:9px}
.week-chip.active{border-color:rgba(var(--sand-rgb),.48);background:rgba(var(--sand-rgb),.085);box-shadow:inset 0 0 0 1px rgba(var(--sand-rgb),.055)}
.week-chip.active b{color:var(--sand)}
.plan-week-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.plan-week-copy h2{font-size:18px;line-height:1.15;letter-spacing:-.02em}
.plan-week-copy p{margin-top:4px;color:var(--muted);font-size:10px}
.plan-week-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.plan-add-btn{height:44px;padding:0 13px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--sand);border-color:rgba(var(--sand-rgb),.22);background:rgba(var(--sand-rgb),.06)}
.plan-add-btn svg{width:17px;height:17px}
.plan-copy-btn{height:44px;padding:0 11px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text-2);border-color:var(--border);background:var(--surface-3);font-size:10px}
.plan-copy-btn svg{width:16px;height:16px}
@media(max-width:430px){
  .plan-week-header{align-items:flex-start}
  .plan-week-actions{max-width:168px}
  .plan-copy-btn,.plan-add-btn{min-height:40px;height:40px;padding-left:9px;padding-right:9px}
}

.week-summary{display:grid;gap:8px}
.week-summary-head{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:0 8px;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em;text-align:center}
.week-summary-row{display:grid;gap:9px;padding:11px 10px;border:1px solid var(--border-soft);border-radius:14px;background:rgba(27,36,24,.72)}
.week-summary-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-items:center}
.week-summary-activity{display:flex;align-items:center;gap:8px;min-width:0}
.week-summary-icon{width:29px;height:29px;flex:none;border-radius:9px;display:grid;place-items:center;color:var(--accent-icon);background:rgba(var(--accent-rgb),.12)}
.week-summary-icon svg{width:15px;height:15px}
.week-summary-name{min-width:0;font-size:11px;font-weight:650;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-summary-value{text-align:center;min-width:0}
.week-summary-value b{display:block;font-size:13px;line-height:1.1;font-variant-numeric:tabular-nums}
.week-summary-value span{display:block;margin-top:3px;font-size:8px;color:var(--muted)}
.week-summary-value.planned b{color:var(--sand)}
.week-summary-value.actual b{color:#b5c184}
.week-summary-value.progress b{color:var(--heading);font-size:14px}
.week-summary-value.progress span{line-height:1.2}
.week-summary-value.progress.over b{color:var(--accent)}
.week-summary-value.progress.under b{color:var(--sand)}
.week-summary-value.progress.none b{color:var(--muted)}
.week-summary-empty{padding:20px 14px;border:1px dashed var(--border);border-radius:15px;color:var(--muted);font-size:11px;text-align:center}

.day-tabs{display:flex;gap:6px;overflow-x:auto;padding:1px 1px 5px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex:1 0 44px;min-width:44px;padding:8px 5px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border-soft);color:var(--muted);text-align:center}
.day-tab strong{display:block;font-size:9px;letter-spacing:.06em}
.day-tab span{display:block;margin-top:3px;font-size:13px;font-weight:730;color:var(--text-2)}
.day-tab.active{background:rgba(var(--accent-rgb),.13);border-color:rgba(var(--accent-rgb),.5)}
.day-tab.active strong,.day-tab.active span{color:#c5cea1}
.day-tab.today{box-shadow:inset 0 0 0 1px rgba(var(--sand-rgb),.15)}

.daily-compare-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.compare-column{min-width:0;border:1px solid var(--border-soft);border-radius:17px;padding:10px 8px 9px;background:rgba(var(--header-rgb),.7)}
.compare-column.planned{border-color:rgba(var(--sand-rgb),.15);background:linear-gradient(180deg,rgba(var(--sand-rgb),.045),rgba(var(--header-rgb),.7))}
.compare-column.actual{border-color:rgba(var(--accent-rgb),.18);background:linear-gradient(180deg,rgba(var(--accent-rgb),.05),rgba(var(--header-rgb),.7))}
.compare-heading{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 2px 8px;border-bottom:1px solid var(--border-soft);margin-bottom:7px}
.compare-heading strong{font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.compare-column.planned .compare-heading strong{color:var(--sand)}
.compare-column.actual .compare-heading strong{color:#b5c184}
.compare-heading span{font-size:8px;color:var(--muted)}
.compare-list{display:grid;gap:6px}
.compare-item{min-width:0;padding:8px;border-radius:11px;border:1px solid var(--border-soft);background:rgba(0,0,0,.08);cursor:pointer}
.compare-item.planned-item{border-color:rgba(var(--sand-rgb),.11)}
.compare-item.actual-item{border-color:rgba(var(--accent-rgb),.11)}
.compare-time{font-size:9px;font-weight:730;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compare-title{margin-top:3px;font-size:10px;font-weight:680;line-height:1.18;color:var(--text);overflow-wrap:anywhere}
.compare-meta{margin-top:3px;font-size:8px;line-height:1.35;color:var(--muted);overflow-wrap:anywhere}
.compare-empty{padding:15px 5px;text-align:center;color:var(--muted);font-size:9px;line-height:1.4}
.compare-add-mini{width:100%;margin-top:7px;padding:7px;font-size:9px;min-height:34px;background:transparent;border-style:dashed;color:var(--sand-muted)}

/* Dia atual/futuro — planejamento em destaque */
.plan-focus-shell{border:1px solid rgba(var(--sand-rgb),.18);border-radius:17px;padding:11px;background:linear-gradient(180deg,rgba(var(--sand-rgb),.045),rgba(var(--header-rgb),.72))}
.plan-focus-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:1px 2px 10px;border-bottom:1px solid var(--border-soft);margin-bottom:8px}
.plan-focus-heading strong{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--sand)}
.plan-focus-heading span{font-size:9px;color:var(--muted)}
.plan-focus-list{display:grid;gap:8px}
.plan-focus-item{padding:13px 14px;border:1px solid rgba(var(--sand-rgb),.13);border-radius:14px;background:rgba(0,0,0,.10);cursor:pointer}
.plan-focus-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.plan-focus-time{font-size:11px;font-weight:760;color:var(--sand);font-variant-numeric:tabular-nums}
.plan-focus-duration{font-size:9px;color:var(--muted);white-space:nowrap}
.plan-focus-main{display:flex;align-items:center;gap:10px;margin-top:8px}
.plan-focus-icon{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);border:1px solid var(--border);color:var(--activity-color,var(--accent-icon))}
.plan-focus-icon svg{width:18px;height:18px;stroke:currentColor}
.plan-focus-title{font-size:14px;font-weight:720;line-height:1.2;color:var(--text)}
.plan-focus-note{margin-top:10px;padding:9px 10px;border-radius:10px;background:rgba(var(--sand-rgb),.055);border:1px solid rgba(var(--sand-rgb),.10);color:var(--text-2);font-size:11px;line-height:1.4}
.plan-focus-note span{display:block;margin-bottom:3px;color:var(--sand-muted);font-size:8px;font-weight:760;letter-spacing:.09em;text-transform:uppercase}
.plan-focus-empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:11px}
.plan-focus-add{width:100%;margin-top:9px;min-height:40px;border-style:dashed;color:var(--sand-muted);background:transparent}

.plan-form-help{margin:-5px 0 14px;color:var(--muted);font-size:10px;line-height:1.45}
.plan-activity-custom{margin-top:9px}
.plan-activity-custom.hidden{display:none}
.plan-repeat-label{margin:1px 0 7px;font-size:11px;font-weight:650;color:var(--text-2)}
.plan-repeat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:17px}
.plan-repeat-day{position:relative;min-width:0}
.plan-repeat-day input{position:absolute;opacity:0;pointer-events:none}
.plan-repeat-day span{display:grid;place-items:center;min-height:37px;border:1px solid var(--border);border-radius:10px;background:var(--surface-3);color:var(--muted);font-size:9px;font-weight:700}
.plan-repeat-day input:checked+span{border-color:rgba(var(--sand-rgb),.5);background:rgba(var(--sand-rgb),.09);color:var(--sand)}
.plan-manage{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;padding-top:15px;border-top:1px solid var(--border-soft)}
.plan-manage button{font-size:11px}

@media(max-width:480px){
  .plan-day-overview{align-items:flex-start;flex-direction:column}
  .plan-day-overview-metrics{width:100%;justify-content:space-between}
  .plan-day-metric{text-align:left}
  .plan-view-toolbar{align-items:flex-start}
  .plan-view-toolbar .plan-week-actions{max-width:160px}
}
@media(max-width:380px){
  .week-summary-head,.week-summary-row{grid-template-columns:minmax(0,1fr) 66px 66px}
  .week-summary-row{gap:5px;padding-left:7px;padding-right:7px}
  .daily-compare-grid{gap:6px}
  .compare-column{padding-left:6px;padding-right:6px}
}


/* navegação inferior */
.bottom-nav{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;
    width:min(100%,var(--content));
    display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:rgba(20,28,18,.95);border-top:1px solid var(--border-soft);
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
}
.nav-item{
    border:0;background:transparent;padding:5px 2px 2px;border-radius:10px;
    min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--muted);font-size:9px
}
.nav-item svg{width:19px;height:19px;stroke-width:1.9}
.nav-item.active{color:var(--accent)}
.nav-item:hover{border-color:transparent}

@media(min-width:620px){
    .activities-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
    .activity-card{min-height:94px}
    .state-grid{gap:10px}
}
@media(max-width:360px){
    .container{padding-left:12px;padding-right:12px}
    .header-inner{padding-left:12px;padding-right:12px}
    .activities-grid,.state-grid{gap:6px}
    .activity-card{min-height:82px;padding-left:5px;padding-right:5px}
    .activity-title-btn{font-size:10px}
    .state-name{font-size:9px}
}

/* ETAPA 6 — polimento final para iPhone e uso diário */
html,body{overscroll-behavior-y:none}
body{-webkit-text-size-adjust:100%;touch-action:manipulation}
button,.state-card,.activity-card,.calendar-day,.day-state-card,.timeline-card{touch-action:manipulation}
button{min-height:44px}
button:focus-visible,.state-card:focus-visible,.activity-card:focus-visible,.calendar-day:focus-visible,.day-state-card:focus-visible,.timeline-card:focus-visible,
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid rgba(151,164,102,.95);outline-offset:2px}
.state-card,.activity-card,.day-state-card,.timeline-card{-webkit-tap-highlight-color:transparent}
.timeline-notes{white-space:pre-wrap;overflow-wrap:anywhere}
.modal-content{-webkit-overflow-scrolling:touch}
.state-range{touch-action:none}
body.modal-open{overflow:hidden}
body.keyboard-open .bottom-nav{opacity:0;pointer-events:none;transform:translate(-50%,110%)}
.bottom-nav{transition:opacity .18s ease,transform .18s ease}

.add-activity-note{margin:-4px 0 14px;color:var(--muted);font-size:11px;line-height:1.45}
.icon-picker-row{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:end;margin-bottom:16px}
.icon-picker-preview{width:58px;height:48px;border:1px solid var(--border);border-radius:13px;background:var(--surface-3);display:grid;place-items:center;color:var(--accent-icon)}
.icon-picker-preview svg{width:22px;height:22px;stroke-width:1.9}
.icon-picker-field select{margin-bottom:0!important}

.reorder-list{display:grid;gap:8px}
.reorder-item{display:grid;grid-template-columns:1fr 44px 44px;gap:7px;align-items:center;background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:7px 7px 7px 12px}
.reorder-name{min-width:0;font-size:13px;font-weight:620;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reorder-btn{width:44px;height:44px;padding:0;display:grid;place-items:center;background:var(--surface-3)}
.reorder-btn:disabled{opacity:.3;cursor:default}
.reorder-btn svg{width:17px;height:17px}

.toast-wrap{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;width:min(calc(100% - 32px),520px);pointer-events:none;display:grid;justify-items:center}
.toast{max-width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--border);background:rgba(28,38,24,.97);box-shadow:0 12px 34px rgba(0,0,0,.34);color:var(--text-2);font-size:12px;font-weight:600;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:toastIn .18s ease both}
.toast.success{border-color:rgba(72,199,142,.3)}
.toast.error{border-color:rgba(242,107,107,.35);color:#ffb0b0}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:699px){
    input,select,textarea{font-size:16px}
    .container{padding-top:18px}
    .header-inner{padding-bottom:12px}
    .state-card{min-height:82px}
    .calendar-day{min-width:38px;min-height:38px;aspect-ratio:auto}
}
@media(hover:none){button:hover,.calendar-day:hover{border-color:var(--border);transform:none}.nav-item:hover{border-color:transparent}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* destaque cromático restrito ao desenho central dos ícones */
.activity-card{
    position:relative;
    overflow:hidden;
    background:var(--surface);
}
.activity-card::after{display:none}
.activity-icon,
.timeline-activity-icon,
.week-summary-icon{
    color:var(--activity-color,var(--accent-icon));
    background:var(--surface-3);
    border:1px solid var(--border);
    box-shadow:none;
}
.activity-icon{
    width:36px;
    height:36px;
    border-radius:11px;
}
.activity-icon svg,
.timeline-activity-icon svg,
.week-summary-icon svg{
    color:var(--activity-color,var(--accent-icon));
    stroke:currentColor;
}
.activity-icon svg{width:19px;height:19px;stroke-width:2}
.nav-item.active{
    color:var(--accent);
    background:rgba(var(--accent-rgb),.09);
    border-color:rgba(var(--accent-rgb),.12);
}
.brand-mark{
    color:var(--sand);
    background:rgba(var(--sand-rgb),.09);
    border-color:rgba(var(--sand-rgb),.20);
}
#screenTitle{color:var(--sand)}
button:hover{border-color:var(--accent-hover)}

/* seletor de aparência */
.appearance-intro{margin:-2px 0 14px;color:var(--muted);font-size:10px;line-height:1.45}
.appearance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.theme-choice{
    min-height:72px;
    padding:11px;
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    background:var(--surface-3);
    border:1px solid var(--border);
    position:relative;
}
.theme-choice.active{
    border-color:rgba(var(--accent-rgb),.75);
    box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.18),0 8px 24px rgba(0,0,0,.14);
}
.theme-swatch{
    width:34px;height:34px;border-radius:11px;flex:none;
    background:var(--swatch);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 5px 14px rgba(0,0,0,.24);
}
.theme-choice-copy{min-width:0}
.theme-choice-name{display:block;font-size:12px;font-weight:700;color:var(--text)}
.theme-choice-desc{display:block;margin-top:3px;font-size:9px;line-height:1.25;color:var(--muted)}
.theme-check{
    position:absolute;right:8px;top:8px;width:17px;height:17px;border-radius:50%;
    display:none;place-items:center;background:var(--accent);color:#fff
}
.theme-choice.active .theme-check{display:grid}
.theme-check svg{width:11px;height:11px;stroke-width:2.4}
.appearance-sample{
    margin-top:14px;padding:13px;border:1px solid var(--border);border-radius:14px;
    background:linear-gradient(135deg,rgba(var(--accent-rgb),.10),rgba(var(--sand-rgb),.045));
}
.appearance-sample-title{font-size:11px;font-weight:700}
.appearance-sample-icons{display:flex;gap:8px;margin-top:10px}
.appearance-sample-icons span{
    width:31px;height:31px;border-radius:9px;display:grid;place-items:center;
    border:1px solid var(--border);background:var(--surface-3)
}

.appearance-sample-icons span:nth-child(2){color:#65aef0}
.appearance-sample-icons span:nth-child(3){color:#e7b34e}

/* Cabeçalho: título é identidade, cor-base fica no símbolo */
.app-header{
    background:rgba(var(--header-rgb),.92);
    border-bottom-color:var(--border-soft);
}
.brand-mark{
    color:var(--accent);
    background:rgba(var(--accent-rgb),.09);
    border-color:rgba(var(--accent-rgb),.20);
}
#screenTitle{
    color:var(--brand);
    font-weight:790;
}
#screenSubtitle{color:var(--muted)}

/* Tipografia: títulos claros, secundários recuam */
.section-heading h2,
.calendar-top h2,
.day-date h2,
.counter-toolbar-copy h2,
.plan-month-title,
.plan-week-copy h2,
.modal-content h3,
.counter-empty h3,
.counter-history-head strong{
    color:var(--heading);
}
.section-label,
.sheet-eyebrow,
.management-title,
.calendar-header,
.week-summary-head,
.compare-heading span{
    color:var(--muted);
}

/* Superfícies permanecem neutras independentemente da cor-base */
.card,
.state-card,
.activity-card,
.history-stat,
.timeline-card,
.archived-item,
.reorder-item,
.week-summary-row,
.counter-history-item{
    background:var(--surface);
}
.state-card,
.day-state-card{
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
}
.modal-content{
    background:linear-gradient(180deg,var(--surface-2),var(--surface) 38%);
}
.modal-content input:not([type="range"]),
.modal-content select,
.modal-content textarea{
    background:var(--surface-3);
    border-color:var(--border);
}
.sheet-handle{background:var(--border)}
.bottom-nav{background:rgba(var(--header-rgb),.96)}
.toast{background:rgba(var(--header-rgb),.97)}
.week-summary-row{background:var(--surface)}
.counter-empty{background:var(--surface)}
.counter-card{
    background:linear-gradient(145deg,var(--surface-2),var(--surface));
    border-color:var(--border);
}
.counter-card::before{
    background:radial-gradient(circle,rgba(var(--accent-rgb),.12),rgba(var(--accent-rgb),0) 68%);
}
.counter-card.without::before{
    background:radial-gradient(circle,rgba(var(--sand-rgb),.105),rgba(var(--sand-rgb),0) 68%);
}

/* Cor-base: apenas ações, foco, seleção e estados ativos */
input:focus,select:focus,textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
}
button:focus-visible,
.state-card:focus-visible,
.activity-card:focus-visible,
.calendar-day:focus-visible,
.day-state-card:focus-visible,
.timeline-card:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
    outline-color:var(--accent);
}
.primary-action{
    background:var(--accent);

/* =========================================================
   RASTRO — MODO LAMA
   Camada visual opcional. Não altera dados nem cálculos.
========================================================= */
html[data-effect="mud"] .brand-mark,
html[data-effect="mud"] .activity-icon,
html[data-effect="mud"] .timeline-activity-icon,
html[data-effect="mud"] .week-summary-icon{
    position:relative;
    isolation:isolate;
    overflow:hidden;
    background:
        radial-gradient(circle at 28% 18%,rgba(255,255,255,.13),transparent 24%),
        linear-gradient(145deg,rgba(var(--accent-rgb),.12),rgba(16,15,11,.92) 58%);
    border-color:rgba(var(--accent-rgb),.28);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -8px 14px rgba(0,0,0,.20),
        0 5px 15px rgba(0,0,0,.22);
    /* Sem backdrop-filter por ícone: visual semelhante com custo bem menor. */
}
html[data-effect="mud"] .brand-mark{
    border-radius:42% 58% 48% 52% / 54% 43% 57% 46%;
    transform:translateZ(0);
    box-shadow:
        inset 2px 2px 5px rgba(255,255,255,.14),
        inset -4px -6px 12px rgba(0,0,0,.28),
        0 8px 20px rgba(0,0,0,.28),
        0 0 18px rgba(var(--accent-rgb),.09);
    animation:mudBrandBreath 12s ease-in-out infinite alternate;
}
html[data-effect="mud"] .brand-mark::before,
html[data-effect="mud"] .activity-icon::before,
html[data-effect="mud"] .timeline-activity-icon::before,
html[data-effect="mud"] .week-summary-icon::before{
    content:"";
    position:absolute;
    z-index:-1;
    width:145%;
    height:145%;
    left:-25%;
    top:28%;
    border-radius:38% 62% 56% 44% / 52% 40% 60% 48%;
    background:
        radial-gradient(circle at 34% 28%,rgba(255,255,255,.18) 0 5%,transparent 13%),
        radial-gradient(circle at 68% 55%,rgba(255,255,255,.07) 0 4%,transparent 10%),
        linear-gradient(135deg,
            rgba(var(--accent-rgb),.78),
            rgba(var(--accent-rgb),.42) 45%,
            rgba(62,48,26,.68) 76%,
            rgba(25,22,16,.88));
    filter:blur(.35px) saturate(.82);
    transform:translate(-2%,-8%) rotate(8deg) scale(1.05);
}
html[data-effect="mud"] .brand-mark::after,
html[data-effect="mud"] .activity-icon::after,
html[data-effect="mud"] .timeline-activity-icon::after,
html[data-effect="mud"] .week-summary-icon::after{
    content:"";
    position:absolute;
    z-index:-1;
    width:80%;
    height:45%;
    left:8%;
    top:-8%;
    border-radius:50%;
    background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0));
    transform:rotate(-12deg);
    opacity:.62;
    filter:blur(1.2px);
}
html[data-effect="mud"] .brand-mark svg,
html[data-effect="mud"] .activity-icon svg,
html[data-effect="mud"] .timeline-activity-icon svg,
html[data-effect="mud"] .week-summary-icon svg{
    position:relative;
    z-index:2;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.65));
}
html[data-effect="mud"] .brand-mark svg{
    color:var(--accent);
    stroke-width:2;
    filter:
        drop-shadow(0 1px 1px rgba(0,0,0,.72))
        drop-shadow(0 0 5px rgba(var(--accent-rgb),.20));
}

/* O nome RASTRO recebe um reflexo úmido discreto no modo lama. */
html[data-effect="mud"] .brand-title{
    text-shadow:0 1px 0 rgba(255,255,255,.05),0 5px 18px rgba(0,0,0,.28);
}
html[data-effect="mud"] .brand-title::after{
    content:"";
    display:inline-block;
    width:6px;height:6px;
    margin-left:7px;
    vertical-align:middle;
    border-radius:55% 45% 62% 38%;
    background:var(--accent);
    box-shadow:0 0 10px rgba(var(--accent-rgb),.30);
    opacity:.86;
}

/* Reação tátil: a massa parece ceder quando o cartão é pressionado. */
html[data-effect="mud"] .activity-card:active .activity-icon::before{
    animation:mudTouch .62s cubic-bezier(.2,.8,.2,1) 1;
}
html[data-effect="mud"] .activity-card:active .activity-icon{
    transform:scale(.965);
    transition:transform .14s ease;
}
@keyframes mudTouch{
    0%{transform:translate(-2%,-8%) rotate(8deg) scale(1.05)}
    38%{transform:translate(8%,8%) rotate(18deg) scale(1.12)}
    72%{transform:translate(-7%,-2%) rotate(2deg) scale(1.08)}
    100%{transform:translate(-2%,-8%) rotate(8deg) scale(1.05)}
}

@keyframes mudFlow{
    0%{transform:translate(-8%,5%) rotate(-7deg) scale(1.02)}
    38%{transform:translate(5%,-8%) rotate(7deg) scale(1.08)}
    72%{transform:translate(-2%,-16%) rotate(14deg) scale(1.03)}
    100%{transform:translate(9%,-5%) rotate(22deg) scale(1.10)}
}
@keyframes mudShell{
    0%{border-radius:42% 58% 48% 52% / 54% 43% 57% 46%;transform:rotate(-1deg)}
    55%{border-radius:54% 46% 57% 43% / 45% 56% 44% 55%;transform:rotate(1deg)}
    100%{border-radius:47% 53% 43% 57% / 58% 46% 54% 42%;transform:rotate(-.5deg)}
}
@keyframes mudDrop{
    from{transform:translateY(-2px) scale(.82);opacity:.62}
    to{transform:translateY(2px) scale(1.08);opacity:1}
}
@media(prefers-reduced-motion:reduce){
    html[data-effect="mud"] .brand-mark,
    html[data-effect="mud"] .brand-mark::before,
    html[data-effect="mud"] .activity-icon::before,
    html[data-effect="mud"] .timeline-activity-icon::before,
    html[data-effect="mud"] .week-summary-icon::before,

    }
}

function isMoodRecord(r){return !!r && (r.recordType==='mood' || (r.activity==='Estado de hoje' && !!r.mood));}
function moodRecordsForDate(date){return records.filter(r=>isMoodRecord(r)&&r.date===date).sort((a,b)=>String(a.startTime||'').localeCompare(String(b.startTime||''))||String(a.createdAt||'').localeCompare(String(b.createdAt||'')));}
function lastMoodOfDay(date=localDateISO()){const list=moodRecordsForDate(date);return list.length?list[list.length-1]:null;}
function isBriefingActivity(name){return String(name||'').trim().toLocaleLowerCase('pt-BR')==='briefing' || (typeof activities!=='undefined' && activities.some(a=>a.name===name&&a.kind==='briefing'));}
function isMorningRoutine(name){return String(name||'')==='Rotina de Despertamento';}

let currentTheme=THEME_META[document.documentElement.dataset.theme]
    ? document.documentElement.dataset.theme
    : 'green';

function applyTheme(theme,persist=true){
    if(!THEME_META[theme]) theme='green';

    currentTheme=theme;
    document.documentElement.dataset.theme=theme;

    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content',THEME_META[theme].themeColor);

    if(persist){
        localStorage.setItem('rastro_theme',theme);
    }

    document.querySelectorAll('[data-theme-choice]').forEach(btn=>{
        btn.classList.toggle('active',btn.dataset.themeChoice===theme);
    });
}


const EFFECT_META={
    classic:{name:'Clássico',desc:'Interface sóbria, estática e limpa.'},
    mud:{name:'Lama',desc:'Ícones viscosos, reflexos úmidos e movimento orgânico.'}
};

let currentEffect=['classic','mud'].includes(document.documentElement.dataset.effect)

function applyEffect(effect,persist=true){
    if(!EFFECT_META[effect]) effect='classic';
    currentEffect=effect;
    document.documentElement.dataset.effect=effect;

    if(persist){
        localStorage.setItem('rastro_effect',effect);
    }

    document.querySelectorAll('[data-effect-choice]').forEach(btn=>{
        btn.classList.toggle('active',btn.dataset.effectChoice===effect);
    });
}

function escapeHTML(value){
    return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

function inlineArg(value){
    return JSON.stringify(String(value ?? ''))
        .replace(/&/g,'\\u0026')
        .replace(/</g,'\\u003c')
        .replace(/>/g,'\\u003e')
        .replace(/"/g,'&quot;');
}

function localDateISO(date=new Date()){
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

let toastTimer=null;
function showToast(message,type='success'){
    const host=document.getElementById('toastContainer');
    if(!host) return;
    clearTimeout(toastTimer);
    host.innerHTML=`<div class="toast ${type==='error'?'error':'success'}">${escapeHTML(message)}</div>`;
    toastTimer=setTimeout(()=>{host.innerHTML='';},2200);
}

function formatHeaderDate(){
    const raw = new Intl.DateTimeFormat('pt-BR',{
        weekday:'long',day:'numeric',month:'long',year:'numeric'
    }).format(new Date());
    return raw.charAt(0).toUpperCase()+raw.slice(1);
}

function defaultActivityColorData(name){
    const text=String(name||'');
    let hash=0;
    for(let i=0;i<text.length;i++){
        hash=((hash<<5)-hash)+text.charCodeAt(i);
        hash|=0;
    }
    return ACTIVITY_COLOR_PALETTE[Math.abs(hash)%ACTIVITY_COLOR_PALETTE.length];
}
function allowedButtonColor(color){
    return BUTTON_COLOR_OPTIONS.find(item=>item.color && item.color===color) || null;
}
function selectedActivityButtonColor(name){
    const activity=activities.find(a=>a.name===name);
    return allowedButtonColor(activity?.buttonColor);
}
function activityColorData(name){
    return selectedActivityButtonColor(name) || defaultActivityColorData(name);
}
function activityButtonVisualStyle(name, color=''){
    const chosen=allowedButtonColor(color);
    const c=chosen || defaultActivityColorData(name);
    return `--activity-color:${c.color};--activity-soft:rgba(${c.rgb},.14);--activity-border:rgba(${c.rgb},.20);--activity-glow:rgba(${c.rgb},.08)`+
        (chosen ? `;--activity-button-rgb:${chosen.rgb}` : '');
}
function activityVisualStyle(name){
    return activityButtonVisualStyle(name, selectedActivityButtonColor(name)?.color || '');
}
function buttonColorPickerHTML(prefix, name, icon, color=''){

          `<div id="${prefix}ButtonColorPreview" class="card activity-card ${selected?'has-custom-color':''}" `+
          `style="${activityButtonVisualStyle(name,selected)}">`+

function chooseActivityButtonColor(prefix, color){
    const chosen=allowedButtonColor(color);
    const selected=chosen?.color || '';
    const field=document.getElementById(prefix+'ActivityButtonColor');
    if(!field) return;
    field.value=selected;
    const choices=document.getElementById(prefix+'ButtonColorChoices');
    choices?.querySelectorAll('.activity-color-choice').forEach(button=>{
        const active=button.dataset.buttonColor===selected;
        button.classList.toggle('is-selected',active);
        button.setAttribute('aria-pressed',String(active));
        const swatch=button.querySelector('.color-swatch');
        if(swatch) swatch.textContent=active?'✓':(button.dataset.buttonColor?'':'↺');
    });
    const preview=document.getElementById(prefix+'ButtonColorPreview');
    if(!preview) return;
    const name=document.getElementById(prefix==='rename'?'renameActivityName':'newActivityName')?.value.trim() || 'Nova atividade';
    const icon=document.getElementById(prefix==='rename'?'renameActivityIcon':'newActivityIcon')?.value || 'circle-dot';
    preview.classList.toggle('has-custom-color',!!selected);
    preview.style.cssText=activityButtonVisualStyle(name,selected);
    preview.querySelector('.activity-title-btn').textContent=activityButtonLabel({name});
    preview.querySelector('.activity-icon').innerHTML=`<i data-lucide="${icon}"></i>`;
    lucide.createIcons();
}

function todayISO(){
    return localDateISO();
}

function stateRecordsForDate(name,date){
    const matches=records.filter(r=>r.activity===name && r.date===date);
    if(isRepeatedState(name)){
        // Os registros antigos não possuem hora: preservá-los, mas dar prioridade
        // cronológica às novas medições com horário definido.
        matches.sort((a,b)=>String(a.startTime||'').localeCompare(String(b.startTime||'')));
    }
    return matches;
}
function latestStateToday(name){
    const matches=stateRecordsForDate(name,todayISO());
    return matches.length ? matches[matches.length-1] : null;
}

function formatStateValue(value){
    if(value===undefined || value===null || Number.isNaN(Number(value))) return '—';
    const n=Number(value);
    return n>0 ? `+${n}` : String(n);
}

function moveActivityObject(sourceActivity,targetActivity){
    const from=activities.indexOf(sourceActivity);
    const to=activities.indexOf(targetActivity);
    if(from<0 || to<0 || from===to) return false;
    const item=activities.splice(from,1)[0];
    activities.splice(to,0,item);
    return true;
}

function installLongPressReorder(card,activity){
    const HOLD_MS=430;
    const MOVE_TOLERANCE=11;

    card.addEventListener('contextmenu',e=>e.preventDefault());

    card.addEventListener('touchstart',e=>{
        if(e.touches.length!==1) return;
        clearTimeout(activityLongPressTimer);
        const t=e.touches[0];
        activityTouchState={
            card,
            activity,
            startX:t.clientX,
            startY:t.clientY,
            active:false,
            moved:false,
            lastTarget:null
        };

        activityLongPressTimer=setTimeout(()=>{
            if(!activityTouchState || activityTouchState.card!==card) return;
            activityTouchState.active=true;
            card.classList.add('reorder-source');
            document.body.classList.add('reordering');
            suppressActivityClickUntil=Date.now()+700;
            if(navigator.vibrate) navigator.vibrate(12);
        },HOLD_MS);
    },{passive:true});

    card.addEventListener('touchmove',e=>{
        const state=activityTouchState;
        if(!state || state.card!==card || e.touches.length!==1) return;
        const t=e.touches[0];

        if(!state.active){
            const dx=t.clientX-state.startX;
            const dy=t.clientY-state.startY;
            if(Math.hypot(dx,dy)>MOVE_TOLERANCE){
                clearTimeout(activityLongPressTimer);
                activityLongPressTimer=null;
                activityTouchState=null;
            }
            return;
        }

        e.preventDefault();
        const hit=document.elementFromPoint(t.clientX,t.clientY);
        const target=hit && hit.closest ? hit.closest('.activity-card') : null;
        document.querySelectorAll('.activity-card.reorder-target').forEach(el=>el.classList.remove('reorder-target'));
        if(!target || target===card || target.parentElement!==card.parentElement) return;
        target.classList.add('reorder-target');
        if(state.lastTarget===target) return;

        const targetName=target.dataset.activityName;
        const targetActivity=activities.find(a=>!a.archived && a.name===targetName && !STATE_ACTIVITIES.includes(a.name.toLowerCase()));
        if(!targetActivity || !moveActivityObject(activity,targetActivity)) return;

        const siblings=Array.from(card.parentElement.children);
        const sourcePos=siblings.indexOf(card);
        const targetPos=siblings.indexOf(target);
        if(sourcePos<targetPos) target.after(card);
        else target.before(card);

        state.lastTarget=target;
        state.moved=true;
        if(navigator.vibrate) navigator.vibrate(5);
    },{passive:false});

    const finishTouchReorder=e=>{
        const state=activityTouchState;
        clearTimeout(activityLongPressTimer);
        activityLongPressTimer=null;
        if(!state || state.card!==card) return;

        if(state.active){
            if(e && e.cancelable) e.preventDefault();
            suppressActivityClickUntil=Date.now()+650;
            card.classList.remove('reorder-source');
            document.querySelectorAll('.activity-card.reorder-target').forEach(el=>el.classList.remove('reorder-target'));
            document.body.classList.remove('reordering');
            if(state.moved){
                save();
                showToast('Ordem das atividades atualizada.');
            }
        }
        activityTouchState=null;
    };

    card.addEventListener('touchend',finishTouchReorder,{passive:false});
    card.addEventListener('touchcancel',finishTouchReorder,{passive:false});
}

function renderActivities(){
    const home=document.getElementById("homeScreen");
    const active=activities.filter(a=>!a.archived);
    const archived=activities.filter(a=>a.archived);
    const stateNames=new Set(STATE_ACTIVITIES.map(x=>x.toLowerCase()));
    const normalActivities=active.filter(a=>!stateNames.has(a.name.toLowerCase()));

    const stateCards=STATE_UI.map(cfg=>{
        const exists=active.some(a=>a.name.toLowerCase()===cfg.name.toLowerCase());
        if(!exists) return '';
        const r=latestStateToday(cfg.name);
        const value=r ? formatStateValue(r.value) : '—';
        const count=isRepeatedState(cfg.name) ? stateRecordsForDate(cfg.name,todayISO()).length : 0;
        const detail=isRepeatedState(cfg.name) && r
            ? `${r.startTime ? escapeHTML(r.startTime) : 'Sem hora'}${count>1 ? ` · ${count} notas` : ''}` : '';
        return `
            <div class="state-card ${cfg.cls}" onclick="openRegister('${cfg.name}')">
                <div class="state-icon"><i data-lucide="${cfg.icon}"></i></div>
                <div class="state-name">${cfg.short}</div>
                <div class="state-value ${r?'':'empty'}">${value}</div>
                ${detail ? `<div class="state-extra">${detail}</div>` : ''}
            </div>`;
    }).join('');

    home.innerHTML=`
        <section aria-labelledby="todayStateTitle">
            <div class="section-heading">
                <h2 id="todayStateTitle">Notas e disposição</h2>
                <span class="eyebrow">toque para registrar</span>
            </div>
            <div class="state-grid">${stateCards}</div>
        </section>

        <section aria-labelledby="moodTitle">
            <div class="section-heading"><h2 id="moodTitle">Estado de hoje</h2><span class="eyebrow">toque para registrar</span></div>
            <div class="mood-grid" id="moodGrid"></div>
            <div class="mood-help" id="moodHelp"></div>
        </section>

        <section aria-labelledby="activityTitle">
            <div class="section-heading">
                <h2 id="activityTitle">Registrar atividade</h2>
                <span class="eyebrow">segure para reordenar</span>
            </div>
            <div class="activities-grid" id="activitiesGrid"></div>
        </section>
    `;

    renderMoodButtons();
    normalActivities.forEach(activity=>{
        const card=document.createElement("div");
        card.className="card activity-card"+(selectedActivityButtonColor(activity.name)?" has-custom-color":"");
        card.style.cssText=activityVisualStyle(activity.name);
        card.draggable=!window.matchMedia('(pointer:coarse)').matches;
        card.dataset.activityName=activity.name;

        card.addEventListener("dragstart",()=>{
            draggedActivity=activity;
            card.classList.add('reorder-source');
        });
        card.addEventListener("dragend",()=>card.classList.remove('reorder-source'));
        card.addEventListener("dragover",e=>e.preventDefault());
        card.addEventListener("drop",()=>{
            if(!draggedActivity || !moveActivityObject(draggedActivity,activity)) return;
            save();
            renderActivities();
        });

        installLongPressReorder(card,activity);
        card.onclick=e=>{
            if(Date.now()<suppressActivityClickUntil){
                e.preventDefault();
                return;
            }
            openRegister(activity.name);
        };
        card.setAttribute('aria-label',activity.name);
        card.innerHTML=`
            <div class="activity-icon"><i data-lucide="${activityIcon(activity.name)}"></i></div>
            <div class="activity-title-btn">${escapeHTML(activityButtonLabel(activity))}</div>
        `;
        document.getElementById("activitiesGrid").appendChild(card);
    });

    lucide.createIcons();
}


function renderMoodButtons(){
    const host=document.getElementById('moodGrid');
    const help=document.getElementById('moodHelp');
    if(!host || !help) return;
    const latest=lastMoodOfDay();
    host.innerHTML=MOOD_UI.map(m=>`
        <button type="button" class="mood-card ${latest?.mood===m.name?'active':''}"
            onclick="registerMood(${inlineArg(m.name)})" aria-label="Registrar ${escapeHTML(m.name)}">
            <i data-lucide="${m.icon}"></i><span>${escapeHTML(m.name)}</span>
        </button>`).join('');
    const all=moodRecordsForDate(todayISO());
    help.innerHTML=latest
        ? `<span>${all.length} ${all.length===1?'registro':'registros'} hoje · último ${escapeHTML(latest.startTime||'')}</span>
            <button type="button" class="mood-edit-recent" onclick="editRecord(${inlineArg(latest.id)})">Editar / observação</button>`
        : '<span>Um toque salva o estado e o horário. Observações são opcionais.</span>';
    lucide.createIcons();
}
function registerMood(name){
    if(!MOOD_UI.some(m=>m.name===name)) return;
    const now=new Date();
    const record={id:`mood-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
        recordType:'mood',activity:'Estado de hoje',mood:name,date:localDateISO(now),
        startTime:localTimeHHMM(now),createdAt:now.toISOString(),notes:''};
    records.push(record);
    save();
    renderMoodButtons();
    showToast(`${name} registrado. Use "Editar / observação" para complementar.`);
}

function createActivity(){
    const input=document.getElementById('newActivityName');
    const name=(input?.value || '').trim();
    if(!name){
        input?.focus();
        showToast('Informe o nome da atividade.','error');
        return;
    }
    if(activities.some(a=>a.name.trim().toLowerCase()===name.toLowerCase())){
        input?.focus();
        showToast('Essa atividade já existe.','error');
        return;
    }
    const icon=document.getElementById('newActivityIcon')?.value || 'circle-dot';

    const currentActivity=activities.find(a=>a.name===activityName);
    const currentIcon=currentActivity?.icon || ACTIVITY_ICONS[activityName] || 'circle-dot';
    const currentButtonColor=allowedButtonColor(currentActivity?.buttonColor)?.color || '';

    showModal('Editar atividade', `
        <div class="sheet-form">

            ` : ''}

function saveRenamedActivity(oldName){
    const input=document.getElementById('renameActivityName');
    const newName=(input?.value || '').trim();

    if(!newName){
        input?.focus();
        showToast('Informe o novo nome.','error');
        return;
    }

    const newIcon=document.getElementById('renameActivityIcon')?.value || 'circle-dot';
    const sameName=newName.toLowerCase()===String(oldName).trim().toLowerCase();

    const duplicate=activities.some(a=>
        a.name.trim().toLowerCase()===newName.toLowerCase() &&
        a.name.trim().toLowerCase()!==String(oldName).trim().toLowerCase()
    );

    if(duplicate){
        input?.focus();
        showToast('Já existe uma atividade com esse nome.','error');
        return;
    }

    const activity=activities.find(a=>a.name===oldName);

    if(!activity){
        showToast('Atividade não encontrada.','error');
        return;
    }

    activity.name=newName;
    activity.icon=newIcon;
    const buttonColor=allowedButtonColor(document.getElementById('renameActivityButtonColor')?.value)?.color;
    if(buttonColor) activity.buttonColor=buttonColor;
    else delete activity.buttonColor; // Padrão restaura as cores originais.
    const templateInput=document.getElementById('renameNotesTemplate');
    if(templateInput && Object.prototype.hasOwnProperty.call(activity,'notesTemplate')){
        activity.notesTemplate=templateInput.value;
    }

    if(!sameName){
        records.forEach(record=>{
            if(record.activity===oldName){
                record.activity=newName;
            }
        });
        weeklyPlans.forEach(plan=>{
            if(plan.activity===oldName){
                plan.activity=newName;
                plan.updatedAt=new Date().toISOString();
            }
        });
    }

    save();
    closeModal();
    refreshAfterRecordSave();
    showToast(sameName ? 'Atividade atualizada.' : `Atividade renomeada para "${newName}".`);
}

function formatDuration(min){
    if(min===60) return "1h";
    if(min===90) return "1h30";
    if(min===120) return "2h";
    if(min===180) return "3h";
    if(min===240) return "4h";
    return min+" min";
}

function setDuration(v, inputId='duration'){
    const input=document.getElementById(inputId);
    if(input) input.value=v;
    const scope=input?.closest('.sheet-form') || document;
    scope.querySelectorAll('.duration-chip').forEach(btn=>{
        btn.classList.toggle('active',Number(btn.dataset.duration)===Number(v));
    });
}

function syncDurationChips(inputId='duration'){
    const input=document.getElementById(inputId);
    if(!input) return;
    const scope=input.closest('.sheet-form') || document;
    scope.querySelectorAll('.duration-chip').forEach(btn=>{
        btn.classList.toggle('active',Number(btn.dataset.duration)===Number(input.value));
    });
}

function updateStateRange(inputId='value',outputId='stateReadout'){
    const input=document.getElementById(inputId);
    const output=document.getElementById(outputId);
    if(!input || !output) return;
    const v=Number(input.value);
    output.textContent=v>0?`+${v}`:String(v);
    output.classList.toggle('positive',v>0);
    output.classList.toggle('negative',v<0);
    output.classList.toggle('neutral',v===0);
}

function saveStateRecord(activity){
    const dateEl=document.getElementById('date');
    const valueEl=document.getElementById('value');
    const notesEl=document.getElementById('notes');
    const timeEl=document.getElementById('stateTime');
    if(!dateEl || !valueEl || !dateEl.value) return;

    const repeatable=isRepeatedState(activity);
    const time=timeEl?.value || '';
    if(repeatable && !/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){
        showToast('Informe a hora e o minuto da avaliação.','error');
        timeEl?.focus();
        return;
    }

    const record={
        id:`${Date.now()}-${Math.random().toString(36).slice(2,9)}`,
        activity,
        date:dateEl.value,
        value:Number(valueEl.value),
        notes:notesEl?.value || ''
    };
    if(time)record.startTime=time;
    record.createdAt=new Date().toISOString();
    records.push(record);

    save();
    closeModal();
    refreshAfterRecordSave();
    showToast('Estado registrado.');
}

function saveActivityRecord(activity){
    const dateEl=document.getElementById('date');
    const startEl=document.getElementById('startTime');
    const durationEl=document.getElementById('duration');
    const notesEl=document.getElementById('notes');
    if(!dateEl?.value || (activity!=='Recompensa' && !durationEl)){
        showToast('Informe a data do registro.','error');
        return;
    }

    records.push({
        id:Date.now(),
        activity,
        date:dateEl.value,
        startTime:startEl?.value || '',
        duration:activity==='Recompensa' ? 0 : Math.max(1,Number(durationEl.value)||30),
        notes:isMorningRoutine(activity)?readMorningRoutineNotes():(notesEl?.value || '')
    });

    save();
    closeModal();
    refreshAfterRecordSave();
    showToast('Atividade registrada.');
}
